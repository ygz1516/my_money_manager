name: Build Deposit Manager APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04          # 固定 Ubuntu 版本，避免迁移影响

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5   # 升级到 v5（支持 Node 24）

      - name: Setup Java
        uses: actions/setup-java@v5 # 升级到 v5（支持 Node 24）
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Node.js
        uses: actions/setup-node@v5 # 升级到 v5（支持 Node 24）
        with:
          node-version: '20'        # 注意：这里设置的是工作流内部使用的 Node 版本，与 Action 运行时无关

      - name: Install Cordova & cordova-res
        run: |
          npm install -g cordova
          npm install -g cordova-res

      - name: Build APK with Cordova
        run: |
          # 1. 创建 Cordova 项目
          cordova create deposit-app com.deposit.manager "存款管家"
          cd deposit-app

          # 2. 覆盖默认的 index.html
          cp ../index.html www/index.html

          # 3. 准备图标资源
          mkdir -p resources
          cp ../icon.png resources/icon.png

          # 4. 修改 config.xml：开启 AndroidX + 声明生物识别权限
          sed -i '/<\/widget>/i \    <preference name="AndroidXEnabled" value="true" />' config.xml
          sed -i '/<\/widget>/i \    <platform name="android">\n        <config-file target="AndroidManifest.xml" parent="/manifest">\n            <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n            <uses-permission android:name="android.permission.USE_FINGERPRINT" />\n        </config-file>\n    </platform>' config.xml

          # 5. 添加必需插件
          cordova plugin add cordova-plugin-file
          cordova plugin add cordova-plugin-android-permissions
          cordova plugin add cordova-plugin-file-opener2
          cordova plugin add cordova-plugin-fingerprint-aio --variable FACEID_USAGE_DESCRIPTION="使用面容ID解锁存款管家"

          # 6. 添加 Android 平台
          cordova platform add android

          # 7. 生成并写入全套 Android 图标
          cordova-res android --skip-config --copy

          # 8. 构建 Debug APK
          cordova build android

          # 9. 复制 APK 到输出目录
          mkdir -p ../output
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../output/deposit-manager-$(date +'%Y%m%d-%H%M%S').apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v6
        with:
          name: deposit-manager-apk
          path: output/*.apk

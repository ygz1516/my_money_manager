name: Build Deposit Manager APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install Cordova & cordova-res
        run: |
          npm install -g cordova
          npm install -g cordova-res

      - name: Build APK with Cordova
        run: |
          # 1. 创建 Cordova 项目
          cordova create deposit-app com.deposit.manager "存款管家"
          cd deposit-app

          # 2. 覆盖默认的 index.html
          cp ../index.html www/index.html

          # 3. 准备图标资源
          mkdir -p resources
          cp ../icon.png resources/icon.png
          # 检查图标尺寸是否为 1024x1024（如果不是，请自行处理）
          file resources/icon.png

          # 4. 直接生成干净的 config.xml（避免 sed 导致的 XML 错误）
          cat > config.xml <<EOF
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.deposit.manager" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>存款管家</name>
              <description>存款管理助手</description>
              <author email="dev@example.com" href="#">Deposit Manager</author>
              <content src="index.html" />
              <preference name="AndroidXEnabled" value="true" />
              <platform name="android">
                  <config-file target="AndroidManifest.xml" parent="/manifest">
                      <uses-permission android:name="android.permission.USE_BIOMETRIC" />
                      <uses-permission android:name="android.permission.USE_FINGERPRINT" />
                  </config-file>
              </platform>
          </widget>
          EOF

          # 5. 添加必需插件
          cordova plugin add cordova-plugin-file
          cordova plugin add cordova-plugin-android-permissions
          cordova plugin add cordova-plugin-file-opener2
          cordova plugin add cordova-plugin-fingerprint-aio --variable FACEID_USAGE_DESCRIPTION="使用面容ID解锁存款管家"

          # 6. 添加 Android 平台
          cordova platform add android

          # 7. 生成图标（如果 icon.png 小于 1024x1024 这里会报错，可先注释掉）
          # cordova-res android --skip-config --copy

          # 8. 构建 Debug APK
          cordova build android

          # 9. 复制 APK 到输出目录
          mkdir -p ../output
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../output/deposit-manager-$(date +'%Y%m%d-%H%M%S').apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v6
        with:
          name: deposit-manager-apk
          path: output/*.apk

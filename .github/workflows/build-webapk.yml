name: Build Deposit Manager APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build APK with Cordova
        run: |
          # 1. 创建 Cordova 项目
          cordova create deposit-app com.deposit.manager "存款管家"
          cd deposit-app
          
          # 2. 覆盖默认的 index.html
          cp ../index.html www/index.html
          
          # 3. 复制图标并替换默认图标路径
          cp ../icon.png icon.png
          sed -i 's|res/icon.png|icon.png|g' config.xml
          
          # 4. 添加必需插件（网页版需要的文件操作、权限、打开文件夹）
          cordova plugin add cordova-plugin-file
          cordova plugin add cordova-plugin-android-permissions
          cordova plugin add cordova-plugin-file-opener2
          
          # 5. 添加 Android 平台
          cordova platform add android
          
          # 6. 构建 Debug APK
          cordova build android
          
          # 7. 创建输出目录并复制 APK（加时间戳防覆盖）
          mkdir -p ../output
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../output/deposit-manager-$(date +'%Y%m%d-%H%M%S').apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deposit-manager-apk
          path: output/*.apk

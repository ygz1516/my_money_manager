name: Build Deposit Manager APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-33
            platforms;android-34
            build-tools;33.0.2
            build-tools;34.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install Cordova & cordova-res
        run: |
          npm install -g cordova
          npm install -g cordova-res

      - name: Check required files
        run: |
          echo "=== 仓库根目录文件 ==="
          ls -la
          test -f index.html || (echo "❌ 缺少 index.html" && exit 1)
          test -f icon.png || (echo "❌ 缺少 icon.png" && exit 1)
          echo "✅ 必需文件都在"

      - name: Check icon.png dimensions
        run: |
          echo "=== 检查 icon.png 尺寸 ==="
          file icon.png
          if command -v identify >/dev/null 2>&1; then
            identify icon.png || true
          fi

      - name: Build APK with Cordova
        run: |
          set -e

          echo "===== 1. 创建 Cordova 项目 ====="
          cordova create deposit-app com.deposit.manager "存款管家"
          cd deposit-app

          echo "===== 2. 覆盖 index.html ====="
          cp ../index.html www/index.html

          echo "===== 3. 修改 config.xml：开启 AndroidX ====="
          sed -i '/<\/widget>/i \    <preference name="AndroidXEnabled" value="true" />' config.xml

          echo "===== 4. 添加插件 ====="
          cordova plugin add cordova-plugin-file
          cordova plugin add cordova-plugin-android-permissions
          cordova plugin add cordova-plugin-file-opener2
          cordova plugin add cordova-plugin-fingerprint-aio --variable FACEID_USAGE_DESCRIPTION="使用面容ID解锁存款管家"

          echo "===== 5. 添加 Android 平台 ====="
          cordova platform add android@12

          echo "===== 6. 自动生成并替换所有图标（只处理图标，跳过启动图） ====="
          mkdir -p resources
          cp ../icon.png resources/icon.png
          cordova-res android --skip-config --copy --type icon
          echo "✅ 图标已生成"

          echo "===== 7. 构建 APK ====="
          cordova build android --verbose

          echo "===== 8. 复制 APK 到输出目录 ====="
          mkdir -p ../output
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk \
             ../output/deposit-manager-$(date +'%Y%m%d-%H%M%S').apk
          echo "✅ 构建完成"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v6
        with:
          name: deposit-manager-apk
          path: output/*.apk

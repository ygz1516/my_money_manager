name: Build Deposit Manager APK

on:
  workflow_dispatch:        # 手动触发（在 Actions 页面点击按钮）
  push:
    paths:
      - 'index.html'        # 当 index.html 更新时自动构建

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4   # 修复1：升级到 v4，避开已删除的 tools 包
        with:
          packages: 'platform-tools'             # 修复2：明确只安装 platform-tools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build APK with Cordova
        run: |
          # 1. 创建 Cordova 项目
          cordova create deposit-app com.deposit.manager "存款管家"
          cd deposit-app
          
          # 2. 覆盖默认的 index.html
          cp ../index.html www/index.html
          
          # 3. 复制图标并修改 config.xml（加入图标）
          cp ../icon.png icon.png
          # 将 Cordova 默认的图标路径替换为你上传的 icon.png
          sed -i 's|res/icon.png|icon.png|g' config.xml
          
          # 4. 添加必需插件
          cordova plugin add cordova-plugin-file
          cordova plugin add cordova-plugin-android-permissions
          cordova plugin add cordova-plugin-file-opener2
          
          # 5. 添加 Android 平台
          cordova platform add android
          
          # 6. 构建 Debug APK（无需签名，可直接安装）
          cordova build android
          
          # 7. 创建输出目录并复制 APK（加上时间戳避免覆盖）
          mkdir -p ../output
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../output/deposit-manager-$(date +'%Y%m%d-%H%M%S').apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deposit-manager-apk
          path: output/*.apk

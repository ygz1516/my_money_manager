name: Build Flet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build APK with Flet
        uses: flet-dev/build-action@v1
        with:
          path: .
          output: apk
          package-name: com.yourdomain.mymoneymanager
          app-version: 1.0.0
          app-version-code: 1
          app-name: 家庭存款管理
          app-description: 家庭存款管理工具
          build-command: flet build apk --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-money-manager-apk
          path: ./build/apk/*.apk

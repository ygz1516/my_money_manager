<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>存款管家 · 旗舰版</title>
    <!-- 引入必要库 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- 新增：html2canvas 用于解决PDF乱码 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* 样式保持不变，完整样式见下方完整代码 */
        :root {
            --bg: #f0f4f8;
            --card-bg: #ffffff;
            --text: #1a202c;
            --text-secondary: #5a6c7d;
            --primary: #4f6ef7;
            --primary-hover: #3b54db;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #6366f1;
            --border: #e2e8f0;
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.08), 0 4px 10px rgba(0, 0, 0, 0.04);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 8px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace;
            --duplicate-bg: #fffdf5;
            --duplicate-border: #fbbf24;
            --expired-bg: #fef2f2;
            --expired-border: #fca5a5;
            --soon-bg: #fffbeb;
            --soon-border: #fcd34d;
            --safe-bg: #f0fdf4;
            --safe-border: #86efac;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 12px;
            padding-bottom: 100px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            background-image: radial-gradient(ellipse at 0% 0%, #e8ecf8 0%, transparent 60%),
                radial-gradient(ellipse at 100% 100%, #e8f4f0 0%, transparent 60%);
            background-attachment: fixed;
        }

        .app-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 14px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        .card:hover {
            box-shadow: var(--shadow-lg);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
        }
        .app-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .app-title .icon {
            font-size: 1.8rem;
        }

        button,
        .btn-like {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            background: var(--primary);
            border: none;
            color: #fff;
            padding: 9px 16px;
            border-radius: 24px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            letter-spacing: 0.01em;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        button:active {
            transform: scale(0.96);
            transition: transform 0.1s;
        }
        button:hover {
            background: var(--primary-hover);
            box-shadow: 0 4px 12px rgba(79, 110, 247, 0.35);
        }
        button.secondary {
            background: #64748b;
        }
        button.secondary:hover {
            background: #475569;
            box-shadow: 0 4px 12px rgba(100, 116, 139, 0.35);
        }
        button.danger {
            background: var(--danger);
        }
        button.danger:hover {
            background: #dc2626;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.35);
        }
        button.warning {
            background: var(--warning);
            color: #1a202c;
        }
        button.warning:hover {
            background: #e5a000;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.35);
        }
        button.success {
            background: var(--success);
        }
        button.success:hover {
            background: #059669;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
        }
        button.small {
            padding: 6px 13px;
            font-size: 0.78rem;
            border-radius: 20px;
        }
        button.xs {
            padding: 4px 10px;
            font-size: 0.7rem;
            border-radius: 16px;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }
        button.ghost {
            background: transparent;
            color: var(--primary);
            border: 1.5px solid var(--primary);
        }
        button.ghost:hover {
            background: #4f6ef710;
            box-shadow: none;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px 14px;
            margin: 5px 0 10px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-xs);
            font-size: 0.9rem;
            font-family: inherit;
            background: #fafbfc;
            transition: var(--transition);
            color: var(--text);
        }
        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 110, 247, 0.1);
            background: #fff;
        }
        input[type="date"] {
            min-width: 130px;
        }
        datalist {
            display: none;
        }
        textarea {
            resize: vertical;
            min-height: 50px;
        }

        .status-bar {
            background: #f8fafc;
            padding: 10px 14px;
            border-radius: 24px;
            font-size: 0.78rem;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            border: 1px solid var(--border);
            font-weight: 500;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 14px;
            font-size: 0.72rem;
            font-weight: 600;
        }
        .status-badge.warn {
            background: #fef3c7;
            color: #92400e;
        }
        .status-badge.info {
            background: #e0e7ff;
            color: #3730a3;
        }
        .status-badge.success {
            background: #d1fae5;
            color: #065f46;
        }

        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .flex-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .batch-bar {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-bar input {
            border-radius: 24px;
            padding: 10px 16px;
            font-size: 0.9rem;
            background: #f8fafc;
            border: 1.5px solid var(--border);
            margin-bottom: 8px;
        }

        .deposit-list-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .deposit-item {
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            border: 1.5px solid var(--border);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        .deposit-item:hover {
            border-color: #c4cfe0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        .deposit-item.duplicate {
            background: var(--duplicate-bg);
            border-left: 4px solid var(--duplicate-border);
            padding-left: 13px;
        }
        .deposit-item.expired {
            background: var(--expired-bg);
            border-left: 4px solid var(--expired-border);
            padding-left: 13px;
        }
        .deposit-item.soon {
            background: var(--soon-bg);
            border-left: 4px solid var(--soon-border);
            padding-left: 13px;
        }
        .deposit-item.safe {
            border-left: 4px solid var(--safe-border);
            padding-left: 13px;
        }
        .deposit-checkbox {
            flex-shrink: 0;
            padding-top: 3px;
        }
        .deposit-checkbox input {
            width: 20px;
            height: 20px;
            margin: 0;
            cursor: pointer;
            accent-color: var(--primary);
            border-radius: 4px;
        }
        .deposit-info {
            flex: 1;
            min-width: 0;
        }
        .deposit-info .bank-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text);
        }
        .deposit-info .deposit-type-tag {
            font-size: 0.75rem;
            background: #f1f5f9;
            color: #475569;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 6px;
            font-weight: 500;
        }
        .deposit-info .amount-display {
            font-weight: 700;
            font-size: 1.15rem;
            color: #059669;
            font-family: var(--font-mono);
            letter-spacing: -0.01em;
        }
        .deposit-info .interest-row {
            color: #e67e22;
            font-size: 0.8rem;
            font-weight: 500;
            margin-top: 2px;
        }
        .deposit-info .date-row {
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        .deposit-info .countdown-badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 10px;
            margin-top: 3px;
        }
        .countdown-badge.overdue {
            background: #fee2e2;
            color: #991b1b;
        }
        .countdown-badge.urgent {
            background: #fef3c7;
            color: #92400e;
            animation: pulse-badge 2s ease-in-out infinite;
        }
        .countdown-badge.normal {
            background: #e0f2fe;
            color: #075985;
        }
        .countdown-badge.far {
            background: #f0fdf4;
            color: #065f46;
        }
        @keyframes pulse-badge {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }
        .deposit-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
            flex-wrap: wrap;
            align-items: flex-start;
        }
        .deposit-notes {
            font-size: 0.73rem;
            color: #6b7280;
            background: #f9fafb;
            padding: 3px 8px;
            border-radius: 6px;
            display: inline-block;
            margin-top: 2px;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #9ca3af;
        }
        .empty-state .empty-icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }
        .empty-state p {
            font-size: 0.9rem;
            margin: 4px 0;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.55);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.2s ease;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .modal-content {
            background: var(--card-bg);
            width: 92%;
            max-width: 520px;
            max-height: 88%;
            border-radius: 20px;
            padding: 22px;
            overflow-y: auto;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.25s ease;
        }
        .modal-content h3 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 14px;
            text-align: center;
            letter-spacing: -0.01em;
        }
        .modal-content label {
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            display: block;
            margin-top: 4px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .badge {
            display: inline-block;
            background: #eef2ff;
            padding: 4px 10px;
            border-radius: 14px;
            font-size: 0.72rem;
            font-weight: 500;
        }

        .filter-toggle-btn {
            display: none;
            background: #f1f5f9;
            color: #475569;
            border: 1.5px solid var(--border);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            text-align: center;
            margin-bottom: 8px;
            transition: var(--transition);
        }
        .filter-toggle-btn:hover {
            background: #e2e8f0;
        }
        .filter-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: flex-end;
            margin-bottom: 10px;
            transition: max-height 0.35s ease, opacity 0.3s ease;
            overflow: hidden;
        }
        .filter-panel.collapsed {
            max-height: 0 !important;
            opacity: 0;
            margin-bottom: 0;
            pointer-events: none;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #475569;
            min-width: 100px;
        }
        .filter-group span {
            white-space: nowrap;
            font-size: 0.68rem;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }
        .filter-group input,
        .filter-group select {
            width: auto;
            min-width: 100px;
            margin: 0;
            padding: 7px 10px;
            font-size: 0.8rem;
            border-radius: 8px;
        }
        .date-range {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        .date-range input {
            min-width: 120px;
            width: auto;
        }

        .toast-msg {
            position: fixed;
            bottom: 28px;
            left: 16px;
            right: 16px;
            background: rgba(15, 23, 42, 0.9);
            color: #fff;
            text-align: center;
            padding: 12px 20px;
            border-radius: 28px;
            z-index: 2000;
            font-size: 0.82rem;
            font-weight: 500;
            transition: opacity 0.35s ease, transform 0.3s ease;
            pointer-events: none;
            word-break: break-all;
            letter-spacing: 0.01em;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .chart-container {
            height: 240px;
            margin-top: 8px;
        }
        .chart-card {
            background: #fff;
            border-radius: 14px;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
        }

        .sort-row {
            display: flex;
            gap: 6px;
            align-items: center;
            font-size: 0.75rem;
            margin-bottom: 10px;
        }
        .sort-row select {
            width: auto;
            min-width: 110px;
            margin: 0;
            padding: 6px 10px;
            font-size: 0.78rem;
            border-radius: 16px;
        }
        .sort-row span {
            font-weight: 600;
            color: #64748b;
            white-space: nowrap;
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 8px;
            margin-bottom: 12px;
        }
        .summary-card {
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            border: 1px solid var(--border);
            text-align: center;
            transition: var(--transition);
        }
        .summary-card .sc-value {
            font-size: 1.3rem;
            font-weight: 700;
            font-family: var(--font-mono);
            letter-spacing: -0.02em;
        }
        .summary-card .sc-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 2px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .summary-card.principal .sc-value {
            color: #1a56db;
        }
        .summary-card.interest .sc-value {
            color: #e67e22;
        }
        .summary-card.count .sc-value {
            color: #7c3aed;
        }

        @media (max-width: 640px) {
            body {
                padding: 8px;
                padding-bottom: 100px;
            }
            .card {
                padding: 12px;
                border-radius: 14px;
            }
            .app-title {
                font-size: 1.25rem;
            }
            .header {
                gap: 6px;
            }
            .header button {
                font-size: 0.73rem;
                padding: 7px 11px;
                border-radius: 18px;
            }
            .deposit-item {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
                padding: 12px;
            }
            .deposit-checkbox {
                align-self: flex-start;
            }
            .deposit-actions {
                justify-content: flex-end;
            }
            .deposit-info .amount-display {
                font-size: 1rem;
            }
            .filter-panel {
                gap: 6px;
            }
            .filter-group {
                min-width: 80px;
            }
            .filter-group input,
            .filter-group select {
                min-width: 80px;
                font-size: 0.73rem;
                padding: 6px 8px;
            }
            .filter-toggle-btn {
                display: block;
            }
            .filter-panel {
                max-height: 2000px;
            }
            .filter-panel.collapsed {
                max-height: 0 !important;
            }
            .summary-cards {
                grid-template-columns: repeat(2, 1fr);
                gap: 6px;
            }
            .summary-card {
                padding: 10px;
            }
            .summary-card .sc-value {
                font-size: 1.1rem;
            }
            .flex-between>div:first-child {
                display: flex;
                flex-wrap: wrap;
                gap: 5px;
                margin-bottom: 6px;
            }
            .batch-bar {
                margin-top: 4px;
                justify-content: flex-start;
            }
            .sort-row {
                flex-wrap: wrap;
            }
        }
        @media (max-width: 380px) {
            .header button {
                font-size: 0.68rem;
                padding: 5px 9px;
            }
            .app-title {
                font-size: 1.1rem;
            }
            .filter-group input,
            .filter-group select {
                min-width: 65px;
                font-size: 0.7rem;
            }
            .date-range input {
                min-width: 100px;
            }
        }
    </style>
</head>
<body>
    <div id="app" class="app-container">
        <div class="card">
            <div class="header">
                <div class="app-title"><span class="icon">💰</span>存款管家 · 旗舰版</div>
                <div class="flex-row">
                    <select id="userSelect" style="width:auto;min-width:120px;margin:0;padding:8px 12px;border-radius:20px;font-weight:600;font-size:0.82rem;background:#f8fafc;"></select>
                    <button id="addUserBtn" class="small ghost" title="添加用户">➕</button>
                    <button id="manageUserBtn" class="small secondary" title="管理用户">📋</button>
                    <button id="statsBtn" class="small" title="统计图表">📊</button>
                    <button id="remindBtn" class="small warning" title="到期提醒">⏰</button>
                    <button id="forecastBtn" class="small warning" title="到期预测">📈</button>
                    <button id="fixDataBtn" class="small ghost" title="修复重复数据">🔧</button>
                </div>
            </div>
            <div class="status-bar" id="statusBar">
                <span id="statsText" style="font-weight:600;"></span>
                <span id="duplicateWarning"></span>
                <span id="selectedStats"></span>
            </div>
            <div class="summary-cards" id="summaryCards">
                <div class="summary-card principal"><div class="sc-value" id="scPrincipal">¥0</div><div class="sc-label">💰 本金总额</div></div>
                <div class="summary-card interest"><div class="sc-value" id="scCurrInterest">¥0</div><div class="sc-label">💹 当前利息</div></div>
                <div class="summary-card interest"><div class="sc-value" id="scMatInterest">¥0</div><div class="sc-label">📅 到期利息</div></div>
                <div class="summary-card count"><div class="sc-value" id="scCount">0</div><div class="sc-label">📋 存款笔数</div></div>
            </div>
            <button class="filter-toggle-btn" id="filterToggleBtn">🔍 展开筛选条件</button>
            <div class="filter-panel" id="filterPanel">
                <div class="filter-group"><span>🏦 银行</span><select id="filterBank"><option value="">所有银行</option></select></div>
                <div class="filter-group"><span>📂 类型</span><select id="filterType"><option value="">所有类型</option></select></div>
                <div class="filter-group"><span>👤 持有人</span><select id="filterHolder"><option value="">所有持有人</option></select></div>
                <div class="filter-group"><span>💰 金额范围</span><div style="display:flex;gap:5px;"><input type="number" id="minAmount" placeholder="最小" style="width:80px;"><input type="number" id="maxAmount" placeholder="最大" style="width:80px;"></div></div>
                <div class="filter-group"><span>📅 存入日期</span>
                    <div class="date-range"><input type="date" id="startDateFrom"><span>至</span><input type="date" id="startDateTo"></div>

    <script src="cordova.js"></script>
    <script>
        (function() {
            const PRESET_BANKS = [
                "中国工商银行", "中国建设银行", "中国农业银行", "中国银行", "交通银行",
                "重庆银行", "重庆农村商业银行", "微众银行", "蓝海银行", "邮储银行",
                "招商银行", "浦发银行", "中信银行", "其他银行", "微信理财", "支付宝理财", "股票基金"
            ];
            const PRESET_DEPOSIT_TYPES = [
                "活期", "一年期定期", "三年期定期", "五年期定期", "大额存单",
                "结构性存款", "通知存款", "理财产品", "货币基金", "股票基金", "其他",
                "现金管理类理财", "固收类理财", "权益类理财", "混合类理财",
                "结构性存款(保本)", "结构性存款(非保本)", "大额存单(可转让)", "大额存单(不可转让)",
                "智能存款", "七日通知存款", "一个月定期", "三个月定期", "六个月定期"
            ];

            const DB_NAME = 'DepositDB';
            const DB_VERSION = 4;
            let db = null;

            function openDB() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(DB_NAME, DB_VERSION);
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => { db = request.result;
                        resolve(db); };
                    request.onupgradeneeded = (e) => {
                        const database = e.target.result;
                        if (!database.objectStoreNames.contains('users')) database.createObjectStore(
                            'users', { keyPath: 'name' });
                        if (!database.objectStoreNames.contains('deposits')) {
                            const store = database.createObjectStore('deposits', { keyPath: 'id',
                                autoIncrement: true });
                            store.createIndex('user', 'user', { unique: false });
                        }
                        if (!database.objectStoreNames.contains('rate_history')) {
                            const store = database.createObjectStore('rate_history', { keyPath: 'id',
                                autoIncrement: true });
                            store.createIndex('deposit_id', 'deposit_id', { unique: false });
                        }
                    };
                });
            }

            async function getStore(storeName, mode = 'readonly') {
                if (!db) await openDB();
                return db.transaction(storeName, mode).objectStore(storeName);
            }

            // ---------- 用户操作 ----------
            async function getUsers() {
                const store = await getStore('users');
                const all = await new Promise(resolve => { const req = store.getAll();
                    req.onsuccess = () => resolve(req.result); });
                return all.map(u => u.name);
            }
            async function addUser(name) {
                if (!name) return false;
                if (name === '默认用户') { alert('不能添加"默认用户"作为普通用户'); return false; }
                const users = await getUsers();
                if (users.includes(name)) return false;
                const store = await getStore('users', 'readwrite');
                await store.add({ name });
                return true;
            }
            async function deleteUser(name) {
                const users = await getUsers();
                if (!users.includes(name)) return false;
                const deposits = await getDeposits(name);
                if (deposits.length > 0) { alert(`用户 ${name} 有 ${deposits.length} 笔存款，请先删除该用户下的所有存款后再删除用户。`);
                    return false; }
                const store = await getStore('users', 'readwrite');
                await store.delete(name);
                return true;
            }
            async function renameUser(oldName, newName) {
                if (!newName || newName === oldName) return false;
                const users = await getUsers();
                if (users.includes(newName)) return false;
                const userStore = await getStore('users', 'readwrite');
                await userStore.delete(oldName);
                await userStore.add({ name: newName });
                const depStore = await getStore('deposits', 'readwrite');
                const all = await new Promise(resolve => { const req = depStore.getAll();
                    req.onsuccess = () => resolve(req.result); });
                for (let d of all) {
                    if (d.user === oldName) { d.user = newName;
                        await depStore.put(d); }
                }
                return true;
            }

            // ---------- 存款操作 ----------
            async function getDeposits(user) {
                if (!user) return await getAllDeposits();
                const store = await getStore('deposits');
                const index = store.index('user');
                const items = await new Promise(resolve => { const req = index.getAll(user);
                    req.onsuccess = () => resolve(req.result); });
                return items.map(d => ({ ...d, id: d.id }));
            }
            async function getAllDeposits() {
                const store = await getStore('deposits');
                const all = await new Promise(resolve => { const req = store.getAll();
                    req.onsuccess = () => resolve(req.result); });
                return all.map(d => ({ ...d, id: d.id }));
            }
            async function saveDeposit(deposit) {
                const store = await getStore('deposits', 'readwrite');
                let isNew = !deposit.id;
                let savedId;
                if (deposit.id) { await store.put(deposit);
                    savedId = deposit.id; } else { delete deposit.id;
                    savedId = await new Promise(resolve => { const req = store.add(deposit);
                        req.onsuccess = () => resolve(req.result); });
                    deposit.id = savedId; }
                if (isNew && deposit.startDate && deposit.rate != null && !isNaN(deposit.rate)) {
                    const rateStore = await getStore('rate_history', 'readwrite');
                    await rateStore.add({ deposit_id: savedId, effective_date: deposit.startDate,
                        interest_rate: deposit.rate });
                } else if (!isNew && deposit.startDate && deposit.rate != null && !isNaN(deposit.rate)) {
                    const rateStore = await getStore('rate_history', 'readwrite');
                    const idx = rateStore.index('deposit_id');
                    const existing = await new Promise(resolve => { const req = idx.getAll(savedId);
                        req.onsuccess = () => resolve(req.result); });
                    if (existing.length === 0) {
                        await rateStore.add({ deposit_id: savedId, effective_date: deposit.startDate,
                            interest_rate: deposit.rate });
                    } else {
                        const first = existing[0];
                        first.interest_rate = deposit.rate;
                        first.effective_date = deposit.startDate;
                        await rateStore.put(first);
                    }
                }
                return savedId;
            }
            async function deleteDeposit(id) {
                const store = await getStore('deposits', 'readwrite');
                await store.delete(id);
                const rateStore = await getStore('rate_history', 'readwrite');
                const idx = rateStore.index('deposit_id');
                const rates = await new Promise(resolve => { const req = idx.getAll(id);
                    req.onsuccess = () => resolve(req.result); });
                for (let r of rates) await rateStore.delete(r.id);
            }
            async function deleteDeposits(ids) { for (let id of ids) await deleteDeposit(id); }
            async function unlockDeposit(id) {
                const store = await getStore('deposits', 'readwrite');
                const dep = await new Promise(resolve => { const req = store.get(id);
                    req.onsuccess = () => resolve(req.result); });
                if (dep) { dep.is_unlocked = 1;
                    await store.put(dep); }
            }

            // ---------- 利率历史 ----------
            async function getRateHistory(depositId) {
                const store = await getStore('rate_history');
                const idx = store.index('deposit_id');
                const items = await new Promise(resolve => { const req = idx.getAll(depositId);
                    req.onsuccess = () => resolve(req.result); });
                return items.sort((a, b) => new Date(a.effective_date) - new Date(b.effective_date));
            }
            async function addRateChange(depositId, effectiveDate, interestRate) {
                const store = await getStore('rate_history', 'readwrite');
                const existing = await getRateHistory(depositId);
                if (existing.some(r => r.effective_date === effectiveDate)) return false;
                await store.add({ deposit_id: depositId, effective_date: effectiveDate, interest_rate: interestRate });
                return true;
            }
            async function deleteRateChange(rateId) {
                const store = await getStore('rate_history', 'readwrite');
                await store.delete(rateId);
            }

            // ---------- 日期工具 ----------
            function parseDate(dateStr) {
                if (!dateStr) return null;
                let d = new Date(dateStr);
                if (!isNaN(d.getTime())) return d;
                let parts = dateStr.split(/[-\/]/);
                if (parts.length === 3) {
                    let year = parseInt(parts[0]),
                        month = parseInt(parts[1]) - 1,
                        day = parseInt(parts[2]);
                    d = new Date(year, month, day);
                    if (!isNaN(d.getTime())) return d;
                }
                if (/^\d{8}$/.test(dateStr)) {
                    let year = parseInt(dateStr.slice(0, 4)),
                        month = parseInt(dateStr.slice(4, 6)) - 1,
                        day = parseInt(dateStr.slice(6, 8));
                    d = new Date(year, month, day);
                    if (!isNaN(d.getTime())) return d;
                }
                return null;
            }

            function formatDate(date) {
                if (!date) return null;
                const y = date.getFullYear();
                const m = String(date.getMonth() + 1).padStart(2, '0');
                const d = String(date.getDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;
            }

            function todayStart() { const t = new Date();
                t.setHours(0, 0, 0, 0); return t; }

            // ---------- 利息计算 ----------
            async function calculateInterest(deposit, asOfDate = null) {
                const { startDate, maturityDate, amount, rate, interestType, id } = deposit;
                if (!startDate || amount <= 0 || rate == null || isNaN(rate)) return 0;
                const start = parseDate(startDate);
                if (!start) return 0;
                let asOf = asOfDate ? (typeof asOfDate === 'string' ? parseDate(asOfDate) : asOfDate) : new Date();
                if (!asOf || isNaN(asOf.getTime())) asOf = new Date();
                let end = maturityDate ? parseDate(maturityDate) : null;
                let actualEnd = end ? (asOf < end ? asOf : end) : asOf;
                if (actualEnd <= start) return 0;
                let periods = [];
                if (id) {
                    const hist = await getRateHistory(id);
                    if (hist.length > 0) {
                        let prevDate = start;
                        for (let h of hist) {
                            let eff = parseDate(h.effective_date);
                            if (eff && eff > start) {
                                if (prevDate < eff) {
                                    periods.push({ start: prevDate, end: eff < actualEnd ? eff : actualEnd,
                                        rate: h.interest_rate });
                                }
                                prevDate = eff;
                            }
                        }
                        if (prevDate < actualEnd) {
                            let lastRate = hist[hist.length - 1].interest_rate;
                            periods.push({ start: prevDate, end: actualEnd, rate: lastRate });
                        }
                    } else {
                        periods.push({ start, end: actualEnd, rate });
                    }
                } else {
                    periods.push({ start, end: actualEnd, rate });
                }
                let total = 0;
                for (let p of periods) {
                    if (p.end <= p.start) continue;
                    const days = (p.end - p.start) / (1000 * 3600 * 24);
                    const dailyRate = p.rate / 100 / 365;
                    if (interestType === 'compound') {
                        total += amount * (Math.pow(1 + dailyRate, days) - 1);
                    } else {
                        total += dailyRate * amount * days;
                    }
                }
                return Math.round(total * 100) / 100;
            }
            async function calculateTotalInterest(deposit) {
                if (!deposit.maturityDate) return 0;
                const mat = parseDate(deposit.maturityDate);
                if (!mat) return 0;
                return await calculateInterest(deposit, mat);
            }
            async function enrichDeposits(deposits) {
                for (let d of deposits) {
                    d.amount = Number(d.amount);
                    if (isNaN(d.amount)) d.amount = 0;
                    d.currentInterest = await calculateInterest(d);
                    d.totalInterest = await calculateTotalInterest(d);
                    d._matDate = d.maturityDate ? parseDate(d.maturityDate) : null;
                    d._startDate = d.startDate ? parseDate(d.startDate) : null;
                }
                return deposits;
            }

            // ---------- 到期状态 ----------
            function getMaturityStatus(dep) {
                if (!dep._matDate) return 'none';
                const now = todayStart();
                const mat = dep._matDate;
                mat.setHours(0, 0, 0, 0);
                const diffDays = Math.floor((mat - now) / (1000 * 3600 * 24));
                if (diffDays < 0) return 'expired';
                if (diffDays <= 7) return 'urgent';
                if (diffDays <= 30) return 'soon';
                return 'safe';
            }

            // ======================== 备份与恢复 ========================
            function showToast(msg, duration = 4000) {
                let toast = document.querySelector('.toast-msg');
                if (!toast) { toast = document.createElement('div');
                    toast.className = 'toast-msg';
                    document.body.appendChild(toast); }
                toast.textContent = msg;
                toast.style.opacity = '1';
                toast.style.transform = 'translateY(0)';
                clearTimeout(toast._timeout);
                toast._timeout = setTimeout(() => { toast.style.opacity = '0';
                    toast.style.transform = 'translateY(10px)'; }, duration);
            }

            function escapeCSV(cell) {
                if (cell === undefined || cell === null) return '';
                const str = String(cell);
                if (str.includes(',') || str.includes('"') || str.includes('\n') || str.includes('\r'))
                    return '"' + str.replace(/"/g, '""') + '"';
                return str;
            }

            function generateCSVBlob(user, deposits) {
                const sorted = [...deposits].sort((a, b) => (a.maturityDate || '9999-12-31') > (b
                    .maturityDate || '9999-12-31') ? 1 : -1);
                const rows = [];
                for (let i = 0; i < sorted.length; i++) {
                    const d = sorted[i];
                    rows.push([
                        (i + 1).toString(), d.user, d.bank, d.depositType, d.amount.toFixed(2),
                        d.startDate || '', d.maturityDate || '',
                        d.rate != null ? d.rate.toFixed(2) : '',
                        d.interestType === 'compound' ? 'compound' : 'simple',
                        d.notes || '', d.is_unlocked ? '是' : '否'
                    ]);
                }
                const headers = ['序号', '用户', '银行', '存款名称', '金额(元)', '存入日期', '到期日期', '利率(%)', '计息类型', '备注',
                    '解锁状态'
                ];
                const csvLines = [headers, ...rows];
                const csvContent = csvLines.map(row => row.map(cell => escapeCSV(cell)).join(',')).join('\n');
                return "\uFEFF" + csvContent;
            }

            function fallbackDownload(content, filename, mime = 'text/csv') {
                const blob = new Blob([content], { type: mime });
                const link = document.createElement('a');
                const url = URL.createObjectURL(blob);
                link.href = url;
                link.setAttribute('download', filename);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                showToast(`📥 已触发下载：${filename}`, 4000);
            }

            async function requestStoragePermission() {
                if (!window.cordova || !window.cordova.plugins || !window.cordova.plugins.permissions) return true;
                const permissions = window.cordova.plugins.permissions;
                return new Promise((resolve) => {
                    permissions.hasPermission(permissions.WRITE_EXTERNAL_STORAGE, (status) => {
                        if (status.hasPermission) resolve(true);
                        else permissions.requestPermission(permissions.WRITE_EXTERNAL_STORAGE, (
                            result) => resolve(result.hasPermission), () => resolve(false));
                    }, () => resolve(false));
                });
            }

            async function exportWithCordova(content, filename, mime = 'text/csv') {
                if (!window.cordova || !window.cordova.file) { fallbackDownload(content, filename, mime); return false; }
                await requestStoragePermission();
                const externalRoot = window.cordova.file.externalRootDirectory;
                const backupDir = externalRoot + 'Download/存款管家备份/';
                const resolveLocalFileSystemURL = window.resolveLocalFileSystemURL;
                return new Promise((resolve) => {
                    resolveLocalFileSystemURL(backupDir, (dirEntry) => writeFileToDir(dirEntry, filename,
                        content, mime, resolve), () => {
                        resolveLocalFileSystemURL(externalRoot + 'Download/', (downloadDir) => {
                            downloadDir.getDirectory('存款管家备份', { create: true }, (newDir) =>
                                writeFileToDir(newDir, filename, content, mime, resolve), () => {
                                    fallbackDownload(content, filename, mime);
                                    resolve(false); });
                        }, () => { fallbackDownload(content, filename, mime);
                            resolve(false); });
                    });
                });
            }

            function writeFileToDir(dirEntry, filename, content, mime, callback) {
                dirEntry.getFile(filename, { create: true, exclusive: false }, (fileEntry) => {
                    fileEntry.createWriter((writer) => {
                        writer.onwriteend = () => { showToast(`✅ 备份成功：${fileEntry.nativeURL || fileEntry
                                    .toURL()}`, 5000);
                            callback(true); };
                        writer.onerror = () => { fallbackDownload(content, filename, mime);
                            callback(false); };
                        const blob = new Blob([content], { type: mime });
                        writer.write(blob);
                    }, () => { fallbackDownload(content, filename, mime);
                        callback(false); });
                }, () => { fallbackDownload(content, filename, mime);
                    callback(false); });
            }

            function openBackupFolder() {
                if (!window.cordova || !window.cordova.file) {
                    showToast('当前非 Cordova 环境，请手动前往「文件管理」→ Download/存款管家备份', 4000);
                    return;
                }
                const backupDir = window.cordova.file.externalRootDirectory + 'Download/存款管家备份/';
                if (window.plugins && window.plugins.fileOpener2) {
                    window.plugins.fileOpener2.open(backupDir, 'application/vnd.android.directory', {
                        error: () => showToast(`请手动前往：${backupDir}`, 4000) });
                } else {
                    showToast(`请打开手机「文件管理」，进入内部存储 → Download → 存款管家备份 文件夹。\n路径：${backupDir}`,
                    5000);
                }
            }

            // ---------- CSV 导入 ----------
            async function importFromCSV(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        let text = e.target.result;
                        if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
                        const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
                        if (lines.length < 2) return reject(new Error('文件内容为空'));
                        const parseCSVLine = (line) => {
                            const result = [];
                            let inQuote = false,
                                current = '';
                            for (let i = 0; i < line.length; i++) {
                                const ch = line[i];
                                if (ch === '"') {
                                    if (inQuote && line[i + 1] === '"') { current += '"';
                                        i++; } else inQuote = !inQuote;
                                } else if (ch === ',' && !inQuote) { result.push(current.trim());
                                    current = ''; } else { current += ch; }
                            }
                            result.push(current.trim());
                            return result;
                        };
                        const headers = parseCSVLine(lines[0]);
                        const findIdx = (keywords) => {
                            for (let kw of keywords) {
                                const idx = headers.findIndex(h => h.includes(kw));
                                if (idx !== -1) return idx;
                            }
                            return -1;
                        };
                        const colMap = {
                            userIdx: findIdx(['用户']),
                            bankIdx: findIdx(['银行']),
                            nameIdx: findIdx(['存款名称']),
                            amountIdx: findIdx(['金额(元)', '金额']),
                            startIdx: findIdx(['存入日期', '起始日期']),
                            maturityIdx: findIdx(['到期日期']),
                            rateIdx: findIdx(['利率(%)', '利率']),
                            intTypeIdx: findIdx(['计息类型']),
                            notesIdx: findIdx(['备注']),
                            unlockIdx: findIdx(['解锁状态'])
                        };
                        if (colMap.amountIdx === -1) return reject(new Error('未找到金额列'));
                        const existingUsers = await getUsers();
                        let added = 0;
                        const affectedUsers = new Set();
                        for (let i = 1; i < lines.length; i++) {
                            const fields = parseCSVLine(lines[i]);
                            if (fields.length < 8) continue;
                            let userName = fields[colMap.userIdx]?.trim();
                            if (!userName) continue;
                            affectedUsers.add(userName);
                            if (!existingUsers.includes(userName)) { await addUser(userName);
                                existingUsers.push(userName); }
                            const bank = fields[colMap.bankIdx]?.trim() || '';
                            const depositType = fields[colMap.nameIdx]?.trim() || '';
                            let amountRaw = fields[colMap.amountIdx]?.replace(/,/g, '').trim();
                            let amount = parseFloat(amountRaw);
                            if (isNaN(amount) || amount <= 0) continue;
                            let startDate = null;
                            if (colMap.startIdx >= 0) { let d = parseDate(fields[colMap.startIdx]?.trim()); if (d)
                                    startDate = formatDate(d); }
                            let maturityDate = null;
                            if (colMap.maturityIdx >= 0) { let d = parseDate(fields[colMap.maturityIdx]?.trim()); if (
                                    d) maturityDate = formatDate(d); }
                            let rate = null;
                            if (colMap.rateIdx >= 0) { let r = parseFloat(fields[colMap.rateIdx]?.trim()); if (!isNaN(
                                    r)) rate = r; }
                            let interestType = 'simple';
                            if (colMap.intTypeIdx >= 0) {
                                let raw = fields[colMap.intTypeIdx]?.trim().toLowerCase() || '';
                                interestType = (raw === 'compound' || raw === '复利') ? 'compound' : 'simple';
                            }
                            const notes = colMap.notesIdx >= 0 ? (fields[colMap.notesIdx]?.trim() || '') : '';
                            const isUnlocked = colMap.unlockIdx >= 0 && fields[colMap.unlockIdx]?.trim() === '是' ? 1 :
                                0;
                            const deposit = { user: userName, bank, depositType, amount, startDate, maturityDate,
                                rate, interestType, notes, is_unlocked: isUnlocked };
                            await saveDeposit(deposit);
                            added++;
                        }
                        resolve({ added, users: Array.from(affectedUsers) });
                    };
                    reader.onerror = () => reject(reader.error);
                    reader.readAsText(file, 'UTF-8');
                });
            }

            // ---------- JSON 备份/恢复 ----------
            async function backupJSON() {

                const exportData = { users, deposits: allDeposits, rate_history: allRateHistory, version: 1 };
                const json = JSON.stringify(exportData);
                const timestamp = new Date().toISOString().slice(0, 19).replace(/:/g, '-');

                }

            async function restoreJSON(file) {
                const text = await file.text();
                const data = JSON.parse(text);
                const tx = db.transaction(['users', 'deposits', 'rate_history'], 'readwrite');
                const userStore = tx.objectStore('users');
                const depStore = tx.objectStore('deposits');
                const rateStore = tx.objectStore('rate_history');
                await Promise.all([
                    new Promise((res, rej) => { const r = userStore.clear();
                        r.onsuccess = res;
                        r.onerror = rej; }),
                    new Promise((res, rej) => { const r = depStore.clear();
                        r.onsuccess = res;
                        r.onerror = rej; }),
                    new Promise((res, rej) => { const r = rateStore.clear();
                        r.onsuccess = res;
                        r.onerror = rej; })
                ]);
                for (let u of data.users) userStore.add({ name: u });
                for (let d of data.deposits) depStore.add(d);
                for (let r of (data.rate_history || [])) rateStore.add(r);
                await new Promise((resolve, reject) => { tx.oncomplete = resolve;
                    tx.onerror = reject; });
                await refreshData();
                alert('✅ JSON 恢复成功！');
            }

            async function fixDuplicateRecords() {
                const allDepositsData = await getAllDeposits();
                const groups = new Map();
                for (let d of allDepositsData) {
                    const key =
                        `${d.user}|${d.bank}|${d.depositType}|${d.amount}|${d.startDate}|${d.maturityDate}|${d.rate}|${d.interestType}|${d.notes}`;
                    if (!groups.has(key)) groups.set(key, []);
                    groups.get(key).push(d);
                }
                const duplicates = Array.from(groups.values()).filter(list => list.length > 1);
                if (duplicates.length === 0) { alert("✅ 未发现完全重复的记录。"); return; }
                let msg =
                    `⚠️ 发现 ${duplicates.length} 组重复记录：\n\n`;
                for (let group of duplicates) msg +=
                    `• ${group[0].bank} ${group[0].depositType} ¥${group[0].amount} — ID: ${group.map(d=>d.id).join(', ')} (${group.length}条)\n`;
                const choice = confirm(msg + "\n是否保留每组第一条，删除其余重复项？\n点击「确定」执行清理，「取消」仅查看。");
                if (choice) {
                    let deleted = 0;
                    for (let group of duplicates) {
                        for (let i = 1; i < group.length; i++) { await deleteDeposit(group[i].id);
                            deleted++; }
                    }
                    alert(`✅ 已删除 ${deleted} 条重复记录。`);
                    await refreshData();
                }
            }

            function applySort() {
                const sortVal = document.getElementById('sortSelect')?.value || 'maturityDate-asc';
                const [field, dir] = sortVal.split('-');
                const multiplier = dir === 'desc' ? -1 : 1;
                allDeposits.sort((a, b) => {
                    let va, vb;
                    switch (field) {
                        case 'maturityDate':
                            va = a.maturityDate || '9999-12-31';
                            vb = b.maturityDate || '9999-12-31';
                            break;
                        case 'amount':
                            va = a.amount;
                            vb = b.amount;
                            break;
                        case 'startDate':
                            va = a.startDate || '0000-01-01';
                            vb = b.startDate || '0000-01-01';
                            break;
                        case 'rate':
                            va = a.rate ?? -1;
                            vb = b.rate ?? -1;
                            break;
                        case 'bank':
                            va = a.bank || '';
                            vb = b.bank || '';
                            return multiplier * va.localeCompare(vb, 'zh-CN');
                        default:
                            va = a.maturityDate || '9999-12-31';
                            vb = b.maturityDate || '9999-12-31';
                    }
                    if (va < vb) return -1 * multiplier;
                    if (va > vb) return 1 * multiplier;
                    return 0;
                });
            }

            function detectDuplicates() {
                const keyMap = new Map();
                duplicateIds.clear();
                for (let d of allDeposits) {
                    const key =
                        `${d.user}|${d.bank}|${d.depositType}|${d.amount}|${d.startDate}|${d.maturityDate}`;
                    if (keyMap.has(key)) { duplicateIds.add(d.id);
                        duplicateIds.add(keyMap.get(key)); } else keyMap.set(key, d.id);
                }
            }

                    filtered = filtered.filter(d =>

                if (filterBank) filtered = filtered.filter(d => d.bank === filterBank);
                const filterType = document.getElementById('filterType')?.value;
                if (filterType) filtered = filtered.filter(d => d.depositType === filterType);
                const filterHolder = document.getElementById('filterHolder')?.value;
                if (filterHolder) filtered = filtered.filter(d => d.user === filterHolder);
                const minAmount = parseFloat(document.getElementById('minAmount')?.value);
                const maxAmount = parseFloat(document.getElementById('maxAmount')?.value);
                if (!isNaN(minAmount)) filtered = filtered.filter(d => d.amount >= minAmount);
                if (!isNaN(maxAmount)) filtered = filtered.filter(d => d.amount <= maxAmount);
                const startDateFrom = document.getElementById('startDateFrom')?.value;
                const startDateTo = document.getElementById('startDateTo')?.value;
                if (startDateFrom) filtered = filtered.filter(d => d.startDate && d.startDate >= startDateFrom);
                if (startDateTo) filtered = filtered.filter(d => d.startDate && d.startDate <= startDateTo);
                const maturityFrom = document.getElementById('maturityDateFrom')?.value;
                const maturityTo = document.getElementById('maturityDateTo')?.value;
                if (maturityFrom) filtered = filtered.filter(d => d.maturityDate && d.maturityDate >= maturityFrom);
                if (maturityTo) filtered = filtered.filter(d => d.maturityDate && d.maturityDate <= maturityTo);
                currentFilteredDeposits = filtered;

                const totalCurr = filtered.reduce((s, d) => s + (d.currentInterest || 0), 0);

                        countdownHTML =

            function parseTermValue(termVal) {
                if (termVal === '0') return null;
                const match = termVal.match(/^(\d+)([dmy])$/);
                if (!match) return null;
                return { num: parseInt(match[1]), unit: match[2] };
            }

                document.body.appendChild(modalDiv);

                function autoSetMaturity() {
                    const startVal = startDateInput.value;
                    const termVal = termSelect.value;
                    if (termVal === '0' || !startVal) return;
                    const startDate = new Date(startVal);
                    if (isNaN(startDate.getTime())) return;
                    let newDate = new Date(startDate);
                    const parsed = parseTermValue(termVal);
                    if (!parsed) return;
                    const { num, unit } = parsed;
                    if (unit === 'd') newDate.setDate(newDate.getDate() + num);
                    else if (unit === 'm') newDate.setMonth(newDate.getMonth() + num);
                    else if (unit === 'y') newDate.setFullYear(newDate.getFullYear() + num);

            async function getMonthlyMaturityForecast(user) {
                const deposits = await getDeposits(user);
                const today = todayStart();
                const endDate = new Date(today);
                endDate.setDate(today.getDate() + 365);
                const monthly = {};
                for (let d of deposits) {
                    if (!d.maturityDate) continue;
                    const mat = parseDate(d.maturityDate);
                    if (!mat) continue;
                    if (mat < today || mat > endDate) continue;
                    const total = d.amount + await calculateTotalInterest(d);
                    const key = `${mat.getFullYear()}-${String(mat.getMonth()+1).padStart(2,'0')}`;
                    monthly[key] = (monthly[key] || 0) + total;
                }
                return monthly;
            }

            async function getUpcomingMaturities(user, days = 7) {
                const deposits = await getDeposits(user);
                const today = todayStart();
                const future = new Date(today);
                future.setDate(today.getDate() + days);
                return deposits.filter(d => {
                    if (!d.maturityDate) return false;
                    const mat = parseDate(d.maturityDate);
                    if (!mat) return false;
                    return mat >= today && mat <= future;
                });
            }

                    });

                    const doc = new jsPDF('landscape', 'mm', 'a4');
                    const pageWidth = doc.internal.pageSize.getWidth();
                    const pageHeight = doc.internal.pageSize.getHeight();
                    const margin = 10;
                    const imgWidth = pageWidth - margin * 2;
                    const imgHeight = (canvas.height * imgWidth) / canvas.width;

                    let heightLeft = imgHeight;
                    let position = margin;

                    // 添加第一页
                    doc.addImage(imgData, 'PNG', margin, position, imgWidth, imgHeight);
                    heightLeft -= pageHeight;

                    // 如果内容超过一页，自动添加新页

                        position = margin - (imgHeight - heightLeft);
                        doc.addPage();
                        doc.addImage(imgData, 'PNG', margin, position, imgWidth, imgHeight);

                    console.error(err);
                    showToast('❌ PDF生成失败，请重试。');
                } finally {
                    document.body.removeChild(container);
                }
            }

                const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
                return str.replace(/[&<>"']/g, m => map[m]);
            }

                const filename = `存款备份_${currentUser === null ? '合计' : currentUser}_${timestamp}.csv`;
                if (window.cordova && cordovaReady) await exportWithCordova(csvContent, filename, 'text/csv');
                else if (window.cordova && !cordovaReady) showToast('Cordova 未就绪，请稍后重试', 2000);
                else fallbackDownload(csvContent, filename, 'text/csv');
            }

            // ======================== 事件绑定 ========================
            function bindEvents() {
                document.getElementById('userSelect').addEventListener('change', async (e) => {
                    const val = e.target.value;
                    currentUser = val === '__all__' ? null : val;
                    await refreshData();
                });
                document.getElementById('addUserBtn').addEventListener('click', async () => {
                    const name = prompt('请输入新用户名：');
                    if (name && await addUser(name)) { await refreshUserSelector();
                        await refreshData();
                        showToast('✅ 用户已添加'); } else if (name) alert('添加失败或用户已存在');
                });
                document.getElementById('manageUserBtn').addEventListener('click', showManageUsersModal);
                document.getElementById('statsBtn').addEventListener('click', showStatsModal);
                document.getElementById('remindBtn').addEventListener('click', () => checkReminders(true));
                document.getElementById('forecastBtn').addEventListener('click', showForecast);
                document.getElementById('fixDataBtn').addEventListener('click', fixDuplicateRecords);
                document.getElementById('searchInput').addEventListener('input', () => updateList());
                document.getElementById('addDepositBtn').addEventListener('click', () => showDepositModal());
                document.getElementById('backupCsvBtn').addEventListener('click', doBackupCsv);
                document.getElementById('backupJsonBtn').addEventListener('click', backupJSON);
                document.getElementById('openBackupFolderBtn').addEventListener('click', openBackupFolder);
                document.getElementById('pdfBtn').addEventListener('click', exportPDF);
                document.getElementById('sortSelect').addEventListener('change', async () => { applySort();
                    await updateList(); });

                const fileInput = document.getElementById('restoreFileInput');
                document.getElementById('restoreLabel').addEventListener('click', () => fileInput.click());
                fileInput.addEventListener('change', async (e) => {
                    if (!e.target.files.length) return;
                    try {
                        const result = await importFromCSV(e.target.files[0]);
                        alert(
                            `✅ 导入完成：新增 ${result.added} 条记录。\n涉及用户：${result.users.join(', ')}`);
                        await refreshUserSelector();
                        await refreshData();
                    } catch (err) { alert('恢复失败：' + err.message); }
                    fileInput.value = '';
                });
                const jsonInput = document.getElementById('restoreJsonInput');
                document.getElementById('restoreJsonLabel').addEventListener('click', () => jsonInput.click());
                jsonInput.addEventListener('change', async (e) => {
                    if (!e.target.files.length) return;
                    try { await restoreJSON(e.target.files[0]); } catch (err) { alert('JSON恢复失败：' + err
                            .message); }
                    jsonInput.value = '';
                });
                const startYearQuick = document.getElementById('startYearQuick');
                if (startYearQuick) {
                    startYearQuick.addEventListener('change', () => {
                        const year = startYearQuick.value;
                        document.getElementById('startDateFrom').value = year ? `${year}-01-01` : '';
                        document.getElementById('startDateTo').value = year ? `${year}-12-31` : '';
                        updateList();
                    });
                }
                const maturityYearQuick = document.getElementById('maturityYearQuick');
                if (maturityYearQuick) {
                    maturityYearQuick.addEventListener('change', () => {
                        const year = maturityYearQuick.value;
                        document.getElementById('maturityDateFrom').value = year ? `${year}-01-01` : '';
                        document.getElementById('maturityDateTo').value = year ? `${year}-12-31` : '';
                        updateList();
                    });
                }
                const filterInputs = ['filterBank', 'filterType', 'filterHolder', 'minAmount', 'maxAmount',
                    'startDateFrom', 'startDateTo', 'maturityDateFrom', 'maturityDateTo'
                ];
                filterInputs.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        const eventType = (id === 'minAmount' || id === 'maxAmount') ? 'input' : 'change';
                        el.addEventListener(eventType, () => updateList());
                    }
                });
                document.getElementById('clearFiltersBtn').addEventListener('click', () => {
                    ['filterBank', 'filterType', 'filterHolder', 'minAmount', 'maxAmount', 'searchInput',
                        'startDateFrom', 'startDateTo', 'maturityDateFrom', 'maturityDateTo'
                    ].forEach(id => {
                        const el = document.getElementById(id);
                        if (el) el.value = '';
                    });
                    const syq = document.getElementById('startYearQuick');
                    if (syq) syq.value = '';
                    const myq = document.getElementById('maturityYearQuick');
                    if (myq) myq.value = '';
                    updateList();
                    showToast('✅ 筛选条件已清除');
                });
                const filterToggleBtn = document.getElementById('filterToggleBtn');
                const filterPanel = document.getElementById('filterPanel');
                if (filterToggleBtn && filterPanel) {
                    filterToggleBtn.addEventListener('click', () => {
                        const collapsed = filterPanel.classList.toggle('collapsed');
                        filterToggleBtn.textContent = collapsed ? '🔍 展开筛选条件' : '🔍 收起筛选条件';
                        if (!collapsed) {
                            filterPanel.style.maxHeight = filterPanel.scrollHeight + 'px';
                        }
                    });
                    if (window.innerWidth <= 640) {
                        filterPanel.classList.add('collapsed');
                        filterToggleBtn.textContent = '🔍 展开筛选条件';
                        filterToggleBtn.style.display = 'block';
                    } else {
                        filterPanel.classList.remove('collapsed');
                        filterToggleBtn.textContent = '🔍 收起筛选条件';
                        filterToggleBtn.style.display = 'none';
                    }
                }
                window.addEventListener('resize', () => {
                    if (filterToggleBtn && filterPanel) {
                        if (window.innerWidth <= 640) {
                            filterToggleBtn.style.display = 'block';
                        } else {
                            filterToggleBtn.style.display = 'none';
                            filterPanel.classList.remove('collapsed');
                            filterPanel.style.maxHeight = '';
                        }
                    }
                });
            }

            // ======================== 初始化 ========================
            document.addEventListener('deviceready', () => { cordovaReady = true;
                showToast('📱 存款管家旗舰版已就绪，备份将保存到 Download/存款管家备份', 3000); }, false);

            (async function init() {
                await openDB();
                let users = await getUsers();
                if (users.length === 0) await addUser('我的存款');
                currentUser = null;
                await refreshUserSelector();
                await refreshData();
                bindEvents();
                populateYearSelectors();
                document.getElementById('startDateFrom').value = '';
                document.getElementById('startDateTo').value = '';
                document.getElementById('maturityDateFrom').value = '';
                document.getElementById('maturityDateTo').value = '';
                const filterPanel = document.getElementById('filterPanel');
                if (filterPanel && window.innerWidth <= 640) {
                    filterPanel.classList.add('collapsed');
                    const toggleBtn = document.getElementById('filterToggleBtn');
                    if (toggleBtn) toggleBtn.textContent = '🔍 展开筛选条件';
                }
                checkReminders(false);
                setInterval(() => checkReminders(false), 24 * 3600 * 1000);
            })();
        })();
    </script>
</body>
</html>

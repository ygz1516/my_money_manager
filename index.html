<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>存款管家 · 最终修复版</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #f5f7fa; margin: 0; padding: 16px; padding-bottom: 80px; }
        .card { background: white; border-radius: 20px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .title { font-size: 1.5rem; font-weight: bold; color: #2c3e50; }
        button, .btn-like { background: #3498db; border: none; color: white; padding: 8px 16px; border-radius: 30px; font-size: 0.9rem; cursor: pointer; transition: 0.2s; }
        button.secondary { background: #95a5a6; }
        button.danger { background: #e74c3c; }
        button.warning { background: #f39c12; }
        button.small { padding: 4px 12px; font-size: 0.8rem; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        input, select, textarea { width: 100%; padding: 10px; margin: 6px 0 12px; border: 1px solid #ddd; border-radius: 12px; font-size: 1rem; }
        datalist { display: none; }
        .search-bar { margin-bottom: 12px; }
        .deposit-item { border-bottom: 1px solid #eee; padding: 12px 0; display: flex; align-items: flex-start; gap: 12px; transition: background 0.2s; }
        .deposit-item.duplicate { background-color: #fff3cd; border-left: 4px solid #ffc107; padding-left: 8px; }
        .deposit-checkbox { flex-shrink: 0; padding-top: 4px; }
        .deposit-checkbox input { width: 22px; height: 22px; margin: 0; cursor: pointer; }
        .deposit-info { flex: 3; }
        .deposit-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .amount { font-weight: bold; color: #27ae60; }
        .interest { color: #e67e22; font-size: 0.85rem; }
        .status-bar { background: #ecf0f1; padding: 8px 12px; border-radius: 30px; font-size: 0.8rem; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
        .batch-bar { margin-top: 8px; display: flex; gap: 12px; align-items: center; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; width: 90%; max-width: 500px; max-height: 85%; border-radius: 28px; padding: 20px; overflow-y: auto; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .badge { background: #3498db20; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; }
        .toast-msg { position: fixed; bottom: 30px; left: 20px; right: 20px; background: rgba(0,0,0,0.85); color: white; text-align: center; padding: 12px; border-radius: 40px; z-index: 2000; font-size: 0.85rem; transition: opacity 0.3s; pointer-events: none; word-break: break-all; }
        .chart-container { height: 250px; margin-top: 16px; }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .deposit-item { flex-direction: column; align-items: stretch; }
            .deposit-checkbox { align-self: flex-start; }
            .deposit-actions { margin-top: 8px; justify-content: flex-end; }
            .flex-between > div:first-child {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin-bottom: 8px;
            }
            .flex-between > div:first-child button,
            .flex-between > div:first-child label {
                flex: 0 0 auto;
                font-size: 0.75rem;
                padding: 6px 12px;
            }
            .batch-bar {
                margin-top: 8px;
                justify-content: flex-start;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
<div id="app">
    <div class="card">
        <div class="header">
            <div class="title">💰 存款管家 · 最终修复版</div>
            <div class="flex-between">
                <select id="userSelect" class="badge" style="background:#ecf0f1; padding:6px;"></select>
                <button id="addUserBtn" class="small secondary">➕ 用户</button>
                <button id="manageUserBtn" class="small secondary">📋 管理用户</button>
                <button id="statsBtn" class="small">📊 统计图表</button>
                <button id="remindBtn" class="small warning">⏰ 到期提醒</button>
                <button id="forecastBtn" class="small warning">📈 到期预测</button>
                <button id="fixDataBtn" class="small warning">🔧 修复重复</button>
            </div>
        </div>
        <div class="status-bar" id="statusBar">
            <span id="statsText"></span>
            <span id="duplicateWarning" style="color:#e67e22;"></span>
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 搜索银行/类型/备注">
        </div>
        <div class="flex-between" style="margin-bottom: 12px;">
            <div>
                <button id="addDepositBtn">➕ 新增存款</button>
                <button id="backupCsvBtn" class="secondary">💾 备份CSV</button>
                <button id="backupJsonBtn" class="secondary">💾 备份JSON(全量)</button>
                <button id="openBackupFolderBtn" class="secondary" style="background:#6c5ce7;">📂 打开备份文件夹</button>
                <label id="restoreLabel" class="btn-like secondary" style="display:inline-block; background:#2c3e50;">📂 恢复CSV
                    <input type="file" id="restoreFileInput" accept=".csv,text/csv" style="display:none;">
                </label>
                <label id="restoreJsonLabel" class="btn-like secondary" style="display:inline-block; background:#2c3e50;">📂 恢复JSON
                    <input type="file" id="restoreJsonInput" accept=".json" style="display:none;">
                </label>
                <span style="font-size:0.7rem; color:gray;">（CSV恢复仅追加，JSON恢复全量替换）</span>
            </div>
            <div class="batch-bar">
                <label style="display: flex; align-items: center; gap: 6px;"><input type="checkbox" id="selectAllCheckbox"> 全选</label>
                <button id="batchDeleteBtn" class="small danger">🗑️ 删除选中</button>
            </div>
        </div>
    </div>
    <div id="depositListContainer"></div>
</div>

<script src="cordova.js"></script>
<script>
    // ======================== 预设数据 ========================
    const PRESET_BANKS = [
        "中国工商银行", "中国建设银行", "中国农业银行", "中国银行", "交通银行",
        "重庆银行", "重庆农村商业银行", "微众银行", "蓝海银行", "邮储银行",
        "招商银行", "浦发银行", "中信银行", "其他银行", "微信理财", "支付宝理财", "股票基金"
    ];
    const PRESET_DEPOSIT_TYPES = [
        "活期", "一年期定期", "三年期定期", "五年期定期", "大额存单",
        "结构性存款", "通知存款", "理财产品", "货币基金", "股票基金", "其他"
    ];

    // ======================== IndexedDB ========================
    const DB_NAME = 'DepositDB';
    const DB_VERSION = 3;
    let db = null;

    function openDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, DB_VERSION);
            request.onerror = () => reject(request.error);
            request.onsuccess = () => { db = request.result; resolve(db); };
            request.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('users')) db.createObjectStore('users', { keyPath: 'name' });
                if (!db.objectStoreNames.contains('deposits')) {
                    const store = db.createObjectStore('deposits', { keyPath: 'id', autoIncrement: true });
                    store.createIndex('user', 'user', { unique: false });
                }
                if (!db.objectStoreNames.contains('rate_history')) {
                    const store = db.createObjectStore('rate_history', { keyPath: 'id', autoIncrement: true });
                    store.createIndex('deposit_id', 'deposit_id', { unique: false });
                }
            };
        });
    }

    async function getStore(storeName, mode = 'readonly') {
        if (!db) await openDB();
        return db.transaction(storeName, mode).objectStore(storeName);
    }

    // ---------- 用户 ----------
    async function getUsers() {
        const store = await getStore('users');
        const all = await new Promise(resolve => { const req = store.getAll(); req.onsuccess = () => resolve(req.result); });
        return all.map(u => u.name);
    }

    async function addUser(name) {
        if (!name) return false;
        if (name === '默认用户') {
            alert('不能添加“默认用户”作为普通用户');
            return false;
        }
        const users = await getUsers();
        if (users.includes(name)) return false;
        const store = await getStore('users', 'readwrite');
        await store.add({ name });
        return true;
    }

    async function deleteUser(name) {
        const users = await getUsers();
        if (!users.includes(name)) return false;
        const deposits = await getDeposits(name);
        if (deposits.length > 0) {
            alert(`用户 ${name} 有 ${deposits.length} 笔存款，请先删除该用户下的所有存款后再删除用户。`);
            return false;
        }
        const store = await getStore('users', 'readwrite');
        await store.delete(name);
        return true;
    }

    async function renameUser(oldName, newName) {
        if (!newName || newName === oldName) return false;
        const users = await getUsers();
        if (users.includes(newName)) return false;
        const userStore = await getStore('users', 'readwrite');
        await userStore.delete(oldName);
        await userStore.add({ name: newName });
        const depStore = await getStore('deposits', 'readwrite');
        const all = await new Promise(resolve => { const req = depStore.getAll(); req.onsuccess = () => resolve(req.result); });
        for (let d of all) {
            if (d.user === oldName) {
                d.user = newName;
                await depStore.put(d);
            }
        }
        return true;
    }

    // ---------- 存款 ----------
    async function getDeposits(user) {
        if (!user) return await getAllDeposits();
        const store = await getStore('deposits');
        const index = store.index('user');
        const items = await new Promise(resolve => { const req = index.getAll(user); req.onsuccess = () => resolve(req.result); });
        return items.map(d => ({ ...d, id: d.id }));
    }

    async function getAllDeposits() {
        const store = await getStore('deposits');
        const all = await new Promise(resolve => { const req = store.getAll(); req.onsuccess = () => resolve(req.result); });
        return all.map(d => ({ ...d, id: d.id }));
    }

    async function saveDeposit(deposit) {
        const store = await getStore('deposits', 'readwrite');
        let isNew = !deposit.id;
        let savedId;
        if (deposit.id) {
            await store.put(deposit);
            savedId = deposit.id;
        } else {
            delete deposit.id;
            savedId = await new Promise(resolve => { const req = store.add(deposit); req.onsuccess = () => resolve(req.result); });
            deposit.id = savedId;
        }
        if (isNew && deposit.startDate && deposit.rate != null && !isNaN(deposit.rate)) {
            const rateStore = await getStore('rate_history', 'readwrite');
            await rateStore.add({ deposit_id: savedId, effective_date: deposit.startDate, interest_rate: deposit.rate });
        } else if (!isNew && deposit.startDate && deposit.rate != null && !isNaN(deposit.rate)) {
            const rateStore = await getStore('rate_history', 'readwrite');
            const idx = rateStore.index('deposit_id');
            const existing = await new Promise(resolve => { const req = idx.getAll(savedId); req.onsuccess = () => resolve(req.result); });
            if (existing.length === 0) {
                await rateStore.add({ deposit_id: savedId, effective_date: deposit.startDate, interest_rate: deposit.rate });
            } else {
                const first = existing[0];
                first.interest_rate = deposit.rate;
                first.effective_date = deposit.startDate;
                await rateStore.put(first);
            }
        }
        return savedId;
    }

    async function deleteDeposit(id) {
        const store = await getStore('deposits', 'readwrite');
        await store.delete(id);
        const rateStore = await getStore('rate_history', 'readwrite');
        const idx = rateStore.index('deposit_id');
        const rates = await new Promise(resolve => { const req = idx.getAll(id); req.onsuccess = () => resolve(req.result); });
        for (let r of rates) await rateStore.delete(r.id);
    }

    async function deleteDeposits(ids) {
        for (let id of ids) await deleteDeposit(id);
    }

    async function unlockDeposit(id) {
        const store = await getStore('deposits', 'readwrite');
        const dep = await new Promise(resolve => { const req = store.get(id); req.onsuccess = () => resolve(req.result); });
        if (dep) {
            dep.is_unlocked = 1;
            await store.put(dep);
        }
    }

    // ---------- 利率历史 ----------
    async function getRateHistory(depositId) {
        const store = await getStore('rate_history');
        const idx = store.index('deposit_id');
        const items = await new Promise(resolve => { const req = idx.getAll(depositId); req.onsuccess = () => resolve(req.result); });
        return items.sort((a,b) => new Date(a.effective_date) - new Date(b.effective_date));
    }

    async function addRateChange(depositId, effectiveDate, interestRate) {
        const store = await getStore('rate_history', 'readwrite');
        const existing = await getRateHistory(depositId);
        if (existing.some(r => r.effective_date === effectiveDate)) return false;
        await store.add({ deposit_id: depositId, effective_date: effectiveDate, interest_rate: interestRate });
        return true;
    }

    async function deleteRateChange(rateId) {
        const store = await getStore('rate_history', 'readwrite');
        await store.delete(rateId);
    }

    // ---------- 日期转换 ----------
    function parseDate(dateStr) {
        if (!dateStr) return null;
        let d = new Date(dateStr);
        if (!isNaN(d)) return d;
        let parts = dateStr.split(/[-\/]/);
        if (parts.length === 3) {
            let year = parseInt(parts[0]);
            let month = parseInt(parts[1]) - 1;
            let day = parseInt(parts[2]);
            d = new Date(year, month, day);
            if (!isNaN(d)) return d;
        }
        if (/^\d{8}$/.test(dateStr)) {
            let year = parseInt(dateStr.slice(0,4));
            let month = parseInt(dateStr.slice(4,6)) - 1;
            let day = parseInt(dateStr.slice(6,8));
            d = new Date(year, month, day);
            if (!isNaN(d)) return d;
        }
        return null;
    }

    function formatDate(date) {
        if (!date) return null;
        return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
    }

    // ---------- 利息计算（修复版）----------
    async function calculateInterest(deposit, asOfDate = null) {
        const { startDate, maturityDate, amount, rate, interestType, id } = deposit;
        if (!startDate || amount <= 0 || rate == null || isNaN(rate)) return 0;
        const start = parseDate(startDate);
        if (!start) return 0;
        let asOf = asOfDate ? (typeof asOfDate === 'string' ? parseDate(asOfDate) : asOfDate) : new Date();
        if (!asOf) asOf = new Date();
        let end = maturityDate ? parseDate(maturityDate) : null;
        let actualEnd = end ? (asOf < end ? asOf : end) : asOf;
        if (actualEnd <= start) return 0;

        let periods = [];
        if (id) {
            const hist = await getRateHistory(id);
            if (hist.length > 0) {
                let prevDate = start;
                for (let h of hist) {
                    let eff = parseDate(h.effective_date);
                    if (eff && eff > start) {
                        if (prevDate < eff) {
                            periods.push({ start: prevDate, end: eff < actualEnd ? eff : actualEnd, rate: h.interest_rate });
                        }
                        prevDate = eff;
                    }
                }
                if (prevDate < actualEnd) {
                    let lastRate = hist[hist.length-1].interest_rate;
                    periods.push({ start: prevDate, end: actualEnd, rate: lastRate });
                }
            } else {
                periods.push({ start, end: actualEnd, rate });
            }
        } else {
            periods.push({ start, end: actualEnd, rate });
        }

        let total = 0;
        for (let p of periods) {
            if (p.end <= p.start) continue;
            const days = (p.end - p.start) / (1000*3600*24);
            const dailyRate = p.rate / 100 / 365;
            if (interestType === 'compound') {
                total += amount * (Math.pow(1 + dailyRate, days) - 1);
            } else {
                total += dailyRate * amount * days;
            }
        }
        return Math.round(total * 100) / 100;
    }

    async function calculateTotalInterest(deposit) {
        if (!deposit.maturityDate) return 0;
        // 直接使用到期日作为结束日期
        const mat = parseDate(deposit.maturityDate);
        if (!mat) return 0;
        return await calculateInterest(deposit, mat);
    }

    async function enrichDeposits(deposits) {
        for (let d of deposits) {
            d.amount = Number(d.amount);
            if (isNaN(d.amount)) d.amount = 0;
            d.currentInterest = await calculateInterest(d);
            d.totalInterest = await calculateTotalInterest(d);
        }
        return deposits;
    }

    // 统计
    async function getStats(user) {
        const deposits = await getDeposits(user);
        const enriched = await enrichDeposits(deposits);
        let totalAmount = 0, totalCurrentInterest = 0, totalMaturityInterest = 0;
        let byBank = {}, byType = {}, byHolder = {};
        for (let d of enriched) {
            const amt = Number(d.amount);
            if (!isNaN(amt)) {
                totalAmount += amt;
                byBank[d.bank] = (byBank[d.bank] || 0) + amt;
                byType[d.depositType] = (byType[d.depositType] || 0) + amt;
                byHolder[d.user] = (byHolder[d.user] || 0) + amt;
            }
            totalCurrentInterest += d.currentInterest || 0;
            totalMaturityInterest += d.totalInterest || 0;
        }
        // 四舍五入保留两位小数，解决精度问题
        for (let k in byBank) byBank[k] = Math.round(byBank[k] * 100) / 100;
        for (let k in byType) byType[k] = Math.round(byType[k] * 100) / 100;
        for (let k in byHolder) byHolder[k] = Math.round(byHolder[k] * 100) / 100;
        totalAmount = Math.round(totalAmount * 100) / 100;
        totalCurrentInterest = Math.round(totalCurrentInterest * 100) / 100;
        totalMaturityInterest = Math.round(totalMaturityInterest * 100) / 100;
        return { totalAmount, totalCurrentInterest, totalMaturityInterest, byBank, byType, byHolder, deposits: enriched };
    }

    async function getUpcomingMaturities(user, days = 7) {
        const deposits = await getDeposits(user);
        const today = new Date();
        today.setHours(0,0,0,0);
        const future = new Date(today);
        future.setDate(today.getDate() + days);
        return deposits.filter(d => {
            if (!d.maturityDate) return false;
            const mat = parseDate(d.maturityDate);
            if (!mat) return false;
            return mat >= today && mat <= future;
        });
    }

    async function getMonthlyMaturityForecast(user) {
        const deposits = await getDeposits(user);
        const today = new Date();
        today.setHours(0,0,0,0);
        const endDate = new Date(today);
        endDate.setDate(today.getDate() + 365);
        const monthly = {};
        for (let d of deposits) {
            if (!d.maturityDate) continue;
            const mat = parseDate(d.maturityDate);
            if (!mat) continue;
            if (mat < today || mat > endDate) continue;
            const total = d.amount + await calculateTotalInterest(d);
            const key = `${mat.getFullYear()}-${String(mat.getMonth()+1).padStart(2,'0')}`;
            monthly[key] = (monthly[key] || 0) + total;
        }
        return monthly;
    }

    // ======================== 备份与恢复 ========================
    function showToast(msg, duration = 5000) {
        let toast = document.querySelector('.toast-msg');
        if (!toast) { toast = document.createElement('div'); toast.className = 'toast-msg'; document.body.appendChild(toast); }
        toast.textContent = msg;
        toast.style.opacity = '1';
        setTimeout(() => toast.style.opacity = '0', duration);
    }

    function generateCSVBlob(user, deposits) {
        const sorted = [...deposits].sort((a,b) => (a.maturityDate || '9999-12-31') > (b.maturityDate || '9999-12-31') ? 1 : -1);
        const rows = [];
        for (let i = 0; i < sorted.length; i++) {
            const d = sorted[i];
            rows.push([
                (i+1).toString(), d.user, d.bank, d.depositType, d.amount.toFixed(2),
                d.startDate || '', d.maturityDate || '',
                d.rate != null ? d.rate.toFixed(2) : '',
                d.interestType === 'compound' ? 'compound' : 'simple',
                d.notes || '', d.is_unlocked ? '是' : '否'
            ]);
        }
        const headers = ['序号', '用户', '银行', '存款名称', '金额(元)', '存入日期', '到期日期', '利率(%)', '计息类型', '备注', '解锁状态'];
        const csvLines = [headers, ...rows];
        const escapeCSV = (cell) => {
            if (cell === undefined || cell === null) return '';
            const str = String(cell);
            if (str.includes(',') || str.includes('"') || str.includes('\n') || str.includes('\r'))
                return '"' + str.replace(/"/g, '""') + '"';
            return str;
        };
        const csvContent = csvLines.map(row => row.map(cell => escapeCSV(cell)).join(',')).join('\n');
        return "\uFEFF" + csvContent;
    }

    function fallbackDownload(content, filename, mime = 'text/csv') {
        const blob = new Blob([content], { type: mime });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        link.href = url;
        link.setAttribute('download', filename);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        showToast(`📥 已触发下载：${filename}`, 5000);
    }

    async function requestStoragePermission() {
        if (!window.cordova || !window.cordova.plugins || !window.cordova.plugins.permissions) return true;
        const permissions = window.cordova.plugins.permissions;
        return new Promise((resolve) => {
            permissions.hasPermission(permissions.WRITE_EXTERNAL_STORAGE, (status) => {
                if (status.hasPermission) resolve(true);
                else permissions.requestPermission(permissions.WRITE_EXTERNAL_STORAGE, (result) => resolve(result.hasPermission), () => resolve(false));
            }, () => resolve(false));
        });
    }

    async function exportWithCordova(content, filename, mime = 'text/csv') {
        if (!window.cordova || !window.cordova.file) { fallbackDownload(content, filename, mime); return false; }
        await requestStoragePermission();
        const externalRoot = window.cordova.file.externalRootDirectory;
        const backupDir = externalRoot + 'Download/存款管家备份/';
        const resolveLocalFileSystemURL = window.resolveLocalFileSystemURL;
        return new Promise((resolve) => {
            resolveLocalFileSystemURL(backupDir, (dirEntry) => writeFileToDir(dirEntry, filename, content, mime, resolve), () => {
                resolveLocalFileSystemURL(externalRoot + 'Download/', (downloadDir) => {
                    downloadDir.getDirectory('存款管家备份', { create: true }, (newDir) => writeFileToDir(newDir, filename, content, mime, resolve), () => { fallbackDownload(content, filename, mime); resolve(false); });
                }, () => { fallbackDownload(content, filename, mime); resolve(false); });
            });
        });
    }

    function writeFileToDir(dirEntry, filename, content, mime, callback) {
        dirEntry.getFile(filename, { create: true, exclusive: false }, (fileEntry) => {
            fileEntry.createWriter((writer) => {
                writer.onwriteend = () => { showToast(`✅ 备份成功：${fileEntry.nativeURL || fileEntry.toURL()}`, 6000); callback(true); };
                writer.onerror = () => { fallbackDownload(content, filename, mime); callback(false); };
                const blob = new Blob([content], { type: mime });
                writer.write(blob);
            }, () => { fallbackDownload(content, filename, mime); callback(false); });
        }, () => { fallbackDownload(content, filename, mime); callback(false); });
    }

    // ======================== CSV 导入 ========================
    async function importFromCSV(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = async (e) => {
                let text = e.target.result;
                if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
                const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
                if (lines.length < 2) return reject('文件内容为空');
                const parseCSVLine = (line) => {
                    const result = [];
                    let inQuote = false;
                    let current = '';
                    for (let i = 0; i < line.length; i++) {
                        const ch = line[i];
                        if (ch === '"') {
                            if (inQuote && line[i+1] === '"') { current += '"'; i++; }
                            else inQuote = !inQuote;
                        } else if (ch === ',' && !inQuote) {
                            result.push(current.trim());
                            current = '';
                        } else {
                            current += ch;
                        }
                    }
                    result.push(current.trim());
                    return result;
                };
                const headers = parseCSVLine(lines[0]);
                const colMap = {
                    userIdx: headers.findIndex(h => h.includes('用户')),
                    bankIdx: headers.findIndex(h => h.includes('银行')),
                    nameIdx: headers.findIndex(h => h.includes('存款名称')),
                    amountIdx: headers.findIndex(h => h.includes('金额') && !h.includes('利率')),
                    startIdx: headers.findIndex(h => h.includes('存入日期') || h.includes('起始日期')),
                    maturityIdx: headers.findIndex(h => h.includes('到期日期')),
                    rateIdx: headers.findIndex(h => h.includes('利率')),
                    intTypeIdx: headers.findIndex(h => h.includes('计息类型')),
                    notesIdx: headers.findIndex(h => h.includes('备注')),
                    unlockIdx: headers.findIndex(h => h.includes('解锁状态'))
                };
                if (colMap.amountIdx === -1) colMap.amountIdx = headers.findIndex(h => h.includes('金额(元)'));
                if (colMap.startIdx === -1) colMap.startIdx = headers.findIndex(h => h.includes('起始日期'));
                if (colMap.rateIdx === -1) colMap.rateIdx = headers.findIndex(h => h.includes('利率(%)'));
                if (colMap.intTypeIdx === -1) colMap.intTypeIdx = headers.findIndex(h => h.includes('计息类型'));
                const existingUsers = await getUsers();
                let added = 0;
                const affectedUsers = new Set();
                for (let i = 1; i < lines.length; i++) {
                    const fields = parseCSVLine(lines[i]);
                    if (fields.length < 10) continue;
                    let userName = fields[colMap.userIdx]?.trim();
                    if (!userName) continue;
                    affectedUsers.add(userName);
                    if (!existingUsers.includes(userName)) { await addUser(userName); existingUsers.push(userName); }
                    const bank = fields[colMap.bankIdx]?.trim() || '';
                    const depositType = fields[colMap.nameIdx]?.trim() || '';
                    let amountRaw = fields[colMap.amountIdx]?.replace(/,/g, '').trim();
                    let amount = parseFloat(amountRaw);
                    if (isNaN(amount) || amount <= 0) continue;
                    let startDateRaw = fields[colMap.startIdx]?.trim();
                    let startDate = null;
                    if (startDateRaw) { let d = parseDate(startDateRaw); if (d) startDate = formatDate(d); }
                    let maturityDateRaw = fields[colMap.maturityIdx]?.trim();
                    let maturityDate = null;
                    if (maturityDateRaw) { let d = parseDate(maturityDateRaw); if (d) maturityDate = formatDate(d); }
                    let rateRaw = fields[colMap.rateIdx]?.trim();
                    let rate = null;
                    if (rateRaw && rateRaw !== '') { let r = parseFloat(rateRaw); if (!isNaN(r)) rate = r; }
                    let interestType = fields[colMap.intTypeIdx]?.trim().toLowerCase() || 'simple';
                    interestType = (interestType === 'compound' || interestType === '复利') ? 'compound' : 'simple';
                    const notes = fields[colMap.notesIdx]?.trim() || '';
                    const isUnlocked = (fields[colMap.unlockIdx]?.trim() === '是') ? 1 : 0;
                    const deposit = { user: userName, bank, depositType, amount, startDate, maturityDate, rate, interestType, notes, is_unlocked: isUnlocked };
                    await saveDeposit(deposit);
                    added++;
                }
                resolve({ added, users: Array.from(affectedUsers) });
            };
            reader.onerror = () => reject(reader.error);
            reader.readAsText(file, 'UTF-8');
        });
    }

    async function fixDuplicateRecords() {
        const allDepositsAllUsers = await getAllDeposits();
        const groups = new Map();
        for (let d of allDepositsAllUsers) {
            const key = `${d.user}|${d.bank}|${d.depositType}|${d.amount}|${d.startDate}|${d.maturityDate}|${d.rate}|${d.interestType}|${d.notes}`;
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push(d);
        }
        const duplicates = Array.from(groups.values()).filter(list => list.length > 1);
        if (duplicates.length === 0) { alert("未发现完全重复的记录。"); return; }
        let msg = `发现 ${duplicates.length} 组重复记录，每组包含 ${duplicates[0].length} 条。\n`;
        for (let group of duplicates) msg += `组内 ID: ${group.map(d=>d.id).join(', ')}  (${group[0].bank} ${group[0].amount}元)\n`;
        const choice = confirm(msg + "\n是否保留每组第一条，删除其余？\n确定保留第一条，取消仅查看");
        if (choice) {
            let deleted = 0;
            for (let group of duplicates) {
                const keep = group[0];
                for (let i = 1; i < group.length; i++) { await deleteDeposit(group[i].id); deleted++; }
            }
            alert(`已删除 ${deleted} 条重复记录。`);
            await refreshData();
        }
    }

        duplicateIds.clear();
        for (let d of allDeposits) {
            const key = `${d.bank}|${d.depositType}|${d.amount}|${d.startDate}|${d.maturityDate}`;
            if (keyMap.has(key)) { duplicateIds.add(d.id); duplicateIds.add(keyMap.get(key)); }

            <button id="closeStatsBtn" style="margin-top:16px;">关闭</button>
        </div>`;
        document.body.appendChild(modalDiv);
        const drawPie = (id, title, data) => {
            const chart = echarts.init(modalDiv.querySelector(`#${id}`));
            chart.setOption({
                title: { text: title, left: 'center', textStyle: { fontSize: 12 } },
                tooltip: { trigger: 'item', formatter: '{b}: ¥{c} ({d}%)' },
                series: [{ type: 'pie', radius: '55%', data: Object.entries(data).map(([n,v]) => ({ name: n, value: v })), label: { show: true, formatter: '{b}: {d}%' } }]
            });
        };
        drawPie('holderChart', '持有人分布', stats.byHolder);
        drawPie('typeChart', '存款类型分布', stats.byType);
        drawPie('bankChart', '银行分布', stats.byBank);
        const valid = stats.deposits.filter(d => d.startDate && d.maturityDate);
        if (valid.length) {
            const timeline = echarts.init(modalDiv.querySelector('#timelineChart'));
            const series = valid.map(d => ({
                name: `${d.bank}-${d.depositType}`,
                type: 'line',
                data: [[d.startDate, d.amount], [d.maturityDate, d.amount]],
                lineStyle: { width: 3, color: '#3498db' },
                symbol: 'circle', symbolSize: 6,
                tooltip: { formatter: `金额: ¥${d.amount.toFixed(2)}` }
            }));
            timeline.setOption({ title: { text: '存款时间线', left: 'center' }, tooltip: { trigger: 'axis' }, xAxis: { type: 'time' }, yAxis: { type: 'value', name: '金额(元)' }, series });
        } else {
            modalDiv.querySelector('#timelineChart').innerHTML = '<div style="text-align:center;color:gray;">无日期数据</div>';
        }
        modalDiv.querySelector('#closeStatsBtn').onclick = () => modalDiv.remove();
    }

    // 到期预测模态框（带关闭按钮）
    async function showForecast() {
        const monthly = await getMonthlyMaturityForecast(currentUser);
        const months = Object.keys(monthly).sort();
        if (months.length === 0) {
            alert('未来12个月无到期存款');
            return;
        }
        const amounts = months.map(m => monthly[m]);
        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        modalDiv.style.zIndex = '2000';
        modalDiv.innerHTML = `
            <div class="modal-content" style="max-width: 95%; width: 500px;">
                <h3 style="text-align:center;">📈 未来12个月到期资金预测</h3>
                <div id="forecastChart" style="height: 300px; width: 100%;"></div>
                <div style="display: flex; justify-content: center; margin-top: 16px;">
                    <button id="closeForecastBtn" class="secondary small">关闭</button>
                </div>
            </div>
        `;
        document.body.appendChild(modalDiv);
        const chartDom = modalDiv.querySelector('#forecastChart');
        const chart = echarts.init(chartDom);
        chart.setOption({
            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
            xAxis: { type: 'category', data: months, axisLabel: { rotate: 30 } },
            yAxis: { type: 'value', name: '金额(元)' },
            series: [{
                type: 'bar', data: amounts,
                itemStyle: { color: '#3498db', borderRadius: [4,4,0,0] },
                label: { show: true, position: 'top', formatter: (p) => (p.value / 10000).toFixed(1) + '万' }
            }]
        });
        modalDiv.querySelector('#closeForecastBtn').onclick = () => modalDiv.remove();
    }

    async function checkReminders(manual = false) {
        const upcoming = await getUpcomingMaturities(currentUser);
        if (upcoming.length) {
            let msg = '📢 未来7天到期存款：\n';
            for (let d of upcoming) {
                const days = Math.ceil((new Date(d.maturityDate) - new Date()) / (1000*3600*24));
                msg += `${d.bank} ${d.depositType} ¥${d.amount} 剩余${days}天\n`;
            }
            alert(msg);
        } else if (manual) alert('未来7天内没有即将到期的存款');
    }

    async function exportPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('landscape');
        const body = [];
        for (let d of allDeposits) {
            body.push([d.bank, d.depositType, d.user, d.amount.toFixed(2), d.startDate||'-', d.maturityDate||'-', d.rate, d.interestType, d.currentInterest.toFixed(2), d.totalInterest.toFixed(2)]);
        }
        doc.autoTable({
            head: [['银行','类型','持有人','金额','起始日','到期日','利率','利息类型','当前利息','到期利息']],
            body: body
        });
        doc.save(`存款报表_${currentUser === null ? '合计' : currentUser}_${new Date().toISOString().slice(0,10)}.pdf`);
    }

    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

    let cordovaReady = false;
    document.addEventListener('deviceready', () => { cordovaReady = true; showToast('📱 存款管家已就绪，备份将保存到 Download/存款管家备份', 3000); }, false);

    async function doBackupCsv() {
        const deposits = await getDeposits(currentUser);
        const csvContent = generateCSVBlob(currentUser, deposits);
        const timestamp = new Date().toISOString().slice(0,19).replace(/:/g, '-');
        const filename = `存款备份_${currentUser === null ? '合计' : currentUser}_${timestamp}.csv`;
        if (window.cordova && cordovaReady) await exportWithCordova(csvContent, filename, 'text/csv');
        else if (window.cordova && !cordovaReady) showToast('Cordova 未就绪，请稍后重试', 2000);
        else fallbackDownload(csvContent, filename, 'text/csv');
    }

    function bindEvents() {
        document.getElementById('userSelect').addEventListener('change', async (e) => {
            const val = e.target.value;
            if (val === '__all__') currentUser = null;
            else currentUser = val;
            await refreshData();
        });
        document.getElementById('addUserBtn').addEventListener('click', async () => { const name = prompt('新用户名'); if (name && await addUser(name)) { await refreshUserSelector(); await refreshData(); } else alert('添加失败或用户已存在'); });
        document.getElementById('manageUserBtn').addEventListener('click', showManageUsersModal);
        document.getElementById('statsBtn').addEventListener('click', showStatsModal);
        document.getElementById('remindBtn').addEventListener('click', () => checkReminders(true));
        document.getElementById('forecastBtn').addEventListener('click', showForecast);
        document.getElementById('fixDataBtn').addEventListener('click', fixDuplicateRecords);
        document.getElementById('searchInput').addEventListener('input', (e) => { currentFilter = e.target.value.toLowerCase(); updateList(); });
        document.getElementById('addDepositBtn').addEventListener('click', () => showDepositModal());
        document.getElementById('backupCsvBtn').addEventListener('click', doBackupCsv);
        document.getElementById('backupJsonBtn').addEventListener('click', backupJSON);
        document.getElementById('openBackupFolderBtn').addEventListener('click', openBackupFolder);
        
        const pdfBtn = document.createElement('button');
        pdfBtn.id = 'pdfBtn';
        pdfBtn.className = 'small';
        pdfBtn.innerHTML = '📄 导出PDF';
        pdfBtn.style.background = '#e67e22';
        pdfBtn.onclick = exportPDF;
        document.querySelector('.flex-between > div:first-child').appendChild(pdfBtn);

        const fileInput = document.getElementById('restoreFileInput');
        document.getElementById('restoreLabel').addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', async (e) => {
            if (!e.target.files.length) return;
            try {
                const result = await importFromCSV(e.target.files[0]);
                alert(`导入完成：新增 ${result.added} 条记录。\n涉及用户：${result.users.join(', ')}`);
                await refreshUserSelector();
                if (result.users.includes(currentUser)) await refreshData();
                else if (result.users.length) alert(`导入的用户包括：${result.users.join(', ')}。您可以在上方下拉菜单中选择查看。`);
                else await refreshData();
            } catch (err) { alert('恢复失败：' + err.message); }
            fileInput.value = '';
        });

        const jsonInput = document.getElementById('restoreJsonInput');
        document.getElementById('restoreJsonLabel').addEventListener('click', () => jsonInput.click());
        jsonInput.addEventListener('change', async (e) => {
            if (!e.target.files.length) return;
            try { await restoreJSON(e.target.files[0]); } catch (err) { alert('JSON恢复失败：' + err.message); }
            jsonInput.value = '';
        });
    }

    (async function init() {
        await openDB();
        let users = await getUsers();
        if (users.length === 0) await addUser('我的存款');
        currentUser = null;
        await refreshUserSelector();
        await refreshData();
        bindEvents();
        checkReminders(false);
        setInterval(() => checkReminders(false), 24*3600*1000);
    })();
</script>
</body>
</html>

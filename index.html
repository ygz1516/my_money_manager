            return;
          }
          const chart = echarts.init(dom);
          chart.setOption({
            title:{text:title,left:'center',textStyle:{fontSize:13,fontWeight:700}},
            tooltip:{trigger:'item',formatter:'{b}: ¥{c} ({d}%)'},
            color:['#4f6ef7','#10b981','#f59e0b','#ec4899','#8b5cf6','#06b6d4','#f97316','#84cc16','#ef4444','#14b8a6'],
            series:[{
              type:'pie',
              radius:['42%','66%'],
              data:entries.map(([n,v])=>({name:n,value:Math.round(v * 100) / 100})),
              label:{show:true,formatter:'{b} ({d}%)',fontSize:10},
              itemStyle:{borderRadius:5,borderColor:'#fff',borderWidth:2}
            }]
          });
          chart.resize();
        };
        renderPie(`pdfBankChart_${uid}`,'🏦 银行分布',byBank);
        renderPie(`pdfTypeChart_${uid}`,'📂 类型分布',byType);
        renderPie(`pdfHolderChart_${uid}`,'👤 持有人分布',byHolder);
        if(months.length){
          const dom = container.querySelector(`#pdfTrendChart_${uid}`);
          if(dom){
            const chart = echarts.init(dom);
            chart.setOption({
              tooltip:{trigger:'axis'},
              legend:{data:['存入金额','到期金额'],top:0,textStyle:{fontSize:11}},
              grid:{left:60,right:24,top:38,bottom:66},
              xAxis:{type:'category',data:months,axisLabel:{rotate:35,fontSize:10}},
              yAxis:{type:'value',name:'金额(元)',nameTextStyle:{fontSize:10},axisLabel:{fontSize:10}},
              series:[
                {name:'存入金额',type:'bar',barWidth:'35%',data:depositData,itemStyle:{color:'#4f6ef7',borderRadius:[5,5,0,0]}},
                {name:'到期金额',type:'bar',barWidth:'35%',data:maturityData,itemStyle:{color:'#f59e0b',borderRadius:[5,5,0,0]}}
              ]
            });
            chart.resize();
          }
        }
        await new Promise(r=>setTimeout(r,650));
        await new Promise(r=>requestAnimationFrame(r));
      }catch(e){
        console.warn('图表渲染失败:',e);
      }
    }

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('landscape','mm','a4');
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const margin = 10;
    const contentWidth = pageWidth - margin * 2;

    // 表格分页
    const ROWS_PER_PAGE = 20;
    const tablePages = [];
    for(let i=0;i<data.length;i += ROWS_PER_PAGE){
      tablePages.push(data.slice(i,i + ROWS_PER_PAGE));
    }
    const totalTablePages = tablePages.length;
    const totalPages = totalTablePages + (hasCharts ? 1 : 0);

    for(let p=0;p<totalTablePages;p++){
      const html = buildTablePageHTML(tablePages[p],p,totalPages);
      const {canvas,width,height} = await captureElement(html,0);
      const scaleFactor = contentWidth / width;
      const imgWidth = contentWidth;
      const imgHeight = height * scaleFactor;
      if(p === 0){
        pdf.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',margin,margin,imgWidth,imgHeight);
      }else{
        pdf.addPage();
        pdf.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',margin,margin,imgWidth,imgHeight);
      }
      canvas.width = 0; canvas.height = 0;
    }

    if(hasCharts){
      const uid = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
      const chartsHTML = buildChartsPageHTML(uid);
      if(chartsHTML){
        const container = document.createElement('div');
        container.style.cssText = 'position:absolute;left:-99999px;top:0;background:#fff;';
        container.innerHTML = chartsHTML;
        document.body.appendChild(container);
        await new Promise(r=>requestAnimationFrame(r));
        await new Promise(r=>setTimeout(r,250));
        await renderChartsInContainer(container,uid);
        const width = 1100;
        const height = Math.max(container.scrollHeight,200);
        const canvas = await html2canvas(container,{
          scale:2,useCORS:true,logging:false,
          backgroundColor:'#ffffff',width:width,height:height,windowWidth:width
        });
        const scaleFactor = contentWidth / width;
        const imgWidth = contentWidth;
        const imgHeight = height * scaleFactor;
        pdf.addPage();
        pdf.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',margin,margin,imgWidth,imgHeight);
        document.body.removeChild(container);
        canvas.width = 0; canvas.height = 0;
      }
    }

    const filename = `存款报表_${label}_${new Date().toISOString().slice(0,10)}.pdf`;
    const pdfBlob = pdf.output('blob');
    if(!pdfBlob || pdfBlob.size === 0){
      throw new Error('生成的 PDF 为空，请重试');
    }

    if(window.cordova && window.cordova.file && cordovaReady){
      await exportWithCordova(pdfBlob,filename,'application/pdf');
      showToast('✅ PDF 已保存到 Download/存款管家备份');
    }else{
      const link = document.createElement('a');
      link.href = URL.createObjectURL(pdfBlob);
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(()=>URL.revokeObjectURL(link.href),1500);
      showToast('📄 PDF 已开始下载');
    }
  }catch(err){
    console.error('导出PDF失败:',err);
    alert('导出 PDF 失败：' + err.message);
    showToast('❌ 导出失败，请重试');
  }finally{
    showLoading(false);
  }
}

/* ================================================================
   工具函数
================================================================ */
function escapeHtml(str){
  if(str === null || str === undefined) return '';
  const map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
  return String(str).replace(/[&<>"']/g,m=>map[m]);
}

function populateYearSelectors(){
  const cy = new Date().getFullYear();
  const years = [];
  for(let y=cy - 6;y <= cy + 6;y++) years.push(y);
  const update = (id)=>{
    const s = document.getElementById(id);
    if(s){
      const prev = s.value;
      s.innerHTML = '<option value="">年份</option>' + years.map(y=>`<option value="${y}">${y}年</option>`).join('');
      if(years.includes(parseInt(prev))) s.value = prev;
    }
  };
  update('startYearQuick');
  update('maturityYearQuick');
}

/* ================================================================
   主题切换
================================================================ */
function initTheme(){
  const saved = localStorage.getItem('deposit_theme');
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = saved || (prefersDark ? 'dark' : 'light');
  applyTheme(theme);
}

function applyTheme(theme){
  if(theme === 'dark'){
    document.documentElement.setAttribute('data-theme','dark');
    const btn = document.getElementById('themeToggleBtn');
    if(btn){ btn.textContent = '☀️'; btn.title = '切换浅色主题'; }
  }else{
    document.documentElement.removeAttribute('data-theme');
    const btn = document.getElementById('themeToggleBtn');
    if(btn){ btn.textContent = '🌙'; btn.title = '切换深色主题'; }
  }
  localStorage.setItem('deposit_theme',theme);
}

function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  applyTheme(cur === 'dark' ? 'light' : 'dark');
}

/* ================================================================
   事件绑定
================================================================ */
function bindEvents(){
  // 用户选择
  document.getElementById('userSelect').addEventListener('change',async e=>{
    currentUser = e.target.value === '__all__' ? null : e.target.value;
    await refreshData();
  });

  // 添加用户
  document.getElementById('addUserBtn').addEventListener('click',async ()=>{
    const name = prompt('请输入新用户名');
    if(name && name.trim()){
      const ok = await addUser(name);
      if(ok){
        await refreshUserSelector();
        await refreshData();
        showToast('✅ 用户已添加');
      }else{
        alert('添加失败：用户名已存在或为空');
      }
    }
  });

  // 管理用户
  document.getElementById('manageUserBtn').addEventListener('click',showManageUsersModal);

  // 统计图表
  document.getElementById('statsBtn').addEventListener('click',showStatsModal);

  // 到期提醒
  document.getElementById('remindBtn').addEventListener('click',()=>checkReminders(true));

  // 到期预测
  document.getElementById('forecastBtn').addEventListener('click',showForecast);

  // 修复重复
  document.getElementById('fixDataBtn').addEventListener('click',fixDuplicateRecords);

  // 安全设置
  document.getElementById('securityBtn').addEventListener('click',showSecuritySettings);

  // 主题切换
  document.getElementById('themeToggleBtn').addEventListener('click',toggleTheme);

  // 搜索
  document.getElementById('searchInput').addEventListener('input',()=>updateList());

  // 新增存款
  document.getElementById('addDepositBtn').addEventListener('click',()=>showDepositModal());

  // 备份 CSV
  document.getElementById('backupCsvBtn').addEventListener('click',async ()=>{
    const deposits = await getDeposits(currentUser);
    if(!deposits.length){ showToast('⚠️ 没有可备份的数据'); return; }
    const enriched = await enrichDeposits(deposits);
    const csv = generateCSVBlob(currentUser,enriched);
    const ts = new Date().toISOString().slice(0,19).replace(/:/g,'-');
    const fn = `存款备份_${currentUser === null ? '合计' : currentUser}_${ts}.csv`;
    if(window.cordova && window.cordova.file && cordovaReady){
      await exportWithCordova(csv,fn,'text/csv');
    }else{
      fallbackDownload(csv,fn,'text/csv');
    }
  });

  // 备份 JSON
  document.getElementById('backupJsonBtn').addEventListener('click',backupJSON);

  // 备份文件夹
  document.getElementById('openBackupFolderBtn').addEventListener('click',openBackupFolder);

  // 导出 PDF
  document.getElementById('pdfBtn').addEventListener('click',exportPDF);

  // 排序
  document.getElementById('sortSelect').addEventListener('change',async ()=>{
    applySort();
    await updateList();
  });

  // CSV 恢复
  const fileInput = document.getElementById('restoreFileInput');
  fileInput.addEventListener('change',async e=>{
    if(!e.target.files.length) return;
    showLoading(true);
    try{
      const result = await importFromCSV(e.target.files[0]);
      showLoading(false);
      alert(`✅ 导入完成：新增 ${result.added} 条记录${result.skipped ? `，跳过 ${result.skipped} 条无效记录` : ''}。\n涉及用户：${result.users.join('、') || '无'}`);
      await refreshUserSelector();
      await refreshData();
    }catch(err){
      showLoading(false);
      alert('恢复失败：' + err.message);
    }
    fileInput.value = '';
  });

  // JSON 恢复
  const jsonInput = document.getElementById('restoreJsonInput');
  jsonInput.addEventListener('change',async e=>{
    if(!e.target.files.length) return;
    showLoading(true);
    try{
      await restoreJSON(e.target.files[0]);
    }catch(err){
      alert('JSON 恢复失败：' + err.message);
    }finally{
      showLoading(false);
    }
    jsonInput.value = '';
  });

  // 年份快捷筛选
  document.getElementById('startYearQuick').addEventListener('change',function(){
    const y = this.value;
    document.getElementById('startDateFrom').value = y ? `${y}-01-01` : '';
    document.getElementById('startDateTo').value = y ? `${y}-12-31` : '';
    updateList();
  });
  document.getElementById('maturityYearQuick').addEventListener('change',function(){
    const y = this.value;
    document.getElementById('maturityDateFrom').value = y ? `${y}-01-01` : '';
    document.getElementById('maturityDateTo').value = y ? `${y}-12-31` : '';
    updateList();
  });

  // 筛选器
  const filterIds = ['filterBank','filterType','filterHolder','minAmount','maxAmount','startDateFrom','startDateTo','maturityDateFrom','maturityDateTo','statusFilter'];
  filterIds.forEach(id=>{
    const el = document.getElementById(id);
    if(el){
      const eventType = (id === 'minAmount' || id === 'maxAmount') ? 'input' : 'change';
      el.addEventListener(eventType,()=>updateList());
    }
  });

  // 清除筛选
  document.getElementById('clearFiltersBtn').addEventListener('click',()=>{
    ['filterBank','filterType','filterHolder','minAmount','maxAmount','searchInput',
     'startDateFrom','startDateTo','maturityDateFrom','maturityDateTo','statusFilter'].forEach(id=>{
      const el = document.getElementById(id);
      if(el) el.value = '';
    });
    const sy = document.getElementById('startYearQuick');
    const my = document.getElementById('maturityYearQuick');
    if(sy) sy.value = '';
    if(my) my.value = '';
    updateList();
    showToast('✅ 筛选条件已清除');
  });

  // 筛选面板折叠
  const toggleBtn = document.getElementById('filterToggleBtn');
  const panel = document.getElementById('filterPanel');
  if(toggleBtn && panel){
    const applyResponsive = ()=>{
      if(window.innerWidth <= 640){
        toggleBtn.style.display = 'block';
        if(!panel.dataset.userToggled){
          panel.classList.add('collapsed');
          toggleBtn.textContent = '🔍 展开筛选条件';
        }
      }else{
        toggleBtn.style.display = 'none';
        panel.classList.remove('collapsed');
      }
    };
    toggleBtn.addEventListener('click',()=>{
      const collapsed = panel.classList.toggle('collapsed');
      toggleBtn.textContent = collapsed ? '🔍 展开筛选条件' : '🔍 收起筛选条件';
      panel.dataset.userToggled = '1';
    });
    applyResponsive();
    window.addEventListener('resize',applyResponsive);
  }

  // 自动锁定：切后台计时
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){
      lastHiddenTime = Date.now();
    }else{
      const autoLockEnabled = localStorage.getItem(SEC_AUTO_LOCK_KEY) !== '0';
      const needLock = hasAppPassword() || localStorage.getItem(SEC_BIO_ENABLED_KEY) === '1';
      if(autoLockEnabled && needLock && lastHiddenTime > 0){
        const away = Date.now() - lastHiddenTime;
        if(away >= SEC_LOCK_TIMEOUT_MS){
          showLockScreen();
        }
      }
      lastHiddenTime = 0;
      if(!document.hidden) refreshData();
    }
  });
}

/* ================================================================
   初始化
================================================================ */
(async function init(){
  try{
    initTheme();

    // ========== 安全门禁：先解锁，再进业务 ==========
    const needLock = hasAppPassword() || localStorage.getItem(SEC_BIO_ENABLED_KEY) === '1';
    if(needLock){
      await showLockScreen();
    }

    await openDB();
    let users = await getUsers();
    if(users.length === 0){
      await addUser('我的存款');
    }
    currentUser = null;
    await refreshUserSelector();
    await refreshData();
    bindEvents();
    populateYearSelectors();
    document.getElementById('startDateFrom').value = '';
    document.getElementById('startDateTo').value = '';
    document.getElementById('maturityDateFrom').value = '';
    document.getElementById('maturityDateTo').value = '';

    document.addEventListener('deviceready',()=>{
      cordovaReady = true;
      showToast('📱 存款管家 Pro 已就绪',3000);
    },false);

    // 初始化后延迟提醒
    setTimeout(()=>checkReminders(false),1200);
    setInterval(()=>checkReminders(false),24 * 3600 * 1000);

    // Ctrl/Cmd + K 聚焦搜索
    document.addEventListener('keydown',e=>{
      if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){
        e.preventDefault();
        document.getElementById('searchInput')?.focus();
      }
      if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'n'){
        e.preventDefault();
        showDepositModal();
      }
    });

  }catch(err){
    console.error('初始化失败:',err);
    alert('初始化失败：' + err.message);
  }
})();

})();
</script>

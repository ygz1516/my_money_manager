<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<meta name="theme-color" content="#4f6ef7">
<title>存款管家 · 旗舰版 Pro</title>
<style>
/* ============================================================
   主题变量
============================================================ */
:root{
  --bg:#eef2f9;
  --bg-glow1:#dbe4ff;
  --bg-glow2:#d6f5ec;
  --card-bg:rgba(255,255,255,0.92);
  --card-solid:#ffffff;
  --card-bg-2:#f7f9fc;
  --text:#1a202c;
  --text-secondary:#5a6c7d;
  --text-muted:#94a3b8;
  --primary:#4f6ef7;
  --primary-hover:#3b54db;
  --primary-soft:rgba(79,110,247,0.12);
  --success:#10b981;
  --success-soft:rgba(16,185,129,0.12);
  --warning:#f59e0b;
  --warning-soft:rgba(245,158,11,0.14);
  --danger:#ef4444;
  --danger-soft:rgba(239,68,68,0.12);
  --info:#6366f1;
  --purple:#8b5cf6;
  --pink:#ec4899;
  --border:#e4e9f2;
  --border-strong:#cbd5e1;
  --shadow:0 1px 3px rgba(15,23,42,0.06),0 1px 2px rgba(15,23,42,0.04);
  --shadow-lg:0 12px 32px rgba(15,23,42,0.10),0 4px 10px rgba(15,23,42,0.05);
  --shadow-glow:0 8px 24px rgba(79,110,247,0.28);
  --radius:18px;
  --radius-sm:12px;
  --radius-xs:9px;
  --transition:0.22s cubic-bezier(0.4,0,0.2,1);
  --font-mono:'SF Mono','Fira Code','Cascadia Code','JetBrains Mono',Consolas,monospace;
  --duplicate-bg:#fffdf3;
  --duplicate-border:#fbbf24;
  --expired-bg:#fef2f2;
  --expired-border:#f87171;
  --soon-bg:#fffbeb;
  --soon-border:#fbbf24;
  --safe-bg:#f0fdf4;
  --safe-border:#4ade80;
  --glass-blur:blur(14px);
}
[data-theme="dark"]{
  --bg:#080d18;
  --bg-glow1:#1b2450;
  --bg-glow2:#0d3a33;
  --card-bg:rgba(24,32,50,0.88);
  --card-solid:#182032;
  --card-bg-2:#1f2a41;
  --text:#e8eefc;
  --text-secondary:#9fb0c9;
  --text-muted:#6b7c96;
  --primary:#6d86ff;
  --primary-hover:#849aff;
  --primary-soft:rgba(109,134,255,0.18);
  --success:#34d399;
  --success-soft:rgba(52,211,153,0.16);
  --warning:#fbbf24;
  --warning-soft:rgba(251,191,36,0.16);
  --danger:#f87171;
  --danger-soft:rgba(248,113,113,0.16);
  --info:#818cf8;
  --border:#2a3550;
  --border-strong:#3b4966;
  --shadow:0 1px 3px rgba(0,0,0,0.4);
  --shadow-lg:0 14px 36px rgba(0,0,0,0.5);
  --shadow-glow:0 8px 26px rgba(109,134,255,0.35);
  --duplicate-bg:#3a3318;
  --duplicate-border:#d4a72c;
  --expired-bg:#3a1e1e;
  --expired-border:#e05252;
  --soon-bg:#3a3117;
  --soon-border:#d4a72c;
  --safe-bg:#123226;
  --safe-border:#2f9e6b;
}

/* ============================================================
   基础
============================================================ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:12px;
  padding-bottom:110px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  transition:background var(--transition),color var(--transition);
  background-image:
    radial-gradient(ellipse 900px 500px at -5% -10%,var(--bg-glow1) 0%,transparent 62%),
    radial-gradient(ellipse 800px 500px at 105% 105%,var(--bg-glow2) 0%,transparent 62%);
  background-attachment:fixed;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    radial-gradient(circle at 20% 30%,rgba(79,110,247,0.06) 0,transparent 40%),
    radial-gradient(circle at 80% 70%,rgba(16,185,129,0.06) 0,transparent 40%);
  z-index:0;
}
.app-container{max-width:900px;margin:0 auto;position:relative;z-index:1;}

/* 滚动条 */
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:var(--primary);}

/* ============================================================
   卡片
============================================================ */
.card{
  background:var(--card-bg);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
  transition:var(--transition);
  position:relative;
  overflow:hidden;
}
.card::after{
  content:'';
  position:absolute;
  top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--primary),var(--purple),var(--pink),var(--success));
  opacity:0.85;
  border-radius:var(--radius) var(--radius) 0 0;
}
.card:hover{box-shadow:var(--shadow-lg);}

/* ============================================================
   头部
============================================================ */
.header{
  display:flex;justify-content:space-between;align-items:center;
  flex-wrap:wrap;gap:10px;margin-bottom:14px;
}
.app-title{
  font-size:1.42rem;font-weight:800;display:flex;align-items:center;gap:8px;
  background:linear-gradient(120deg,var(--primary),var(--purple),var(--pink));
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  letter-spacing:-0.02em;
}
.app-title .emoji{-webkit-text-fill-color:initial;color:initial;font-size:1.5rem;}
.header-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}

/* ============================================================
   按钮
============================================================ */
button,.btn-like{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  background:linear-gradient(135deg,var(--primary),var(--primary-hover));
  border:none;color:#fff;padding:9px 15px;border-radius:22px;
  font-size:0.83rem;font-weight:600;cursor:pointer;transition:var(--transition);
  white-space:nowrap;letter-spacing:0.01em;user-select:none;
  font-family:inherit;
  box-shadow:0 2px 8px rgba(79,110,247,0.22);
}
button:active{transform:scale(0.95);}
button:hover{box-shadow:var(--shadow-glow);filter:brightness(1.06);}
button.secondary{background:linear-gradient(135deg,#7d8ca3,#5f6f88);box-shadow:0 2px 8px rgba(100,116,139,0.25);}
button.danger{background:linear-gradient(135deg,#f87171,#dc2626);box-shadow:0 2px 8px rgba(239,68,68,0.3);}
button.warning{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#3b2600;box-shadow:0 2px 8px rgba(245,158,11,0.3);}
button.success{background:linear-gradient(135deg,#34d399,#059669);box-shadow:0 2px 8px rgba(16,185,129,0.3);}
button.info{background:linear-gradient(135deg,#818cf8,#6366f1);box-shadow:0 2px 8px rgba(99,102,241,0.3);}
button.purple{background:linear-gradient(135deg,#a78bfa,#8b5cf6);box-shadow:0 2px 8px rgba(139,92,246,0.3);}
button.small{padding:6px 12px;font-size:0.76rem;border-radius:18px;}
button.tiny{padding:4px 9px;font-size:0.7rem;border-radius:14px;}
button.ghost{background:transparent;color:var(--primary);border:1.6px solid var(--primary);box-shadow:none;}
button.ghost:hover{background:var(--primary-soft);box-shadow:none;}
button.icon-btn{padding:8px 10px;font-size:0.95rem;border-radius:50%;min-width:38px;height:38px;}
button:disabled{opacity:0.45;cursor:not-allowed;filter:grayscale(0.4);box-shadow:none;}
button:disabled:hover{filter:grayscale(0.4);box-shadow:none;}

/* ============================================================
   表单
============================================================ */
input,select,textarea{
  width:100%;padding:10px 13px;margin:5px 0 10px;
  border:1.6px solid var(--border);border-radius:var(--radius-xs);
  font-size:0.88rem;font-family:inherit;background:var(--card-bg-2);
  transition:var(--transition);color:var(--text);
}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-soft);
  background:var(--card-solid);
}
input::placeholder,textarea::placeholder{color:var(--text-muted);}
select{cursor:pointer;appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--text-secondary) 50%),linear-gradient(135deg,var(--text-secondary) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
  padding-right:32px;
}
label{font-weight:600;font-size:0.79rem;color:var(--text-secondary);
  letter-spacing:0.03em;display:block;margin-top:4px;}

/* ============================================================
   状态条
============================================================ */
.status-bar{
  background:linear-gradient(135deg,var(--card-bg-2),var(--card-solid));
  padding:10px 14px;border-radius:22px;font-size:0.78rem;margin-bottom:12px;
  display:flex;justify-content:space-between;align-items:center;
  flex-wrap:wrap;gap:6px;border:1px solid var(--border);font-weight:500;
  color:var(--text-secondary);
}
.status-bar b{color:var(--text);font-family:var(--font-mono);}
.status-badge{
  display:inline-flex;align-items:center;gap:4px;padding:3px 10px;
  border-radius:20px;font-size:0.72rem;font-weight:700;
}
.status-badge.success{background:var(--success-soft);color:var(--success);}
.status-badge.warning{background:var(--warning-soft);color:#b45309;}
.status-badge.danger{background:var(--danger-soft);color:var(--danger);}
[data-theme="dark"] .status-badge.warning{color:var(--warning);}

/* ============================================================
   汇总卡片
============================================================ */
.summary-cards{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));
  gap:9px;margin-bottom:14px;
}
.summary-card{
  background:linear-gradient(150deg,var(--card-solid),var(--card-bg-2));
  border-radius:var(--radius-sm);padding:12px 12px;border:1px solid var(--border);
  text-align:center;position:relative;overflow:hidden;transition:var(--transition);
}
.summary-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--primary);opacity:0.7;
}
.summary-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);}
.summary-card .sc-value{
  font-size:1.18rem;font-weight:800;font-family:var(--font-mono);
  letter-spacing:-0.02em;line-height:1.25;
  background:linear-gradient(120deg,var(--text),var(--text-secondary));
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
.summary-card .sc-label{font-size:0.68rem;color:var(--text-muted);font-weight:600;margin-top:3px;}
.summary-card.principal::before{background:linear-gradient(180deg,#4f6ef7,#6366f1);}
.summary-card.principal .sc-value{background:linear-gradient(120deg,#4f6ef7,#8b5cf6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.summary-card.curint::before{background:linear-gradient(180deg,#f59e0b,#fbbf24);}
.summary-card.curint .sc-value{background:linear-gradient(120deg,#d97706,#f59e0b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.summary-card.curtotal::before{background:linear-gradient(180deg,#10b981,#34d399);}
.summary-card.curtotal .sc-value{background:linear-gradient(120deg,#059669,#10b981);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.summary-card.matint::before{background:linear-gradient(180deg,#ec4899,#f472b6);}
.summary-card.matint .sc-value{background:linear-gradient(120deg,#db2777,#ec4899);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.summary-card.mattotal::before{background:linear-gradient(180deg,#8b5cf6,#a78bfa);}
.summary-card.mattotal .sc-value{background:linear-gradient(120deg,#7c3aed,#8b5cf6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.summary-card.count::before{background:linear-gradient(180deg,#64748b,#94a3b8);}
.summary-card.rate::before{background:linear-gradient(180deg,#0ea5e9,#38bdf8);}
.summary-card.rate .sc-value{background:linear-gradient(120deg,#0284c7,#0ea5e9);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.summary-card.daily::before{background:linear-gradient(180deg,#f97316,#fb923c);}
.summary-card.daily .sc-value{background:linear-gradient(120deg,#ea580c,#f97316);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}

/* ============================================================
   筛选面板
============================================================ */
.filter-toggle-btn{
  display:none;background:var(--card-bg-2);color:var(--text-secondary);
  border:1.6px solid var(--border);padding:9px 14px;border-radius:20px;
  font-size:0.8rem;font-weight:600;cursor:pointer;width:100%;text-align:center;
  margin-bottom:8px;box-shadow:none;
}
.filter-toggle-btn:hover{background:var(--primary-soft);color:var(--primary);box-shadow:none;}
.filter-panel{
  display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;
  margin-bottom:10px;transition:max-height 0.35s ease,opacity 0.3s ease;
  overflow:hidden;
}
.filter-panel.collapsed{max-height:0 !important;opacity:0;margin-bottom:0;pointer-events:none;}
.filter-group{
  display:flex;flex-direction:column;gap:2px;font-size:0.69rem;
  font-weight:700;color:var(--text-secondary);min-width:100px;
}
.filter-group input,.filter-group select{
  width:auto;min-width:100px;margin:0;padding:7px 10px;
  font-size:0.79rem;border-radius:9px;
}
.filter-group .date-range{display:flex;gap:5px;align-items:center;flex-wrap:wrap;}
.filter-group .date-range input{width:130px;}

/* ============================================================
   排序行
============================================================ */
.sort-row{
  display:flex;gap:8px;align-items:center;font-size:0.76rem;
  margin-bottom:12px;flex-wrap:wrap;
}
.sort-row select{
  width:auto;min-width:120px;margin:0;padding:6px 30px 6px 11px;
  font-size:0.78rem;border-radius:16px;
}

/* ============================================================
   存款卡片列表
============================================================ */
.deposit-list-container{display:flex;flex-direction:column;gap:10px;}
.deposit-item{
  background:var(--card-bg);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  border-radius:var(--radius-sm);padding:14px 16px;
  display:flex;align-items:flex-start;gap:12px;
  border:1.5px solid var(--border);
  transition:var(--transition);
  position:relative;overflow:hidden;
  animation:fadeSlideIn 0.32s ease both;
}
@keyframes fadeSlideIn{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}
.deposit-item:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px);}
.deposit-item.duplicate{background:var(--duplicate-bg);border-left:4px solid var(--duplicate-border);}
.deposit-item.expired{background:var(--expired-bg);border-left:4px solid var(--expired-border);}
.deposit-item.soon{background:var(--soon-bg);border-left:4px solid var(--soon-border);}
.deposit-item.safe{border-left:4px solid var(--safe-border);}
.deposit-checkbox{flex-shrink:0;padding-top:3px;}
.deposit-checkbox input{
  width:20px;height:20px;cursor:pointer;accent-color:var(--primary);margin:0;
}
.deposit-info{flex:1;min-width:0;}
.deposit-info .bank-name{font-weight:800;font-size:0.96rem;}
.deposit-type-tag{
  display:inline-block;margin-left:6px;padding:2px 9px;border-radius:20px;
  font-size:0.68rem;font-weight:700;background:var(--primary-soft);
  color:var(--primary);vertical-align:middle;
}
.amount-display{
  font-weight:800;font-size:1.16rem;font-family:var(--font-mono);
  background:linear-gradient(120deg,#059669,#10b981);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;letter-spacing:-0.02em;
}
.interest-row{color:#e67e22;font-size:0.78rem;font-weight:600;}
[data-theme="dark"] .interest-row{color:#fbbf24;}
.total-row{
  font-size:0.78rem;font-weight:700;
  color:var(--purple);
}
[data-theme="dark"] .total-row{color:#a78bfa;}
.date-row{font-size:0.76rem;color:var(--text-secondary);}
.meta-row{font-size:0.75rem;color:var(--text-muted);}
.deposit-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;align-items:flex-start;}
.deposit-notes{
  font-size:0.72rem;color:var(--text-secondary);background:var(--card-bg-2);
  padding:3px 9px;border-radius:7px;display:inline-block;margin-top:4px;
  border:1px solid var(--border);
}
.countdown-badge{
  display:inline-flex;align-items:center;gap:3px;padding:2px 9px;
  border-radius:20px;font-size:0.7rem;font-weight:700;margin-right:6px;
  margin-top:4px;
}
.countdown-badge.overdue{background:var(--danger-soft);color:var(--danger);}
.countdown-badge.urgent{background:var(--warning-soft);color:#b45309;}
[data-theme="dark"] .countdown-badge.urgent{color:var(--warning);}
.countdown-badge.normal{background:var(--primary-soft);color:var(--primary);}
.countdown-badge.far{background:var(--success-soft);color:var(--success);}

/* 本息小面板 */
.interest-panel{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
  gap:6px;margin-top:8px;
}
.ip-cell{
  background:var(--card-bg-2);border:1px solid var(--border);
  border-radius:9px;padding:6px 8px;
}
.ip-cell .ip-label{font-size:0.62rem;color:var(--text-muted);font-weight:700;letter-spacing:0.02em;}
.ip-cell .ip-value{font-size:0.82rem;font-weight:800;font-family:var(--font-mono);color:var(--text);}
.ip-cell.cur .ip-value{color:#d97706;}
.ip-cell.curtotal .ip-value{color:#059669;}
.ip-cell.mat .ip-value{color:#db2777;}
.ip-cell.mattotal .ip-value{color:#7c3aed;}
[data-theme="dark"] .ip-cell.cur .ip-value{color:#fbbf24;}
[data-theme="dark"] .ip-cell.curtotal .ip-value{color:#34d399;}
[data-theme="dark"] .ip-cell.mat .ip-value{color:#f472b6;}
[data-theme="dark"] .ip-cell.mattotal .ip-value{color:#a78bfa;}

/* 空状态 */
.empty-state{text-align:center;padding:46px 20px !important;}
.empty-state .empty-icon{font-size:3.4rem;line-height:1;margin-bottom:10px;}
.empty-state p{color:var(--text-secondary);font-size:0.9rem;}

/* ============================================================
   模态框
============================================================ */
.modal{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(15,23,42,0.55);
  display:flex;justify-content:center;align-items:center;
  z-index:1000;animation:fadeIn 0.2s ease;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  padding:14px;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px) scale(0.98);}to{opacity:1;transform:translateY(0) scale(1);}}
.modal-content{
  background:var(--card-solid);width:100%;max-width:540px;max-height:90%;
  border-radius:22px;padding:22px;overflow-y:auto;
  box-shadow:0 25px 50px rgba(0,0,0,0.3);
  animation:slideUp 0.26s cubic-bezier(0.34,1.3,0.64,1);
  border:1px solid var(--border);
}
.modal-content h3{
  font-size:1.15rem;font-weight:800;margin-bottom:14px;text-align:center;
  background:linear-gradient(120deg,var(--primary),var(--purple));
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
.modal-content label{
  font-weight:700;font-size:0.78rem;color:var(--text-secondary);
  letter-spacing:0.03em;display:block;margin-top:6px;
}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}

/* ============================================================
   Toast
============================================================ */
.toast-msg{
  position:fixed;bottom:26px;left:16px;right:16px;
  background:linear-gradient(135deg,rgba(15,23,42,0.96),rgba(30,41,59,0.96));
  color:#fff;text-align:center;padding:13px 20px;border-radius:28px;
  z-index:2000;font-size:0.83rem;font-weight:600;
  transition:opacity 0.35s ease,transform 0.35s ease;
  pointer-events:none;backdrop-filter:blur(10px);
  box-shadow:0 12px 30px rgba(0,0,0,0.35);
  border:1px solid rgba(255,255,255,0.08);
  max-width:620px;margin:0 auto;
  transform:translateY(0);
}
.toast-msg.hidden{opacity:0;transform:translateY(14px);}

/* ============================================================
   图表卡片
============================================================ */
.chart-card{
  background:var(--card-solid);border-radius:14px;padding:10px;
  margin-bottom:10px;border:1px solid var(--border);
}
.chart-hint{font-size:10px;text-align:center;color:var(--text-muted);margin-top:4px;}

/* ============================================================
   批量操作条
============================================================ */
.batch-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.batch-bar label{

}

/* ============================================================
   锁屏界面
============================================================ */
.lock-screen{
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 900px 500px at -5% -10%,var(--bg-glow1) 0%,transparent 62%),
    radial-gradient(ellipse 800px 500px at 105% 105%,var(--bg-glow2) 0%,transparent 62%),

}
.lock-card{
  background:var(--card-solid);

  padding:30px 24px;
  width:100%;max-width:360px;

  animation:slideUp 0.32s cubic-bezier(0.34,1.3,0.64,1);
}

  font-size:3.2rem;line-height:1;margin-bottom:8px;

@keyframes lockPulse{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.08);}
}
.lock-title{
  font-size:1.2rem;font-weight:800;margin-bottom:4px;

<script>
/* ================================================================
   存款管家 · 旗舰版 Pro
   全功能单文件应用（含密码 + 指纹识别）
================================================================ */
(function(){
'use strict';

/* ======================== 预设数据 ======================== */
const PRESET_BANKS = [
  "中国工商银行","中国建设银行","中国农业银行","中国银行","交通银行",
  "重庆银行","重庆农村商业银行","微众银行","蓝海银行","邮储银行",
  "招商银行","浦发银行","中信银行","兴业银行","民生银行","光大银行",
  "其他银行","微信理财","支付宝理财","股票基金","京东金融","度小满"
];
const PRESET_DEPOSIT_TYPES = [
  "活期","一年期定期","三年期定期","五年期定期","大额存单",
  "结构性存款","通知存款","理财产品","货币基金","股票基金","其他",
  "现金管理类理财","固收类理财","权益类理财","混合类理财",
  "结构性存款(保本)","结构性存款(非保本)","大额存单(可转让)","大额存单(不可转让)",
  "智能存款","七日通知存款","一个月定期","三个月定期","六个月定期",
  "国债","债券基金","指数基金","养老理财"
];

/* ======================== 安全存储 Key ======================== */
const SEC_PWD_HASH_KEY = 'app_password_hash';
const SEC_PWD_SALT_KEY = 'app_password_salt';
const SEC_BIO_ENABLED_KEY = 'biometric_enabled';
const SEC_AUTO_LOCK_KEY = 'auto_lock_enabled';
const SEC_FAIL_COUNT_KEY = 'lock_fail_count';
const SEC_LOCK_TIMEOUT_MS = 5 * 60 * 1000; // 后台 5 分钟后自动锁定

let lastHiddenTime = 0;

/* ================================================================
   一、密码哈希与验证
================================================================ */
function randomSalt(len = 16){
  const arr = new Uint8Array(len);
  if(window.crypto && window.crypto.getRandomValues){
    window.crypto.getRandomValues(arr);
  }else{
    for(let i = 0; i < len; i++) arr[i] = Math.floor(Math.random() * 256);
  }
  return Array.from(arr).map(b => b.toString(16).padStart(2,'0')).join('');
}

/** 降级哈希（当 crypto.subtle 不可用时使用） */
function fallbackHash(str){
  // 多个不同初始值的 FNV-1a 混合，提高碰撞难度
  let h1 = 0x811c9dc5, h2 = 0x1000193, h3 = 0xdeadbeef;
  for(let i = 0; i < str.length; i++){
    const c = str.charCodeAt(i);
    h1 ^= c; h1 = (h1 * 0x01000193) >>> 0;
    h2 = ((h2 << 5) - h2 + c) >>> 0;
    h3 ^= (c + i); h3 = (h3 * 0x85ebca6b) >>> 0;
  }
  return (h1.toString(16).padStart(8,'0') +
          h2.toString(16).padStart(8,'0') +
          h3.toString(16).padStart(8,'0'));
}

/** 计算密码哈希（Web Crypto 优先，自动降级） */
async function hashPassword(password, salt){
  const input = `${salt}::${password}::deposit_guard`;
  // 迭代增强
  if(window.crypto && window.crypto.subtle && window.crypto.subtle.digest){
    try{
      let data = new TextEncoder().encode(input);
      let buf = await window.crypto.subtle.digest('SHA-256', data);
      // 再迭代 500 次
      for(let i = 0; i < 500; i++){
        buf = await window.crypto.subtle.digest('SHA-256', buf);
      }
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    }catch(e){
      // 落到降级方案
    }
  }
  // 降级：迭代 FNV
  let out = input;
  for(let i = 0; i < 2000; i++){
    out = fallbackHash(out + i);
  }
  return out;
}

async function setAppPassword(password){
  const salt = randomSalt();
  const hash = await hashPassword(password, salt);
  localStorage.setItem(SEC_PWD_SALT_KEY, salt);
  localStorage.setItem(SEC_PWD_HASH_KEY, hash);
  localStorage.setItem(SEC_FAIL_COUNT_KEY, '0');
}

async function verifyPassword(password){
  const storedHash = localStorage.getItem(SEC_PWD_HASH_KEY);
  const salt = localStorage.getItem(SEC_PWD_SALT_KEY) || '';
  if(!storedHash) return true; // 未设置密码
  const inputHash = await hashPassword(password, salt);
  return inputHash === storedHash;
}

function hasAppPassword(){
  return !!localStorage.getItem(SEC_PWD_HASH_KEY);
}

function removeAppPassword(){
  localStorage.removeItem(SEC_PWD_HASH_KEY);
  localStorage.removeItem(SEC_PWD_SALT_KEY);
  localStorage.removeItem(SEC_FAIL_COUNT_KEY);
}

/* ================================================================
   二、指纹 / 生物识别（Cordova 插件）
================================================================ */
function waitForDeviceReady(timeout = 1800){
  if(window.cordova) return Promise.resolve(true);
  return new Promise(resolve => {
    let done = false;
    const timer = setTimeout(()=>{ if(!done){ done = true; resolve(false); } }, timeout);
    document.addEventListener('deviceready', ()=>{
      if(!done){ done = true; clearTimeout(timer); resolve(true); }
    }, { once:true });
  });
}

function isBiometricPluginAvailable(){
  return !!(window.Fingerprint && typeof window.Fingerprint.isAvailable === 'function');
}

/** 检查设备是否支持生物识别 */
function checkBiometricSupport(){
  return new Promise(resolve => {
    if(!isBiometricPluginAvailable()) return resolve(false);
    try{
      window.Fingerprint.isAvailable(
        () => resolve(true),
        () => resolve(false)
      );
    }catch(e){
      resolve(false);
    }
  });
}

/** 执行指纹 / 面容认证 */
function authenticateWithBiometric(){
  return new Promise((resolve, reject) => {
    if(!isBiometricPluginAvailable()){
      reject(new Error('设备不支持生物识别'));
      return;
    }
    try{
      window.Fingerprint.show({
        title: '身份验证',
        subtitle: '请验证指纹以解锁存款管家',
        description: '使用已注册的指纹或面容',
        cancelButtonTitle: '取消',
        fallbackButtonTitle: '使用密码',
        disableBackup: false
      }, () => resolve(true), (err) => reject(err || new Error('认证失败')));
    }catch(e){
      reject(e);
    }
  });
}

/* ================================================================
   三、锁屏界面
================================================================ */
function buildLockScreenHTML(hasPwd, bioAvailable){
  return `
    <div class="lock-card" id="lockCard">
      <div class="lock-icon">🔒</div>
      <div class="lock-title">存款管家已锁定</div>
      <div class="lock-subtitle">${hasPwd ? '请输入密码解锁' : '请验证身份解锁'}</div>

      ${hasPwd ? `
        <div class="lock-input-wrap">
          <input type="password" id="lockPassword" class="lock-input"
                 inputmode="text" autocomplete="off" placeholder="••••••" maxlength="64">
          <button type="button" class="lock-eye" id="lockEye" title="显示/隐藏">👁️</button>
        </div>
      ` : ''}

      <div class="lock-error" id="lockError"></div>

      ${hasPwd ? `<button class="lock-btn success" id="lockSubmit">🔓 解锁</button>` : ''}
      ${bioAvailable ? `<button class="lock-biometric" id="lockBio">👆 使用指纹 / 面容解锁</button>` : ''}

      <div class="lock-attempts" id="lockAttempts"></div>
      <div class="lock-footer">🛡️ 本地加密 · 数据不出设备</div>
    </div>`;
}

async function showLockScreen(){
  const hasPwd = hasAppPassword();
  const bioEnabled = localStorage.getItem(SEC_BIO_ENABLED_KEY) === '1';

  // 未设置任何锁，直接放行
  if(!hasPwd && !bioEnabled) return;

  await waitForDeviceReady(1500);
  const bioAvailable = bioEnabled && await checkBiometricSupport();

  return new Promise(resolve => {
    const lockDiv = document.createElement('div');
    lockDiv.className = 'lock-screen';
    lockDiv.innerHTML = buildLockScreenHTML(hasPwd, bioAvailable);
    document.body.appendChild(lockDiv);

    const card = lockDiv.querySelector('#lockCard');
    const errEl = lockDiv.querySelector('#lockError');
    const attemptsEl = lockDiv.querySelector('#lockAttempts');
    const pwdInput = lockDiv.querySelector('#lockPassword');
    const eyeBtn = lockDiv.querySelector('#lockEye');
    const submitBtn = lockDiv.querySelector('#lockSubmit');
    const bioBtn = lockDiv.querySelector('#lockBio');

    let failCount = parseInt(localStorage.getItem(SEC_FAIL_COUNT_KEY) || '0', 10) || 0;
    let locked = false;

    function refreshAttempts(){
      if(failCount > 0){
        attemptsEl.textContent = `⚠️ 已失败 ${failCount} 次`;
      }else{
        attemptsEl.textContent = '';
      }
    }
    refreshAttempts();

    function showError(msg){
      errEl.textContent = msg;
      card.classList.remove('lock-shake');
      void card.offsetWidth;
      card.classList.add('lock-shake');
    }

    function unlockSuccess(){
      lockDiv.style.transition = 'opacity 0.25s ease';
      lockDiv.style.opacity = '0';
      setTimeout(()=>{
        lockDiv.remove();
        resolve();
      }, 250);
    }

    async function tryPassword(){
      if(locked) return;
      const pwd = (pwdInput?.value || '').trim();
      if(!pwd){
        showError('请输入密码');
        return;
      }
      const ok = await verifyPassword(pwd);
      if(ok){
        failCount = 0;
        localStorage.setItem(SEC_FAIL_COUNT_KEY, '0');
        unlockSuccess();
      }else{
        failCount++;
        localStorage.setItem(SEC_FAIL_COUNT_KEY, String(failCount));
        refreshAttempts();
        showError(`密码错误（第 ${failCount} 次）`);
        if(pwdInput){ pwdInput.value = ''; pwdInput.focus(); }
        // 连续失败 5 次后进入 30 秒冷却
        if(failCount >= 5 && failCount % 5 === 0){
          locked = true;
          const cd = 30;
          let remain = cd;
          showError(`失败次数过多，请 ${remain} 秒后再试`);
          if(submitBtn) submitBtn.disabled = true;
          if(bioBtn) bioBtn.disabled = true;
          const t = setInterval(()=>{
            remain--;
            if(remain <= 0){
              clearInterval(t);
              locked = false;
              if(submitBtn) submitBtn.disabled = false;
              if(bioBtn) bioBtn.disabled = false;
              showError('可以继续尝试了');
            }else{
              showError(`失败次数过多，请 ${remain} 秒后再试`);
            }
          }, 1000);
        }
      }
    }

    if(eyeBtn && pwdInput){
      eyeBtn.onclick = ()=>{
        const isPwd = pwdInput.type === 'password';
        pwdInput.type = isPwd ? 'text' : 'password';
        eyeBtn.textContent = isPwd ? '🙈' : '👁️';
      };
    }

    if(submitBtn){
      submitBtn.onclick = tryPassword;
    }
    if(pwdInput){
      pwdInput.addEventListener('keydown', e=>{
        if(e.key === 'Enter') tryPassword();
      });
      setTimeout(()=>pwdInput.focus(), 180);
    }

    if(bioBtn){
      bioBtn.onclick = async ()=>{
        if(locked) return;
        errEl.textContent = '';
        try{
          await authenticateWithBiometric();
          failCount = 0;
          localStorage.setItem(SEC_FAIL_COUNT_KEY, '0');
          unlockSuccess();
        }catch(err){
          const msg = (err && (err.message || err)) || '认证失败';
          showError(typeof msg === 'string' ? msg : '认证未通过');
        }
      };
      // 自动弹指纹（首次进入延迟一点点，体验更好）
      setTimeout(()=>{
        if(!locked && bioBtn && document.body.contains(bioBtn)){
          bioBtn.click();
        }
      }, 320);
    }
  });
}

/* ================================================================
   五、IndexedDB
================================================================ */
const DB_NAME = 'DepositDB';
const DB_VERSION = 5;
let db = null;

function openDB(){
  return new Promise((resolve,reject)=>{
    const request = indexedDB.open(DB_NAME,DB_VERSION);
    request.onerror = ()=>reject(request.error);
    request.onsuccess = ()=>{ db = request.result; resolve(db); };
    request.onupgradeneeded = (e)=>{
      const database = e.target.result;
      if(!database.objectStoreNames.contains('users')){
        database.createObjectStore('users',{keyPath:'name'});
      }
      if(!database.objectStoreNames.contains('deposits')){
        const store = database.createObjectStore('deposits',{keyPath:'id',autoIncrement:true});
        store.createIndex('user','user',{unique:false});
      }
      if(!database.objectStoreNames.contains('rate_history')){
        const store = database.createObjectStore('rate_history',{keyPath:'id',autoIncrement:true});
        store.createIndex('deposit_id','deposit_id',{unique:false});
      }
    };
  });
}

async function getStore(storeName,mode='readonly'){
  if(!db) await openDB();
  return db.transaction(storeName,mode).objectStore(storeName);
}

/* ======================== 用户操作 ======================== */
async function getUsers(){
  const store = await getStore('users');
  const all = await new Promise(resolve=>{
    const req = store.getAll();
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>resolve([]);
  });
  return all.map(u=>u.name);
}

async function addUser(name){
  if(!name) return false;
  name = String(name).trim();
  if(!name) return false;
  const users = await getUsers();
  if(users.includes(name)) return false;
  const store = await getStore('users','readwrite');
  await store.add({name});
  return true;
}

async function deleteUser(name){
  const users = await getUsers();
  if(!users.includes(name)) return false;
  const deposits = await getDeposits(name);
  if(deposits.length > 0){
    alert(`用户「${name}」还有 ${deposits.length} 笔存款，请先删除或转移这些存款。`);
    return false;
  }
  const store = await getStore('users','readwrite');
  await store.delete(name);
  return true;
}

async function renameUser(oldName,newName){
  if(!newName || newName === oldName) return false;
  newName = String(newName).trim();
  if(!newName) return false;
  const users = await getUsers();
  if(users.includes(newName)) return false;
  const userStore = await getStore('users','readwrite');
  await userStore.delete(oldName);
  await userStore.add({name:newName});
  const depStore = await getStore('deposits','readwrite');
  const all = await new Promise(resolve=>{
    const req = depStore.getAll();
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>resolve([]);
  });
  for(let d of all){
    if(d.user === oldName){
      d.user = newName;
      await depStore.put(d);
    }
  }
  return true;
}

/* ======================== 存款操作 ======================== */
async function getDeposits(user){
  if(!user) return await getAllDeposits();
  const store = await getStore('deposits');
  const index = store.index('user');
  const items = await new Promise(resolve=>{
    const req = index.getAll(user);
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>resolve([]);
  });
  return items.map(d=>({...d,id:d.id}));
}

async function getAllDeposits(){
  const store = await getStore('deposits');
  const all = await new Promise(resolve=>{
    const req = store.getAll();
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>resolve([]);
  });
  return all.map(d=>({...d,id:d.id}));
}

async function saveDeposit(deposit){
  const store = await getStore('deposits','readwrite');
  const isNew = !deposit.id;
  let savedId;
  if(deposit.id){
    await store.put(deposit);
    savedId = deposit.id;
  }else{
    delete deposit.id;
    savedId = await new Promise(resolve=>{
      const req = store.add(deposit);
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = ()=>resolve(null);
    });
    deposit.id = savedId;
  }
  if(deposit.startDate && deposit.rate != null && !isNaN(deposit.rate)){
    const rateStore = await getStore('rate_history','readwrite');
    const idx = rateStore.index('deposit_id');
    const existing = await new Promise(resolve=>{
      const req = idx.getAll(savedId);
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = ()=>resolve([]);
    });
    if(existing.length === 0){
      await rateStore.add({
        deposit_id:savedId,
        effective_date:deposit.startDate,
        interest_rate:deposit.rate
      });
    }else{
      const first = existing.sort((a,b)=>new Date(a.effective_date)-new Date(b.effective_date))[0];
      first.interest_rate = deposit.rate;
      first.effective_date = deposit.startDate;
      await rateStore.put(first);
    }
  }
  return savedId;
}

async function deleteDeposit(id){
  const store = await getStore('deposits','readwrite');
  await store.delete(id);
  const rateStore = await getStore('rate_history','readwrite');
  const idx = rateStore.index('deposit_id');
  const rates = await new Promise(resolve=>{
    const req = idx.getAll(id);
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>resolve([]);
  });
  for(let r of rates) await rateStore.delete(r.id);
}

async function deleteDeposits(ids){
  for(let id of ids) await deleteDeposit(id);
}

async function unlockDeposit(id){
  const store = await getStore('deposits','readwrite');
  const dep = await new Promise(resolve=>{
    const req = store.get(id);
    req.onsuccess = ()=>resolve(req.result);
  });
  if(dep){
    dep.is_unlocked = 1;
    await store.put(dep);
  }
}

async function cloneDeposit(dep){
  const newDep = {...dep};
  delete newDep.id;
  newDep.notes = (newDep.notes ? newDep.notes + ' ' : '') + '[复制]';
  newDep.is_unlocked = 0;
  return await saveDeposit(newDep);
}

    const req = idx.getAll(depositId);
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>resolve([]);

async function addRateChange(depositId,effectiveDate,interestRate){

    interest_rate:interestRate
  });
  return true;
}

/* ======================== 日期工具 ======================== */
function parseDate(dateStr){
  if(!dateStr) return null;
  if(dateStr instanceof Date) return isNaN(dateStr.getTime()) ? null : dateStr;
  let d = new Date(dateStr);
  if(!isNaN(d.getTime())) return d;
  let parts = String(dateStr).split(/[-\/\.]/);
  if(parts.length === 3){
    let year = parseInt(parts[0]);
    let month = parseInt(parts[1]) - 1;
    let day = parseInt(parts[2]);
    if(String(parts[0]).length === 4){
      d = new Date(year,month,day);
    }else{
      d = new Date(day,month,year);
    }
    if(!isNaN(d.getTime())) return d;
  }
  if(/^\d{8}$/.test(dateStr)){
    let year = parseInt(dateStr.slice(0,4));
    let month = parseInt(dateStr.slice(4,6)) - 1;
    let day = parseInt(dateStr.slice(6,8));
    d = new Date(year,month,day);
    if(!isNaN(d.getTime())) return d;
  }
  return null;
}

function formatDate(date){
  if(!date) return null;
  const d = (date instanceof Date) ? date : parseDate(date);
  if(!d) return null;
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function todayStart(){
  const t = new Date();
  t.setHours(0,0,0,0);
  return t;
}

function daysBetween(a,b){
  return Math.round((b - a) / (1000 * 3600 * 24));
}

/* ======================== 利息计算（支持利率历史） ======================== */
async function calculateInterest(deposit,asOfDate=null){
  const { startDate,maturityDate,amount,rate,interestType,id } = deposit;
  if(!startDate || amount <= 0 || rate == null || isNaN(rate)) return 0;
  const start = parseDate(startDate);
  if(!start) return 0;
  let asOf = asOfDate
    ? (typeof asOfDate === 'string' ? parseDate(asOfDate) : asOfDate)
    : new Date();
  if(!asOf || isNaN(asOf.getTime())) asOf = new Date();
  const end = maturityDate ? parseDate(maturityDate) : null;
  const actualEnd = end ? (asOf < end ? asOf : end) : asOf;
  if(actualEnd <= start) return 0;

  let periods = [];
  if(id){
    const hist = await getRateHistory(id);
    if(hist.length > 0){
      let prevDate = start;
      for(let h of hist){
        const eff = parseDate(h.effective_date);
        if(eff && eff > start){
          if(prevDate < eff){
            periods.push({
              start:prevDate,
              end:(eff < actualEnd ? eff : actualEnd),
              rate:h.interest_rate
            });
          }
          prevDate = eff;
        }
      }
      if(prevDate < actualEnd){
        periods.push({
          start:prevDate,
          end:actualEnd,
          rate:hist[hist.length-1].interest_rate
        });
      }
    }else{
      periods.push({start,end:actualEnd,rate});
    }
  }else{
    periods.push({start,end:actualEnd,rate});
  }

  let total = 0;
  for(let p of periods){
    if(p.end <= p.start) continue;
    const days = (p.end - p.start) / (1000 * 3600 * 24);
    const dailyRate = p.rate / 100 / 365;
    if(interestType === 'compound'){
      total += amount * (Math.pow(1 + dailyRate,days) - 1);
    }else{
      total += dailyRate * amount * days;
    }
  }
  return Math.round(total * 100) / 100;
}

async function calculateTotalInterest(deposit){
  if(!deposit.maturityDate) return 0;
  const mat = parseDate(deposit.maturityDate);
  if(!mat) return 0;
  return await calculateInterest(deposit,mat);
}

async function enrichDeposits(deposits){
  return await Promise.all(deposits.map(async d=>{
    d.amount = Number(d.amount);
    if(isNaN(d.amount)) d.amount = 0;
    d.rate = (d.rate === '' || d.rate === null || d.rate === undefined) ? null : Number(d.rate);
    if(d.rate != null && isNaN(d.rate)) d.rate = null;
    d.currentInterest = await calculateInterest(d);
    d.totalInterest = await calculateTotalInterest(d);
    d.currentTotal = Math.round((d.amount + d.currentInterest) * 100) / 100;
    d.maturityTotal = Math.round((d.amount + d.totalInterest) * 100) / 100;
    d._matDate = d.maturityDate ? parseDate(d.maturityDate) : null;
    d._startDate = d.startDate ? parseDate(d.startDate) : null;
    return d;
  }));
}

function getMaturityStatus(dep){
  if(!dep._matDate) return 'none';
  const now = todayStart();
  const mat = new Date(dep._matDate);
  mat.setHours(0,0,0,0);
  const diffDays = Math.floor((mat - now) / (1000 * 3600 * 24));
  if(diffDays < 0) return 'expired';
  if(diffDays <= 7) return 'urgent';
  if(diffDays <= 30) return 'soon';
  return 'safe';
}

function escapeCSV(cell){
  if(cell === undefined || cell === null) return '';
  const str = String(cell);
  if(str.includes(',') || str.includes('"') || str.includes('\n') || str.includes('\r')){
    return '"' + str.replace(/"/g,'""') + '"';
  }
  return str;
}

function generateCSVBlob(user,deposits){
  const sorted = [...deposits].sort((a,b)=>
    (a.maturityDate || '9999-12-31') > (b.maturityDate || '9999-12-31') ? 1 : -1
  );
  const rows = [];
  for(let i=0;i<sorted.length;i++){
    const d = sorted[i];
    rows.push([
      (i+1).toString(),
      d.user,
      d.bank,
      d.depositType,
      Number(d.amount).toFixed(2),
      d.startDate || '',
      d.maturityDate || '',
      d.rate != null ? Number(d.rate).toFixed(4) : '',
      d.interestType === 'compound' ? 'compound' : 'simple',
      d.notes || '',
      d.is_unlocked ? '是' : '否',
      d.currentInterest != null ? Number(d.currentInterest).toFixed(2) : '',
      d.totalInterest != null ? Number(d.totalInterest).toFixed(2) : '',
      d.currentTotal != null ? Number(d.currentTotal).toFixed(2) : '',
      d.maturityTotal != null ? Number(d.maturityTotal).toFixed(2) : ''
    ]);
  }
  const csvLines = [
    ['序号','用户','银行','存款名称','金额(元)','存入日期','到期日期','利率(%)','计息类型','备注','解锁状态','当前利息','到期利息','当前本息合计','到期本息合计'],
    ...rows
  ];
  return '\uFEFF' + csvLines.map(row=>row.map(escapeCSV).join(',')).join('\n');
}

function fallbackDownload(content,filename,mime='text/csv'){
  const blob = new Blob([content],{type:mime});
  const link = document.createElement('a');
  const url = URL.createObjectURL(blob);
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  showToast(`📥 已触发下载：${filename}`,4500);
}

async function requestStoragePermission(){
  if(!window.cordova || !window.cordova.plugins || !window.cordova.plugins.permissions) return true;
  const permissions = window.cordova.plugins.permissions;
  return new Promise(resolve=>{
    permissions.hasPermission(permissions.WRITE_EXTERNAL_STORAGE,(status)=>{
      if(status.hasPermission) resolve(true);
      else permissions.requestPermission(
        permissions.WRITE_EXTERNAL_STORAGE,
        (result)=>resolve(result.hasPermission),
        ()=>resolve(false)
      );
    },()=>resolve(false));
  });
}

async function exportWithCordova(content,filename,mime='text/csv'){
  if(!window.cordova || !window.cordova.file){
    fallbackDownload(content,filename,mime);
    return false;
  }
  await requestStoragePermission();
  const externalRoot = window.cordova.file.externalRootDirectory;
  const backupDir = externalRoot + 'Download/存款管家备份/';
  const resolveLocalFileSystemURL = window.resolveLocalFileSystemURL;
  return new Promise(resolve=>{
    resolveLocalFileSystemURL(backupDir,(dirEntry)=>{
      writeFileToDir(dirEntry,filename,content,mime,resolve);
    },()=>{
      resolveLocalFileSystemURL(externalRoot + 'Download/',(downloadDir)=>{
        downloadDir.getDirectory('存款管家备份',{create:true},(newDir)=>{
          writeFileToDir(newDir,filename,content,mime,resolve);
        },()=>{ fallbackDownload(content,filename,mime); resolve(false); });
      },()=>{ fallbackDownload(content,filename,mime); resolve(false); });
    });
  });
}

function writeFileToDir(dirEntry,filename,content,mime,callback){
  dirEntry.getFile(filename,{create:true,exclusive:false},(fileEntry)=>{
    fileEntry.createWriter((writer)=>{
      writer.onwriteend = ()=>{
        showToast(`✅ 已保存到：${fileEntry.nativeURL || fileEntry.toURL()}`,5500);
        callback(true);
      };
      writer.onerror = ()=>{ fallbackDownload(content,filename,mime); callback(false); };
      const blob = (content instanceof Blob) ? content : new Blob([content],{type:mime});
      writer.write(blob);
    },()=>{ fallbackDownload(content,filename,mime); callback(false); });
  },()=>{ fallbackDownload(content,filename,mime); callback(false); });
}

/* ---------------- CSV 导入 ---------------- */
async function importFromCSV(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = async (e)=>{
      try{
        let text = e.target.result;
        if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
        const lines = text.split(/\r?\n/).filter(l=>l.trim().length > 0);
        if(lines.length < 2) return reject(new Error('文件内容为空或格式不正确'));

        const parseCSVLine = (line)=>{
          const result = [];
          let inQuote = false;
          let current = '';
          for(let i=0;i<line.length;i++){
            const ch = line[i];
            if(ch === '"'){
              if(inQuote && line[i+1] === '"'){ current += '"'; i++; }
              else inQuote = !inQuote;
            }else if(ch === ',' && !inQuote){
              result.push(current.trim());
              current = '';
            }else{
              current += ch;
            }
          }
          result.push(current.trim());
          return result;
        };

        const headers = parseCSVLine(lines[0]);
        const findIdx = (keywords)=>{
          for(let kw of keywords){
            const idx = headers.findIndex(h=>h.includes(kw));
            if(idx !== -1) return idx;
          }
          return -1;
        };
        const colMap = {
          userIdx:findIdx(['用户','持有人']),
          bankIdx:findIdx(['银行']),
          nameIdx:findIdx(['存款名称','类型']),
          amountIdx:findIdx(['金额(元)','金额']),
          startIdx:findIdx(['存入日期','起始日期']),
          maturityIdx:findIdx(['到期日期']),
          rateIdx:findIdx(['利率(%)','利率']),
          intTypeIdx:findIdx(['计息类型']),
          notesIdx:findIdx(['备注']),
          unlockIdx:findIdx(['解锁状态'])
        };
        if(colMap.userIdx === -1) return reject(new Error('未找到「用户」列'));
        if(colMap.amountIdx === -1) return reject(new Error('未找到「金额」列'));

        const existingUsers = await getUsers();
        let added = 0, skipped = 0;
        const affectedUsers = new Set();

        for(let i=1;i<lines.length;i++){
          const fields = parseCSVLine(lines[i]);
          if(fields.length < 5) continue;

          let userName = fields[colMap.userIdx]?.trim();
          if(!userName) continue;

          const amountRaw = (fields[colMap.amountIdx] || '').replace(/,/g,'').trim();
          const amount = parseFloat(amountRaw);
          if(isNaN(amount) || amount <= 0){ skipped++; continue; }

          affectedUsers.add(userName);
          if(!existingUsers.includes(userName)){
            await addUser(userName);
            existingUsers.push(userName);
          }

          const bank = (fields[colMap.bankIdx] || '').trim();
          const depositType = (fields[colMap.nameIdx] || '').trim();
          let startDate = null;
          if(colMap.startIdx >= 0){
            const d = parseDate((fields[colMap.startIdx] || '').trim());
            if(d) startDate = formatDate(d);
          }
          let maturityDate = null;
          if(colMap.maturityIdx >= 0){
            const d = parseDate((fields[colMap.maturityIdx] || '').trim());
            if(d) maturityDate = formatDate(d);
          }
          let rate = null;
          if(colMap.rateIdx >= 0){
            const r = parseFloat((fields[colMap.rateIdx] || '').trim());
            if(!isNaN(r)) rate = r;
          }
          let interestType = 'simple';
          if(colMap.intTypeIdx >= 0){
            const raw = ((fields[colMap.intTypeIdx] || '').trim()).toLowerCase();
            interestType = (raw === 'compound' || raw === '复利') ? 'compound' : 'simple';
          }
          const notes = colMap.notesIdx >= 0 ? ((fields[colMap.notesIdx] || '').trim()) : '';
          const isUnlocked = (colMap.unlockIdx >= 0 && (fields[colMap.unlockIdx] || '').trim() === '是') ? 1 : 0;

          await saveDeposit({
            user:userName, bank, depositType, amount,
            startDate, maturityDate, rate, interestType, notes,
            is_unlocked:isUnlocked
          });
          added++;
        }
        resolve({added,skipped,users:Array.from(affectedUsers)});
      }catch(err){
        reject(err);
      }
    };
    reader.onerror = ()=>reject(reader.error);
    reader.readAsText(file,'UTF-8');
  });
}

async function restoreJSON(file){
  const text = await file.text();
  const data = JSON.parse(text);
  if(!data || !Array.isArray(data.users) || !Array.isArray(data.deposits)){
    throw new Error('JSON 格式不正确');
  }
  if(!confirm('JSON 恢复将清空当前全部数据并替换为备份内容，确定继续吗？')) return;

  const tx = db.transaction(['users','deposits','rate_history'],'readwrite');
  const userStore = tx.objectStore('users');
  const depStore = tx.objectStore('deposits');
  const rateStore = tx.objectStore('rate_history');

  await Promise.all([
    new Promise(r=>{ const req = userStore.clear(); req.onsuccess = r; req.onerror = r; }),
    new Promise(r=>{ const req = depStore.clear(); req.onsuccess = r; req.onerror = r; }),
    new Promise(r=>{ const req = rateStore.clear(); req.onsuccess = r; req.onerror = r; })
  ]);

  for(let u of data.users) userStore.add({name:u});
  for(let d of data.deposits) depStore.add(d);
  for(let r of (data.rate_history || [])) rateStore.add(r);

  await new Promise((resolve,reject)=>{
    tx.oncomplete = resolve;
    tx.onerror = ()=>reject(tx.error);
  });
  await refreshUserSelector();
  await refreshData();
  alert('✅ JSON 恢复成功！');
}

/* ---------------- 修复重复数据 ---------------- */
async function fixDuplicateRecords(){
  const allDepositsData = await getAllDeposits();
  const groups = new Map();
  for(let d of allDepositsData){
    const key = [
      d.user,d.bank,d.depositType,Number(d.amount),
      d.startDate,d.maturityDate,d.rate,d.interestType,d.notes
    ].join('|');
    if(!groups.has(key)) groups.set(key,[]);
    groups.get(key).push(d);
  }
  const duplicates = Array.from(groups.values()).filter(list=>list.length > 1);
  if(duplicates.length === 0){
    alert('✅ 未发现完全重复的记录。');
    return;
  }
  let msg = `⚠️ 发现 ${duplicates.length} 组重复记录：\n\n`;
  let count = 0;
  for(let group of duplicates){
    count += group.length - 1;
    msg += `• ${group[0].bank} ${group[0].depositType} ¥${Number(group[0].amount).toFixed(2)} — ID: ${group.map(d=>d.id).join(', ')} (${group.length}条)\n`;
    if(msg.length > 800){ msg += '...\n'; break; }
  }
  msg += `\n共可删除 ${count} 条重复记录。\n是否保留每组第一条，删除其余？\n点击「确定」执行清理。`;
  if(confirm(msg)){
    let deleted = 0;
    for(let group of duplicates){
      const sorted = group.sort((a,b)=>a.id-b.id);
      for(let i=1;i<sorted.length;i++){
        await deleteDeposit(sorted[i].id);
        deleted++;
      }
    }
    alert(`✅ 已删除 ${deleted} 条重复记录。`);
    await refreshData();
  }
}

function applySort(){
  const sortVal = document.getElementById('sortSelect')?.value || 'maturityDate-asc';
  const [field,dir] = sortVal.split('-');
  const multiplier = dir === 'desc' ? -1 : 1;
  allDeposits.sort((a,b)=>{
    let va,vb;
    switch(field){
      case 'maturityDate':
        va = a.maturityDate || '9999-12-31';
        vb = b.maturityDate || '9999-12-31';
        break;
      case 'amount':
        va = a.amount; vb = b.amount;
        break;
      case 'startDate':
        va = a.startDate || '0000-01-01';
        vb = b.startDate || '0000-01-01';
        break;
      case 'rate':
        va = a.rate ?? -1; vb = b.rate ?? -1;
        break;
      case 'interest':
        va = a.currentInterest || 0; vb = b.currentInterest || 0;
        break;
      case 'bank':
        return multiplier * String(a.bank || '').localeCompare(String(b.bank || ''),'zh-CN');
      default:
        va = a.maturityDate || '9999-12-31';
        vb = b.maturityDate || '9999-12-31';
    }
    if(va < vb) return -1 * multiplier;
    if(va > vb) return 1 * multiplier;
    return 0;
  });
}

function detectDuplicates(){
  const keyMap = new Map();
  duplicateIds.clear();
  for(let d of allDeposits){
    const key = `${d.user}|${d.bank}|${d.depositType}|${d.amount}|${d.startDate}|${d.maturityDate}`;
    if(keyMap.has(key)){
      duplicateIds.add(d.id);
      duplicateIds.add(keyMap.get(key));
    }else{
      keyMap.set(key,d.id);
    }
  }
}

/* ---------------- 列表更新 ---------------- */
async function updateList(){
  let filtered = [...allDeposits];

  // 搜索
  const searchText = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
  if(searchText){
    filtered = filtered.filter(d=>
      String(d.bank || '').toLowerCase().includes(searchText) ||
      String(d.depositType || '').toLowerCase().includes(searchText) ||
      String(d.notes || '').toLowerCase().includes(searchText) ||
      String(d.user || '').toLowerCase().includes(searchText)
    );
  }

  // 银行
  const fb = document.getElementById('filterBank')?.value;
  if(fb) filtered = filtered.filter(d=>d.bank === fb);
  // 类型
  const ft = document.getElementById('filterType')?.value;
  if(ft) filtered = filtered.filter(d=>d.depositType === ft);
  // 持有人
  const fh = document.getElementById('filterHolder')?.value;
  if(fh) filtered = filtered.filter(d=>d.user === fh);
  // 金额
  const minA = parseFloat(document.getElementById('minAmount')?.value);
  if(!isNaN(minA)) filtered = filtered.filter(d=>d.amount >= minA);
  const maxA = parseFloat(document.getElementById('maxAmount')?.value);
  if(!isNaN(maxA)) filtered = filtered.filter(d=>d.amount <= maxA);
  // 存入日期
  const sdF = document.getElementById('startDateFrom')?.value;
  if(sdF) filtered = filtered.filter(d=>d.startDate && d.startDate >= sdF);
  const sdT = document.getElementById('startDateTo')?.value;
  if(sdT) filtered = filtered.filter(d=>d.startDate && d.startDate <= sdT);
  // 到期日期
  const mdF = document.getElementById('maturityDateFrom')?.value;
  if(mdF) filtered = filtered.filter(d=>d.maturityDate && d.maturityDate >= mdF);
  const mdT = document.getElementById('maturityDateTo')?.value;
  if(mdT) filtered = filtered.filter(d=>d.maturityDate && d.maturityDate <= mdT);
  // 状态
  const stF = document.getElementById('statusFilter')?.value;
  if(stF){
    filtered = filtered.filter(d=>{
      const st = getMaturityStatus(d);
      if(stF === 'expired') return st === 'expired';
      if(stF === 'urgent') return st === 'urgent';
      if(stF === 'soon') return st === 'soon' || st === 'urgent';
      if(stF === 'safe') return st === 'safe';
      if(stF === 'none') return st === 'none';
      return true;
    });
  }

  currentFilteredDeposits = filtered;

  // ---- 汇总计算 ----
  const totalAmount = filtered.reduce((s,d)=>s+d.amount,0);
  const totalCurr = filtered.reduce((s,d)=>s+(d.currentInterest || 0),0);
  const totalMat = filtered.reduce((s,d)=>s+(d.totalInterest || 0),0);
  const totalCurrTotal = totalAmount + totalCurr;
  const totalMatTotal = totalAmount + totalMat;
  const avgRate = totalAmount > 0
    ? filtered.reduce((s,d)=>s + d.amount * (d.rate || 0),0) / totalAmount
    : 0;
  // 日均收益：本金 × 年利率 / 365 累加（只统计未到期的）
  const dailyIncome = filtered.reduce((s,d)=>{
    const r = (d.rate != null && !isNaN(d.rate)) ? d.rate : 0;
    const st = getMaturityStatus(d);
    if(st === 'expired') return s;
    return s + d.amount * r / 100 / 365;
  },0);

  // 状态条
  const statsTextEl = document.getElementById('statsText');
  if(statsTextEl){
    statsTextEl.innerHTML =
      `📋 <b>${filtered.length}</b> 条 · 本金 <b>¥${fmt(totalAmount)}</b> · 当前利息 <b>¥${fmt(totalCurr)}</b> · 到期利息 <b>¥${fmt(totalMat)}</b>`;
  }

  const dupWarn = document.getElementById('duplicateWarning');
  if(dupWarn){
    dupWarn.innerHTML = duplicateIds.size > 0
      ? `<span class="status-badge warning">⚠️ ${duplicateIds.size} 条重复</span>`
      : '';
  }

  // 汇总卡片
  setText('scPrincipal', '¥' + fmt(totalAmount,0));
  setText('scCurrInterest','¥' + fmt(totalCurr,0));
  setText('scCurrTotal',  '¥' + fmt(totalCurrTotal,0));
  setText('scMatInterest', '¥' + fmt(totalMat,0));
  setText('scMatTotal',   '¥' + fmt(totalMatTotal,0));
  setText('scAvgRate',     avgRate.toFixed(2) + '%');
  setText('scDailyIncome', '¥' + fmt(dailyIncome,2));
  setText('scCount',       String(filtered.length));

  // Tooltip 完整数值
  setTitle('scPrincipal', `本金总额 ¥${totalAmount.toFixed(2)}`);
  setTitle('scCurrInterest', `当前利息 ¥${totalCurr.toFixed(2)}`);
  setTitle('scCurrTotal', `当前本息合计 ¥${totalCurrTotal.toFixed(2)}`);
  setTitle('scMatInterest', `到期利息 ¥${totalMat.toFixed(2)}`);
  setTitle('scMatTotal', `到期本息合计 ¥${totalMatTotal.toFixed(2)}`);
  setTitle('scAvgRate', `加权平均年利率 ${avgRate.toFixed(4)}%`);
  setTitle('scDailyIncome', `按今日计算的日均收益 ¥${dailyIncome.toFixed(4)}`);

  renderDepositList(filtered);
  updateSelectedStats();
}

function setText(id,val){
  const el = document.getElementById(id);
  if(el) el.textContent = val;
}
function setTitle(id,val){
  const el = document.getElementById(id);
  if(el) el.title = val;
}
function fmt(n,digits=2){
  if(n === null || n === undefined || isNaN(n)) return '0';
  return Number(n).toLocaleString('zh-CN',{
    minimumFractionDigits:digits,
    maximumFractionDigits:digits
  });

function renderDepositList(filtered){
  const container = document.getElementById('depositListContainer');
  if(!container) return;

  if(!filtered.length){
    container.innerHTML = `
      <div class="card empty-state">
        <div class="empty-icon">🏦</div>
        <p><b>暂无存款记录</b></p>
        <p style="color:var(--text-muted);font-size:0.83rem;">点击上方「➕ 新增存款」开始记录</p>
      </div>`;
    return;
  }

  container.innerHTML = filtered.map(dep=>{
    const status = getMaturityStatus(dep);
    let statusClass = '';
    let countdownHTML = '';

    if(status === 'expired'){
      statusClass = 'expired';
      const days = Math.abs(daysBetween(todayStart(),dep._matDate));
      countdownHTML = `<span class="countdown-badge overdue">⚠️ 已到期 ${days} 天</span>`;
    }else if(status === 'urgent'){
      statusClass = 'soon';
      const days = daysBetween(todayStart(),dep._matDate);
      countdownHTML = `<span class="countdown-badge urgent">⏰ ${days} 天后到期</span>`;
    }else if(status === 'soon'){
      statusClass = 'soon';
      const days = daysBetween(todayStart(),dep._matDate);
      countdownHTML = `<span class="countdown-badge normal">📅 ${days} 天后到期</span>`;
    }else if(status === 'safe' && dep._matDate){
      statusClass = 'safe';
      const days = daysBetween(todayStart(),dep._matDate);
      countdownHTML = `<span class="countdown-badge far">✅ ${days} 天后到期</span>`;
    }

    const dupeClass = duplicateIds.has(dep.id) ? ' duplicate' : '';
    const showUnlock = !dep.is_unlocked && dep.maturityDate && (status === 'urgent' || status === 'expired');

    return `<div class="deposit-item${dupeClass} ${statusClass}" data-id="${dep.id}">
      <div class="deposit-checkbox">
        <input type="checkbox" class="deposit-check" value="${dep.id}">

          <div class="ip-cell curtotal">

            <div class="ip-value">¥${fmt(dep.currentTotal)}</div>
          </div>
          <div class="ip-cell mattotal">

function bindBatchEvents(){
  const selectAll = document.getElementById('selectAllCheckbox');
  if(selectAll){
    const newEl = selectAll.cloneNode(true);
    selectAll.parentNode.replaceChild(newEl,selectAll);
    newEl.addEventListener('change',e=>{
      document.querySelectorAll('.deposit-check').forEach(cb=>cb.checked = e.target.checked);
      updateSelectedStats();
    });
  }
  const batchDelete = document.getElementById('batchDeleteBtn');
  if(batchDelete){
    const newEl = batchDelete.cloneNode(true);
    batchDelete.parentNode.replaceChild(newEl,batchDelete);
    newEl.addEventListener('click',async ()=>{
      const checked = document.querySelectorAll('.deposit-check:checked');
      if(!checked.length){ alert('请先勾选要删除的存款记录'); return; }
      const ids = Array.from(checked).map(cb=>parseInt(cb.value));
      if(confirm(`确定删除选中的 ${ids.length} 条记录吗？此操作不可撤销。`)){
        showLoading(true);
        await deleteDeposits(ids);
        await refreshData();
        showLoading(false);
        showToast(`🗑️ 已删除 ${ids.length} 条记录`);
      }
    });
  }
  document.querySelectorAll('.deposit-check').forEach(cb=>{
    cb.addEventListener('change',updateSelectedStats);
  });
}

function updateSelectedStats(){
  const checked = document.querySelectorAll('.deposit-check:checked');
  const selectedIds = Array.from(checked).map(cb=>parseInt(cb.value));
  const selected = allDeposits.filter(d=>selectedIds.includes(d.id));
  const totalAmount = selected.reduce((s,d)=>s + d.amount,0);
  const totalCurr = selected.reduce((s,d)=>s + (d.currentInterest || 0),0);
  const totalMat = selected.reduce((s,d)=>s + (d.totalInterest || 0),0);
  const span = document.getElementById('selectedStats');
  if(span){
    if(selected.length){
      span.innerHTML = `<span class="status-badge success">✅ 已选 ${selected.length} 条 · 本息 ¥${fmt(totalAmount + totalCurr)}</span>`;
      span.title = `本金 ¥${totalAmount.toFixed(2)}\n当前本息 ¥${(totalAmount + totalCurr).toFixed(2)}\n到期本息 ¥${(totalAmount + totalMat).toFixed(2)}`;
    }else{
      span.innerHTML = '';
      span.title = '';
    }
  }
}

function updateBatchButtons(){
  const hasAny = allDeposits.length > 0;
  const selectAll = document.getElementById('selectAllCheckbox');
  const batchDelete = document.getElementById('batchDeleteBtn');
  if(selectAll) selectAll.disabled = !hasAny;
  if(batchDelete) batchDelete.disabled = !hasAny;
}

/* ================================================================
   模态框：存款编辑
================================================================ */
function parseTermValue(termVal){
  if(termVal === '0' || termVal === 'custom') return null;
  const match = String(termVal).match(/^(\d+)([dmy])$/);
  if(!match) return null;
  return {num:parseInt(match[1]),unit:match[2]};
}

function addTermToDate(baseDate,num,unit){
  const d = new Date(baseDate);
  if(unit === 'd') d.setDate(d.getDate() + num);
  else if(unit === 'm') d.setMonth(d.getMonth() + num);
  else if(unit === 'y') d.setFullYear(d.getFullYear() + num);
  return d;
}

async function showDepositModal(deposit=null){

      <label>🏦 银行 / 平台</label>

      <label>📂 存款类型</label>

      <datalist id="typeList">${PRESET_DEPOSIT_TYPES.map(t=>`<option value="${escapeHtml(t)}">`).join('')}</datalist>

      <label>💰 金额 (元)</label>
      <input id="modalAmount" type="number" step="0.01" min="0.01" inputmode="decimal" value="${deposit?.amount ?? ''}" placeholder="0.00">

      <label>📅 起始日期</label>
      <input type="date" id="modalStart" value="${deposit?.startDate || ''}">

      <div style="display:flex;gap:10px;align-items:flex-end;">
        <div style="flex:1.1;">
          <label>📆 存期</label>
          <select id="modalTermYear">
            <option value="0">不自动计算</option>
            <option value="1d">1天</option>
            <option value="7d">7天</option>
            <option value="14d">14天</option>
            <option value="1m">1个月</option>
            <option value="3m">3个月</option>
            <option value="6m">6个月</option>
            <option value="9m">9个月</option>
            <option value="1y">1年</option>
            <option value="2y">2年</option>
            <option value="3y">3年</option>
            <option value="5y">5年</option>
            <option value="custom">自定义期限</option>
          </select>
        </div>
        <div style="flex:1.6;">
          <label>📆 到期日期</label>
          <input type="date" id="modalMaturity" value="${deposit?.maturityDate || ''}">
        </div>
      </div>

      <div id="customTermGroup" style="display:none;margin-top:2px;">
        <div style="display:flex;gap:8px;align-items:center;">
          <input type="number" id="customTermValue" placeholder="数值" min="1" style="width:100px;margin:5px 0 10px;">
          <select id="customTermUnit" style="width:90px;margin:5px 0 10px;">
            <option value="d">天</option>
            <option value="m">月</option>
            <option value="y">年</option>
          </select>
          <button type="button" id="applyCustomTermBtn" class="small">应用</button>
        </div>
      </div>

      <label>📊 年利率 (%)</label>
      <input id="modalRate" type="number" step="0.0001" min="0" inputmode="decimal" value="${deposit?.rate ?? ''}" placeholder="如 3.25">

      <label>🔄 计息类型</label>
      <select id="modalInterestType">
        <option value="simple" ${deposit?.interestType === 'simple' ? 'selected' : ''}>单利（常见定期）</option>
        <option value="compound" ${deposit?.interestType === 'compound' ? 'selected' : ''}>复利（每日复利）</option>
      </select>

      <label>📝 备注</label>
      <textarea id="modalNotes" rows="2" placeholder="选填">${deposit?.notes || ''}</textarea>

      ${deposit ? `<button id="rateHistoryBtn" class="small ghost" style="margin-top:8px;width:100%;">📜 管理利率历史</button>` : ''}

      <div class="grid-2" style="margin-top:16px;">
        <button id="modalSave" class="success">💾 保存</button>
        <button id="modalCancel" class="secondary">取消</button>
      </div>
    </div>`;

  document.body.appendChild(modalDiv);
  const closeModal = ()=>modalDiv.remove();

  if(deposit){
    modalDiv.querySelector('#rateHistoryBtn').onclick = ()=>{
      closeModal();
      showRateHistoryModal(deposit.id);
    };
  }

  const startInput = modalDiv.querySelector('#modalStart');
  const termSelect = modalDiv.querySelector('#modalTermYear');
  const maturityInput = modalDiv.querySelector('#modalMaturity');
  const customGroup = modalDiv.querySelector('#customTermGroup');
  const customValue = modalDiv.querySelector('#customTermValue');
  const customUnit = modalDiv.querySelector('#customTermUnit');
  const applyCustomBtn = modalDiv.querySelector('#applyCustomTermBtn');

  function setMaturityFromTerm(termStr){
    const startVal = startInput.value;
    if(!startVal || termStr === '0' || termStr === 'custom') return;
    const startDate = new Date(startVal);
    if(isNaN(startDate.getTime())) return;
    const parsed = parseTermValue(termStr);
    if(!parsed) return;
    const newDate = addTermToDate(startDate,parsed.num,parsed.unit);
    maturityInput.value = formatDate(newDate);
  }

  termSelect.addEventListener('change',()=>{
    const val = termSelect.value;
    if(val === 'custom'){
      customGroup.style.display = 'block';
      maturityInput.value = '';
    }else{
      customGroup.style.display = 'none';
      setMaturityFromTerm(val);
    }
  });

  startInput.addEventListener('change',()=>{
    if(termSelect.value !== 'custom') setMaturityFromTerm(termSelect.value);
  });

  applyCustomBtn.addEventListener('click',()=>{
    const valNum = parseInt(customValue.value);
    if(!valNum || valNum < 1){ alert('请输入有效的期限数值'); return; }
    const unit = customUnit.value;
    const startVal = startInput.value;
    if(!startVal){ alert('请先选择起始日期'); return; }
    const startDate = new Date(startVal);
    if(isNaN(startDate.getTime())){ alert('起始日期无效'); return; }
    const newDate = addTermToDate(startDate,valNum,unit);
    maturityInput.value = formatDate(newDate);
  });

  // 反推存期（编辑时）
  if(deposit && deposit.startDate && deposit.maturityDate){
    const start = new Date(deposit.startDate);
    const end = new Date(deposit.maturityDate);
    if(!isNaN(start.getTime()) && !isNaN(end.getTime())){
      const diffDays = Math.round((end - start) / (1000 * 3600 * 24));
      const presets = [
        {v:'1d',d:1},{v:'7d',d:7},{v:'14d',d:14},
        {v:'1m',d:30},{v:'3m',d:91},{v:'6m',d:182},{v:'9m',d:273},
        {v:'1y',d:365},{v:'2y',d:730},{v:'3y',d:1095},{v:'5y',d:1825}
      ];
      let matched = false;
      for(let p of presets){
        if(Math.abs(diffDays - p.d) <= 3){
          termSelect.value = p.v;
          matched = true;
          break;
        }
      }
      if(!matched) termSelect.value = 'custom';
    }
  }
  if(termSelect.value === 'custom') customGroup.style.display = 'block';

  let saving = false;
  modalDiv.querySelector('#modalSave').onclick = async ()=>{
    if(saving) return;
    saving = true;
    const saveBtn = modalDiv.querySelector('#modalSave');
    saveBtn.disabled = true;
    saveBtn.textContent = '保存中...';
    try{
      const amountVal = parseFloat(modalDiv.querySelector('#modalAmount').value);
      const rateRaw = modalDiv.querySelector('#modalRate').value;
      const newDeposit = {
        user:modalDiv.querySelector('#modalUser').value,
        bank:modalDiv.querySelector('#modalBank').value.trim(),
        depositType:modalDiv.querySelector('#modalType').value.trim(),
        amount:amountVal,
        startDate:modalDiv.querySelector('#modalStart').value.trim() || null,
        maturityDate:modalDiv.querySelector('#modalMaturity').value.trim() || null,
        rate:(rateRaw !== '' && !isNaN(parseFloat(rateRaw))) ? parseFloat(rateRaw) : null,
        interestType:modalDiv.querySelector('#modalInterestType').value,
        notes:modalDiv.querySelector('#modalNotes').value.trim(),
        is_unlocked:deposit?.is_unlocked || 0
      };
      if(!newDeposit.bank){
        throw new Error('请填写银行/平台');
      }
      if(!newDeposit.depositType){
        throw new Error('请填写存款类型');
      }
      if(isNaN(newDeposit.amount) || newDeposit.amount <= 0){
        throw new Error('请填写有效金额');
      }
      if(newDeposit.startDate && newDeposit.maturityDate && newDeposit.maturityDate < newDeposit.startDate){
        throw new Error('到期日期不能早于起始日期');
      }
      if(deposit){
        newDeposit.id = deposit.id;
        await saveDeposit(newDeposit);
        showToast('✅ 存款已更新');
      }else{
        await saveDeposit(newDeposit);
        showToast('✅ 存款已添加');
      }
      closeModal();
      await refreshData();
    }catch(err){
      alert('保存失败：' + err.message);
    }finally{
      saving = false;
      if(document.body.contains(saveBtn)){
        saveBtn.disabled = false;
        saveBtn.textContent = '💾 保存';
      }
    }
  };

  modalDiv.querySelector('#modalCancel').onclick = closeModal;
  modalDiv.addEventListener('click',e=>{
    if(e.target === modalDiv) closeModal();
  });
}

          await showManageUsersModal();
          showToast('✅ 用户已重命名');
        }else{
          alert('重命名失败，可能新用户名已存在');
        }
      }
    });
  });

  modalDiv.querySelectorAll('.delete-user-btn').forEach(btn=>{
    btn.addEventListener('click',async ()=>{
      const userName = btn.dataset.user;
      const st = stats[userName] || {count:0};
      const warnMsg = st.count > 0
        ? `确定删除用户「${userName}」吗？\n该用户下 ${st.count} 笔存款也会一并删除！此操作不可撤销。`
        : `确定删除用户「${userName}」吗？`;
      if(!confirm(warnMsg)) return;
      const deposits = await getDeposits(userName);
      showLoading(true);
      for(let d of deposits) await deleteDeposit(d.id);
      const success = await deleteUser(userName);
      showLoading(false);
      if(success){
        if(currentUser === userName){
          const newUsers = await getUsers();
          currentUser = newUsers[0] || null;
        }
        await refreshUserSelector();
        await refreshData();
        closeModal();
        await showManageUsersModal();
        showToast(`✅ 用户「${userName}」已删除`);
      }else{
        alert(`无法删除用户「${userName}」`);
      }
    });
  });

  modalDiv.querySelector('#closeManageModal').onclick = closeModal;
  modalDiv.addEventListener('click',e=>{
    if(e.target === modalDiv) closeModal();
  });
}

/* ================================================================

================================================================ */
function enableDoubleClickZoom(chartInstance){
  if(!chartInstance) return;
  chartInstance.getDom().ondblclick = ()=>{
    const modalBig = document.createElement('div');
    modalBig.className = 'modal';
    modalBig.style.zIndex = '3000';
    const container = document.createElement('div');
    container.style.cssText = 'width:94vw;height:82vh;background:var(--card-solid);border-radius:20px;padding:16px;display:flex;flex-direction:column;';
    const chartDom = document.createElement('div');
    chartDom.style.cssText = 'width:100%;height:calc(100% - 54px);';
    container.appendChild(chartDom);
    const closeBtn = document.createElement('button');
    closeBtn.innerText = '关闭';
    closeBtn.className = 'small secondary';
    closeBtn.style.cssText = 'margin-top:14px;align-self:center;';
    container.appendChild(closeBtn);
    modalBig.appendChild(container);
    document.body.appendChild(modalBig);

    const newChart = echarts.init(chartDom);
    newChart.setOption(chartInstance.getOption());
    closeBtn.onclick = ()=>{ newChart.dispose(); modalBig.remove(); };
    modalBig.addEventListener('click',e=>{
      if(e.target === modalBig){ newChart.dispose(); modalBig.remove(); }
    });
    const resizeHandler = ()=>newChart.resize();
    window.addEventListener('resize',resizeHandler);
    setTimeout(()=>newChart.resize(),80);
  };
}

/* ================================================================
   到期提醒
================================================================ */
async function getUpcomingMaturities(user,days=7){
  const deposits = await getDeposits(user);
  const today = todayStart();
  const future = new Date(today);
  future.setDate(today.getDate() + days);
  return deposits.filter(d=>{
    if(!d.maturityDate) return false;
    const mat = parseDate(d.maturityDate);
    if(!mat) return false;
    const m = new Date(mat);
    m.setHours(0,0,0,0);
    return m >= today && m <= future;
  });
}

/* ================================================================
   到期预测
================================================================ */
async function getMonthlyMaturityForecast(user){
  const deposits = await getDeposits(user);
  const today = todayStart();
  const endDate = new Date(today);
  endDate.setDate(today.getDate() + 365);
  const monthly = {};
  for(let d of deposits){
    if(!d.maturityDate) continue;
    const mat = parseDate(d.maturityDate);
    if(!mat || mat < today || mat > endDate) continue;
    const total = Number(d.amount) + await calculateTotalInterest(d);
    const key = `${mat.getFullYear()}-${String(mat.getMonth()+1).padStart(2,'0')}`;
    monthly[key] = (monthly[key] || 0) + total;
  }
  return monthly;
}

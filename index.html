<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>存款管家 · 旗舰版</title>
    <style>
        :root {
            --bg: #f0f4f8; --card-bg: #ffffff; --text: #1a202c; --text-secondary: #5a6c7d;
            --primary: #4f6ef7; --primary-hover: #3b54db; --success: #10b981; --warning: #f59e0b;
            --danger: #ef4444; --info: #6366f1; --border: #e2e8f0;
            --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-lg: 0 10px 25px rgba(0,0,0,0.08), 0 4px 10px rgba(0,0,0,0.04);
            --radius: 16px; --radius-sm: 10px; --radius-xs: 8px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace;
            --duplicate-bg: #fffdf5; --duplicate-border: #fbbf24;
            --expired-bg: #fef2f2; --expired-border: #fca5a5;
            --soon-bg: #fffbeb; --soon-border: #fcd34d;
            --safe-bg: #f0fdf4; --safe-border: #86efac;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg); color: var(--text); padding: 12px; padding-bottom: 100px; line-height: 1.5;
            -webkit-font-smoothing: antialiased; min-height: 100vh;
            background-image: radial-gradient(ellipse at 0% 0%, #e8ecf8 0%, transparent 60%),
                            radial-gradient(ellipse at 100% 100%, #e8f4f0 0%, transparent 60%);
            background-attachment: fixed;
        }
        .app-container { max-width: 800px; margin: 0 auto; }
        .card { background: var(--card-bg); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); border: 1px solid var(--border); transition: var(--transition); }
        .card:hover { box-shadow: var(--shadow-lg); }
        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
        .app-title { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        button, .btn-like {
            display: inline-flex; align-items: center; justify-content: center; gap: 5px;
            background: var(--primary); border: none; color: #fff; padding: 9px 16px; border-radius: 24px;
            font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: var(--transition);
            white-space: nowrap; letter-spacing: 0.01em; user-select: none;
        }
        button:active { transform: scale(0.96); }
        button:hover { background: var(--primary-hover); box-shadow: 0 4px 12px rgba(79,110,247,0.35); }
        button.secondary { background: #64748b; } button.secondary:hover { background: #475569; }
        button.danger { background: var(--danger); } button.danger:hover { background: #dc2626; }
        button.warning { background: var(--warning); color: #1a202c; } button.warning:hover { background: #e5a000; }
        button.success { background: var(--success); } button.success:hover { background: #059669; }
        button.small { padding: 6px 13px; font-size: 0.78rem; border-radius: 20px; }
        button.ghost { background: transparent; color: var(--primary); border: 1.5px solid var(--primary); }
        button.ghost:hover { background: #4f6ef710; box-shadow: none; }
        input, select, textarea {
            width: 100%; padding: 10px 14px; margin: 5px 0 10px; border: 1.5px solid var(--border);
            border-radius: var(--radius-xs); font-size: 0.9rem; font-family: inherit; background: #fafbfc;
            transition: var(--transition); color: var(--text);
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,110,247,0.1); background: #fff; }
        .status-bar { background: #f8fafc; padding: 10px 14px; border-radius: 24px; font-size: 0.78rem; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; border: 1px solid var(--border); font-weight: 500; }
        .summary-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 12px; }
        .summary-card { background: var(--card-bg); border-radius: var(--radius-sm); padding: 12px 14px; border: 1px solid var(--border); text-align: center; }
        .summary-card .sc-value { font-size: 1.3rem; font-weight: 700; font-family: var(--font-mono); }
        .summary-card .sc-label { font-size: 0.7rem; color: var(--text-secondary); font-weight: 500; margin-top: 2px; }
        .deposit-list-container { display: flex; flex-direction: column; gap: 8px; }
        .deposit-item { background: var(--card-bg); border-radius: var(--radius-sm); padding: 14px 16px; display: flex; align-items: flex-start; gap: 12px; border: 1.5px solid var(--border); transition: var(--transition); }
        .deposit-item.duplicate { background: var(--duplicate-bg); border-left: 4px solid var(--duplicate-border); }
        .deposit-item.expired { background: var(--expired-bg); border-left: 4px solid var(--expired-border); }
        .deposit-item.soon { background: var(--soon-bg); border-left: 4px solid var(--soon-border); }
        .deposit-item.safe { border-left: 4px solid var(--safe-border); }
        .deposit-checkbox { flex-shrink: 0; padding-top: 3px; }
        .deposit-checkbox input { width: 20px; height: 20px; cursor: pointer; accent-color: var(--primary); }
        .deposit-info { flex: 1; min-width: 0; }
        .deposit-info .bank-name { font-weight: 700; font-size: 0.95rem; }
        .deposit-info .amount-display { font-weight: 700; font-size: 1.15rem; color: #059669; font-family: var(--font-mono); }
        .interest-row { color: #e67e22; font-size: 0.8rem; font-weight: 500; }
        .date-row { font-size: 0.78rem; color: var(--text-secondary); }
        .deposit-actions { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; align-items: flex-start; }
        .deposit-notes { font-size: 0.73rem; color: #6b7280; background: #f9fafb; padding: 3px 8px; border-radius: 6px; display: inline-block; margin-top: 2px; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.55); display: flex; justify-content: center; align-items: center; z-index: 1000; animation: fadeIn 0.2s ease; backdrop-filter: blur(2px); }
        .modal-content { background: var(--card-bg); width: 92%; max-width: 520px; max-height: 88%; border-radius: 20px; padding: 22px; overflow-y: auto; box-shadow: 0 25px 50px rgba(0,0,0,0.2); animation: slideUp 0.25s ease; }
        .modal-content h3 { font-size: 1.2rem; font-weight: 700; margin-bottom: 14px; text-align: center; }
        .modal-content label { font-weight: 600; font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; display: block; margin-top: 4px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .toast-msg { position: fixed; bottom: 28px; left: 16px; right: 16px; background: rgba(15,23,42,0.9); color: #fff; text-align: center; padding: 12px 20px; border-radius: 28px; z-index: 2000; font-size: 0.82rem; font-weight: 500; transition: opacity 0.35s ease; pointer-events: none; backdrop-filter: blur(8px); }
        .filter-toggle-btn { display: none; background: #f1f5f9; color: #475569; border: 1.5px solid var(--border); padding: 8px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; cursor: pointer; width: 100%; text-align: center; margin-bottom: 8px; }
        .filter-panel { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin-bottom: 10px; transition: max-height 0.35s ease, opacity 0.3s ease; overflow: hidden; }
        .filter-panel.collapsed { max-height: 0 !important; opacity: 0; margin-bottom: 0; pointer-events: none; }
        .filter-group { display: flex; flex-direction: column; gap: 2px; font-size: 0.7rem; font-weight: 600; color: #475569; min-width: 100px; }
        .filter-group input, .filter-group select { width: auto; min-width: 100px; margin: 0; padding: 7px 10px; font-size: 0.8rem; border-radius: 8px; }
        .chart-card { background: #fff; border-radius: 14px; padding: 10px; margin-bottom: 10px; border: 1px solid var(--border); }
        @media (max-width: 640px) {
            body { padding: 8px; }
            .card { padding: 12px; border-radius: 14px; }
            .deposit-item { flex-direction: column; align-items: stretch; gap: 8px; padding: 12px; }
            .deposit-actions { justify-content: flex-end; }
            .filter-toggle-btn { display: block; }
            .filter-panel { max-height: 2000px; }
            .filter-panel.collapsed { max-height: 0 !important; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
<div id="app" class="app-container">
    <div class="card">
        <div class="header">
            <div class="app-title"><span>💰</span>存款管家 · 旗舰版</div>
            <div class="flex-row">
                <select id="userSelect" style="width:auto;min-width:120px;margin:0;padding:8px 12px;border-radius:20px;font-weight:600;font-size:0.82rem;background:#f8fafc;"></select>
                <button id="addUserBtn" class="small ghost">➕</button>
                <button id="manageUserBtn" class="small secondary">📋</button>
                <button id="statsBtn" class="small">📊</button>
                <button id="remindBtn" class="small warning">⏰</button>
                <button id="forecastBtn" class="small warning">📈</button>
                <button id="fixDataBtn" class="small ghost">🔧</button>
            </div>
        </div>
        <div class="status-bar" id="statusBar">
            <span id="statsText" style="font-weight:600;"></span>
            <span id="duplicateWarning"></span>
            <span id="selectedStats"></span>
        </div>
        <div class="summary-cards" id="summaryCards">
            <div class="summary-card principal"><div class="sc-value" id="scPrincipal">¥0</div><div class="sc-label">💰 本金总额</div></div>
            <div class="summary-card interest"><div class="sc-value" id="scCurrInterest">¥0</div><div class="sc-label">💹 当前利息</div></div>
            <div class="summary-card interest"><div class="sc-value" id="scMatInterest">¥0</div><div class="sc-label">📅 到期利息</div></div>
            <div class="summary-card count"><div class="sc-value" id="scCount">0</div><div class="sc-label">📋 存款笔数</div></div>
        </div>
        <button class="filter-toggle-btn" id="filterToggleBtn">🔍 展开筛选条件</button>
        <div class="filter-panel" id="filterPanel">
            <div class="filter-group"><span>🏦 银行</span><select id="filterBank"><option value="">所有银行</option></select></div>
            <div class="filter-group"><span>📂 类型</span><select id="filterType"><option value="">所有类型</option></select></div>
            <div class="filter-group"><span>👤 持有人</span><select id="filterHolder"><option value="">所有持有人</option></select></div>
            <div class="filter-group"><span>💰 金额范围</span><div style="display:flex;gap:5px;"><input type="number" id="minAmount" placeholder="最小" style="width:80px;"><input type="number" id="maxAmount" placeholder="最大" style="width:80px;"></div></div>
            <div class="filter-group"><span>📅 存入日期</span>
                <div class="date-range"><input type="date" id="startDateFrom"><span>至</span><input type="date" id="startDateTo"></div>
                <select id="startYearQuick" style="width:80px;margin-top:2px;"><option value="">年份</option></select>
            </div>
            <div class="filter-group"><span>⏳ 到期日期</span>
                <div class="date-range"><input type="date" id="maturityDateFrom"><span>至</span><input type="date" id="maturityDateTo"></div>
                <select id="maturityYearQuick" style="width:80px;margin-top:2px;"><option value="">年份</option></select>
            </div>
            <button id="clearFiltersBtn" class="small secondary" style="align-self:flex-end;">🗑️ 清除筛选</button>
        </div>
        <div class="search-bar"><input type="text" id="searchInput" placeholder="🔍 搜索银行/类型/备注..."></div>
        <div class="sort-row" style="display:flex;gap:6px;align-items:center;font-size:0.75rem;margin-bottom:10px;">
            <span>↕️ 排序：</span>
            <select id="sortSelect" style="width:auto;min-width:110px;margin:0;padding:6px 10px;font-size:0.78rem;border-radius:16px;">
                <option value="maturityDate-asc">到期日期 ↑</option><option value="maturityDate-desc">到期日期 ↓</option>
                <option value="amount-desc">金额 ↓</option><option value="amount-asc">金额 ↑</option>
                <option value="startDate-desc">存入日期 ↓</option><option value="startDate-asc">存入日期 ↑</option>
                <option value="rate-desc">利率 ↓</option><option value="rate-asc">利率 ↑</option>
                <option value="bank-asc">银行 A-Z</option>
            </select>
        </div>
        <div class="flex-between" style="margin-bottom:10px;">
            <div class="flex-row">
                <button id="addDepositBtn">➕ 新增存款</button>
                <button id="backupCsvBtn" class="secondary">💾 备份CSV</button>
                <button id="backupJsonBtn" class="secondary">💾 备份JSON</button>
                <button id="openBackupFolderBtn" class="secondary" style="background:#6366f1;">📂 备份文件夹</button>
                <label id="restoreLabel" class="btn-like secondary" style="display:inline-flex;background:#334155;cursor:pointer;">📂 恢复CSV<input type="file" id="restoreFileInput" accept=".csv,text/csv" style="display:none;"></label>
                <label id="restoreJsonLabel" class="btn-like secondary" style="display:inline-flex;background:#334155;cursor:pointer;">📂 恢复JSON<input type="file" id="restoreJsonInput" accept=".json" style="display:none;"></label>
                <button id="pdfBtn" class="small" style="background:#e67e22;">📄 导出PDF</button>
            </div>
            <div class="batch-bar">
                <label style="display:flex;align-items:center;gap:5px;font-size:0.78rem;font-weight:600;cursor:pointer;"><input type="checkbox" id="selectAllCheckbox">全选</label>
                <button id="batchDeleteBtn" class="small danger">🗑️ 删除选中</button>
            </div>
        </div>
    </div>
    <div id="depositListContainer" class="deposit-list-container"></div>
</div>

<script src="cordova.js"></script>
<script>
(function() {
    // ======================== 预设数据 ========================
    const PRESET_BANKS = ["中国工商银行","中国建设银行","中国农业银行","中国银行","交通银行","重庆银行","重庆农村商业银行","微众银行","蓝海银行","邮储银行","招商银行","浦发银行","中信银行","其他银行","微信理财","支付宝理财","股票基金"];
    const PRESET_DEPOSIT_TYPES = ["活期","一年期定期","三年期定期","五年期定期","大额存单","结构性存款","通知存款","理财产品","货币基金","股票基金","其他","现金管理类理财","固收类理财","权益类理财","混合类理财","结构性存款(保本)","结构性存款(非保本)","大额存单(可转让)","大额存单(不可转让)","智能存款","七日通知存款","一个月定期","三个月定期","六个月定期"];

    // ======================== IndexedDB ========================
    const DB_NAME = 'DepositDB', DB_VERSION = 4;
    let db = null;

    function openDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, DB_VERSION);
            request.onerror = () => reject(request.error);
            request.onsuccess = () => {
                db = request.result;
                resolve(db);
            };
            request.onupgradeneeded = (e) => {
                const database = e.target.result;
                if (!database.objectStoreNames.contains('users')) {
                    database.createObjectStore('users', { keyPath: 'name' });
                }
                if (!database.objectStoreNames.contains('deposits')) {
                    const store = database.createObjectStore('deposits', { keyPath: 'id', autoIncrement: true });
                    store.createIndex('user', 'user', { unique: false });
                }
                if (!database.objectStoreNames.contains('rate_history')) {
                    const store = database.createObjectStore('rate_history', { keyPath: 'id', autoIncrement: true });
                    store.createIndex('deposit_id', 'deposit_id', { unique: false });
                }
            };
        });
    }

    async function getStore(storeName, mode = 'readonly') {
        if (!db) await openDB();
        return db.transaction(storeName, mode).objectStore(storeName);
    }

    // ---------- 用户操作 ----------
    async function getUsers() {
        const store = await getStore('users');
        const all = await new Promise(resolve => {
            const req = store.getAll();
            req.onsuccess = () => resolve(req.result);
        });
        return all.map(u => u.name);
    }

    async function addUser(name) {
        if (!name) return false;
        const users = await getUsers();
        if (users.includes(name)) return false;
        const store = await getStore('users', 'readwrite');
        await store.add({ name });
        return true;
    }

    async function deleteUser(name) {
        const users = await getUsers();
        if (!users.includes(name)) return false;
        const deposits = await getDeposits(name);
        if (deposits.length > 0) {
            alert(`用户 ${name} 有 ${deposits.length} 笔存款，请先删除存款再删除用户。`);
            return false;
        }
        const store = await getStore('users', 'readwrite');
        await store.delete(name);
        return true;
    }

    async function renameUser(oldName, newName) {
        if (!newName || newName === oldName) return false;
        const users = await getUsers();
        if (users.includes(newName)) return false;
        const userStore = await getStore('users', 'readwrite');
        await userStore.delete(oldName);
        await userStore.add({ name: newName });
        const depStore = await getStore('deposits', 'readwrite');
        const all = await new Promise(resolve => {
            const req = depStore.getAll();
            req.onsuccess = () => resolve(req.result);
        });
        for (let d of all) {
            if (d.user === oldName) {
                d.user = newName;
                await depStore.put(d);
            }
        }
        return true;
    }

    // ---------- 存款操作 ----------
    async function getDeposits(user) {
        if (!user) return await getAllDeposits();
        const store = await getStore('deposits');
        const index = store.index('user');
        const items = await new Promise(resolve => {
            const req = index.getAll(user);
            req.onsuccess = () => resolve(req.result);
        });
        return items.map(d => ({ ...d, id: d.id }));
    }

    async function getAllDeposits() {
        const store = await getStore('deposits');
        const all = await new Promise(resolve => {
            const req = store.getAll();
            req.onsuccess = () => resolve(req.result);
        });
        return all.map(d => ({ ...d, id: d.id }));
    }

    async function saveDeposit(deposit) {
        const store = await getStore('deposits', 'readwrite');
        let isNew = !deposit.id;
        let savedId;
        if (deposit.id) {
            await store.put(deposit);
            savedId = deposit.id;
        } else {
            delete deposit.id;
            savedId = await new Promise(resolve => {
                const req = store.add(deposit);
                req.onsuccess = () => resolve(req.result);
            });
            deposit.id = savedId;
        }
        if (isNew && deposit.startDate && deposit.rate != null && !isNaN(deposit.rate)) {
            const rateStore = await getStore('rate_history', 'readwrite');
            await rateStore.add({
                deposit_id: savedId,
                effective_date: deposit.startDate,
                interest_rate: deposit.rate
            });
        }
        return savedId;
    }

    async function deleteDeposit(id) {
        const store = await getStore('deposits', 'readwrite');
        await store.delete(id);
        const rateStore = await getStore('rate_history', 'readwrite');
        const idx = rateStore.index('deposit_id');
        const rates = await new Promise(resolve => {
            const req = idx.getAll(id);
            req.onsuccess = () => resolve(req.result);
        });
        for (let r of rates) await rateStore.delete(r.id);
    }

    async function deleteDeposits(ids) {
        for (let id of ids) await deleteDeposit(id);
    }

    async function unlockDeposit(id) {
        const store = await getStore('deposits', 'readwrite');
        const dep = await new Promise(resolve => {
            const req = store.get(id);
            req.onsuccess = () => resolve(req.result);
        });
        if (dep) {
            dep.is_unlocked = 1;
            await store.put(dep);
        }
    }

    // ---------- 利率历史 ----------
    async function getRateHistory(depositId) {
        const store = await getStore('rate_history');
        const idx = store.index('deposit_id');
        const items = await new Promise(resolve => {
            const req = idx.getAll(depositId);
            req.onsuccess = () => resolve(req.result);
        });
        return items.sort((a, b) => new Date(a.effective_date) - new Date(b.effective_date));
    }

    async function addRateChange(depositId, effectiveDate, interestRate) {
        const store = await getStore('rate_history', 'readwrite');
        const existing = await getRateHistory(depositId);
        if (existing.some(r => r.effective_date === effectiveDate)) return false;
        await store.add({
            deposit_id: depositId,
            effective_date: effectiveDate,
            interest_rate: interestRate
        });
        return true;
    }

    async function deleteRateChange(rateId) {
        const store = await getStore('rate_history', 'readwrite');
        await store.delete(rateId);
    }

    // ---------- 日期工具 ----------
    function parseDate(dateStr) {
        if (!dateStr) return null;
        let d = new Date(dateStr);
        if (!isNaN(d.getTime())) return d;
        let parts = dateStr.split(/[-\/]/);
        if (parts.length === 3) {
            let year = parseInt(parts[0]), month = parseInt(parts[1]) - 1, day = parseInt(parts[2]);
            d = new Date(year, month, day);
            if (!isNaN(d.getTime())) return d;
        }
        if (/^\d{8}$/.test(dateStr)) {
            let year = parseInt(dateStr.slice(0, 4)), month = parseInt(dateStr.slice(4, 6)) - 1, day = parseInt(dateStr.slice(6, 8));
            d = new Date(year, month, day);
            if (!isNaN(d.getTime())) return d;
        }
        return null;
    }

    function formatDate(date) {
        if (!date) return null;
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }

    function todayStart() {
        const t = new Date();
        t.setHours(0, 0, 0, 0);
        return t;
    }

    // ---------- 利息计算 ----------
    async function calculateInterest(deposit, asOfDate = null) {
        const { startDate, maturityDate, amount, rate, interestType, id } = deposit;
        if (!startDate || amount <= 0 || rate == null || isNaN(rate)) return 0;
        const start = parseDate(startDate);
        if (!start) return 0;
        let asOf = asOfDate ? (typeof asOfDate === 'string' ? parseDate(asOfDate) : asOfDate) : new Date();
        if (!asOf || isNaN(asOf.getTime())) asOf = new Date();
        let end = maturityDate ? parseDate(maturityDate) : null;
        let actualEnd = end ? (asOf < end ? asOf : end) : asOf;
        if (actualEnd <= start) return 0;
        let periods = [];
        if (id) {
            const hist = await getRateHistory(id);
            if (hist.length > 0) {
                let prevDate = start;
                for (let h of hist) {
                    let eff = parseDate(h.effective_date);
                    if (eff && eff > start) {
                        if (prevDate < eff) {
                            periods.push({
                                start: prevDate,
                                end: eff < actualEnd ? eff : actualEnd,
                                rate: h.interest_rate
                            });
                        }
                        prevDate = eff;
                    }
                }
                if (prevDate < actualEnd) {
                    periods.push({
                        start: prevDate,
                        end: actualEnd,
                        rate: hist[hist.length - 1].interest_rate
                    });
                }
            } else {
                periods.push({ start, end: actualEnd, rate });
            }
        } else {
            periods.push({ start, end: actualEnd, rate });
        }
        let total = 0;
        for (let p of periods) {
            if (p.end <= p.start) continue;
            const days = (p.end - p.start) / (1000 * 3600 * 24);
            const dailyRate = p.rate / 100 / 365;
            if (interestType === 'compound') {
                total += amount * (Math.pow(1 + dailyRate, days) - 1);
            } else {
                total += dailyRate * amount * days;
            }
        }
        return Math.round(total * 100) / 100;
    }

    async function calculateTotalInterest(deposit) {
        if (!deposit.maturityDate) return 0;
        const mat = parseDate(deposit.maturityDate);
        if (!mat) return 0;
        return await calculateInterest(deposit, mat);
    }

    // 优化：并行计算利息
    async function enrichDeposits(deposits) {
        const enriched = await Promise.all(deposits.map(async d => {
            d.amount = Number(d.amount);
            if (isNaN(d.amount)) d.amount = 0;
            d.currentInterest = await calculateInterest(d);
            d.totalInterest = await calculateTotalInterest(d);
            d._matDate = d.maturityDate ? parseDate(d.maturityDate) : null;
            return d;
        }));
        return enriched;
    }

    function getMaturityStatus(dep) {
        if (!dep._matDate) return 'none';
        const now = todayStart();
        const mat = new Date(dep._matDate);
        mat.setHours(0, 0, 0, 0);
        const diffDays = Math.floor((mat - now) / (1000 * 3600 * 24));
        if (diffDays < 0) return 'expired';
        if (diffDays <= 7) return 'urgent';
        if (diffDays <= 30) return 'soon';
        return 'safe';
    }

    function escapeCSV(cell) {
        if (cell === undefined || cell === null) return '';
        const str = String(cell);
        if (str.includes(',') || str.includes('"') || str.includes('\n')) {
            return '"' + str.replace(/"/g, '""') + '"';
        }
        return str;
    }

    function generateCSVBlob(user, deposits) {
        const sorted = [...deposits].sort((a, b) => (a.maturityDate || '9999-12-31') > (b.maturityDate || '9999-12-31') ? 1 : -1);
        const rows = [];
        for (let i = 0; i < sorted.length; i++) {
            const d = sorted[i];
            rows.push([
                (i + 1).toString(),
                d.user,
                d.bank,
                d.depositType,
                d.amount.toFixed(2),
                d.startDate || '',
                d.maturityDate || '',
                d.rate != null ? d.rate.toFixed(2) : '',
                d.interestType === 'compound' ? 'compound' : 'simple',
                d.notes || '',
                d.is_unlocked ? '是' : '否'
            ]);
        }
        const csvLines = [
            ['序号', '用户', '银行', '存款名称', '金额(元)', '存入日期', '到期日期', '利率(%)', '计息类型', '备注', '解锁状态'],
            ...rows
        ];
        return "\uFEFF" + csvLines.map(row => row.map(escapeCSV).join(',')).join('\n');
    }

    function fallbackDownload(content, filename, mime = 'text/csv') {
        const blob = new Blob([content], { type: mime });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);
    }

    async function requestStoragePermission() {
        if (!window.cordova || !window.cordova.plugins?.permissions) return true;
        const permissions = window.cordova.plugins.permissions;
        return new Promise(resolve => {
            permissions.hasPermission(permissions.WRITE_EXTERNAL_STORAGE, status => {
                if (status.hasPermission) {
                    resolve(true);
                } else {
                    permissions.requestPermission(
                        permissions.WRITE_EXTERNAL_STORAGE,
                        result => resolve(result.hasPermission),
                        () => resolve(false)
                    );
                }
            }, () => resolve(false));
        });
    }

    async function exportWithCordova(content, filename, mime = 'text/csv') {
        if (!window.cordova || !window.cordova.file) {
            fallbackDownload(content, filename, mime);
            return false;
        }
        await requestStoragePermission();
        const externalRoot = window.cordova.file.externalRootDirectory;
        const backupDir = externalRoot + 'Download/存款管家备份/';
        const resolveLocalFileSystemURL = window.resolveLocalFileSystemURL;
        return new Promise(resolve => {
            resolveLocalFileSystemURL(backupDir, dirEntry => {
                writeFileToDir(dirEntry, filename, content, mime, resolve);
            }, () => {
                resolveLocalFileSystemURL(externalRoot + 'Download/', downloadDir => {
                    downloadDir.getDirectory('存款管家备份', { create: true }, newDir => {
                        writeFileToDir(newDir, filename, content, mime, resolve);
                    }, () => {
                        fallbackDownload(content, filename, mime);
                        resolve(false);
                    });
                }, () => {
                    fallbackDownload(content, filename, mime);
                    resolve(false);
                });
            });
        });
    }

    function writeFileToDir(dirEntry, filename, content, mime, callback) {
        dirEntry.getFile(filename, { create: true, exclusive: false }, fileEntry => {
            fileEntry.createWriter(writer => {
                writer.onwriteend = () => { callback(true); };
                writer.onerror = () => { callback(false); };
                const blob = new Blob([content], { type: mime });
                writer.write(blob);
            }, () => callback(false));
        }, () => callback(false));
    }

    // ---------- CSV 导入 ----------
    async function importFromCSV(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = async (e) => {
                let text = e.target.result;
                if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
                const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
                if (lines.length < 2) return reject(new Error('文件内容为空'));
                const parseCSVLine = (line) => {
                    const result = [];
                    let inQuote = false;
                    let current = '';
                    for (let i = 0; i < line.length; i++) {
                        const ch = line[i];
                        if (ch === '"') {
                            if (inQuote && line[i + 1] === '"') {
                                current += '"';
                                i++;
                            } else {
                                inQuote = !inQuote;
                            }
                        } else if (ch === ',' && !inQuote) {
                            result.push(current.trim());
                            current = '';
                        } else {
                            current += ch;
                        }
                    }
                    result.push(current.trim());
                    return result;
                };
                const headers = parseCSVLine(lines[0]);
                const findIdx = (keywords) => {
                    for (let kw of keywords) {
                        const idx = headers.findIndex(h => h.includes(kw));
                        if (idx !== -1) return idx;
                    }
                    return -1;
                };
                const colMap = {
                    userIdx: findIdx(['用户']),
                    bankIdx: findIdx(['银行']),
                    nameIdx: findIdx(['存款名称']),
                    amountIdx: findIdx(['金额(元)', '金额']),
                    startIdx: findIdx(['存入日期', '起始日期']),
                    maturityIdx: findIdx(['到期日期']),
                    rateIdx: findIdx(['利率(%)', '利率']),
                    intTypeIdx: findIdx(['计息类型']),
                    notesIdx: findIdx(['备注']),
                    unlockIdx: findIdx(['解锁状态'])
                };
                if (colMap.amountIdx === -1) return reject(new Error('未找到金额列'));
                const existingUsers = await getUsers();
                let added = 0;
                const affectedUsers = new Set();
                for (let i = 1; i < lines.length; i++) {
                    const fields = parseCSVLine(lines[i]);
                    if (fields.length < 8) continue;
                    let userName = fields[colMap.userIdx]?.trim();
                    if (!userName) continue;
                    affectedUsers.add(userName);
                    if (!existingUsers.includes(userName)) {
                        await addUser(userName);
                        existingUsers.push(userName);
                    }
                    const bank = fields[colMap.bankIdx]?.trim() || '';
                    const depositType = fields[colMap.nameIdx]?.trim() || '';
                    let amountRaw = fields[colMap.amountIdx]?.replace(/,/g, '').trim();
                    let amount = parseFloat(amountRaw);
                    if (isNaN(amount) || amount <= 0) continue;
                    let startDate = null;
                    if (colMap.startIdx >= 0) {
                        let d = parseDate(fields[colMap.startIdx]?.trim());
                        if (d) startDate = formatDate(d);
                    }
                    let maturityDate = null;
                    if (colMap.maturityIdx >= 0) {
                        let d = parseDate(fields[colMap.maturityIdx]?.trim());
                        if (d) maturityDate = formatDate(d);
                    }
                    let rate = null;
                    if (colMap.rateIdx >= 0) {
                        let r = parseFloat(fields[colMap.rateIdx]?.trim());
                        if (!isNaN(r)) rate = r;
                    }
                    let interestType = 'simple';
                    if (colMap.intTypeIdx >= 0) {
                        let raw = fields[colMap.intTypeIdx]?.trim().toLowerCase() || '';
                        interestType = (raw === 'compound' || raw === '复利') ? 'compound' : 'simple';
                    }
                    const notes = colMap.notesIdx >= 0 ? (fields[colMap.notesIdx]?.trim() || '') : '';
                    const isUnlocked = colMap.unlockIdx >= 0 && fields[colMap.unlockIdx]?.trim() === '是' ? 1 : 0;
                    await saveDeposit({
                        user: userName,
                        bank,
                        depositType,
                        amount,
                        startDate,
                        maturityDate,
                        rate,
                        interestType,
                        notes,
                        is_unlocked: isUnlocked
                    });
                    added++;
                }
                resolve({ added, users: Array.from(affectedUsers) });
            };
            reader.onerror = () => reject(reader.error);
            reader.readAsText(file, 'UTF-8');
        });
    }

    async function restoreJSON(file) {
        const text = await file.text();
        const data = JSON.parse(text);
        const tx = db.transaction(['users', 'deposits', 'rate_history'], 'readwrite');
        const userStore = tx.objectStore('users');
        const depStore = tx.objectStore('deposits');
        const rateStore = tx.objectStore('rate_history');
        await Promise.all([
            new Promise(r => { const req = userStore.clear(); req.onsuccess = r; req.onerror = r; }),
            new Promise(r => { const req = depStore.clear(); req.onsuccess = r; req.onerror = r; }),
            new Promise(r => { const req = rateStore.clear(); req.onsuccess = r; req.onerror = r; })
        ]);
        for (let u of data.users) userStore.add({ name: u });
        for (let d of data.deposits) depStore.add(d);
        for (let r of (data.rate_history || [])) rateStore.add(r);
        await new Promise(resolve => { tx.oncomplete = resolve; });
        await refreshData();
        alert('✅ JSON 恢复成功！');
    }

    // ---------- 修复重复数据 ----------
    async function fixDuplicateRecords() {
        const allDepositsData = await getAllDeposits();
        const groups = new Map();
        for (let d of allDepositsData) {
            const key = `${d.user}|${d.bank}|${d.depositType}|${d.amount}|${d.startDate}|${d.maturityDate}|${d.rate}|${d.interestType}|${d.notes}`;
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push(d);
        }
        const duplicates = Array.from(groups.values()).filter(list => list.length > 1);
        if (duplicates.length === 0) {
            alert("✅ 未发现完全重复的记录。");
            return;
        }
        let msg = `⚠️ 发现 ${duplicates.length} 组重复记录：\n\n`;
        for (let group of duplicates) {
            msg += `• ${group[0].bank} ${group[0].depositType} ¥${group[0].amount} — ID: ${group.map(d => d.id).join(', ')} (${group.length}条)\n`;
        }
        const choice = confirm(msg + "\n是否保留每组第一条，删除其余重复项？\n点击「确定」执行清理，「取消」仅查看。");
        if (choice) {
            let deleted = 0;
            for (let group of duplicates) {
                for (let i = 1; i < group.length; i++) {
                    await deleteDeposit(group[i].id);
                    deleted++;
                }
            }
            alert(`✅ 已删除 ${deleted} 条重复记录。`);
            await refreshData();
        }
    }

    function applySort() {
        const sortVal = document.getElementById('sortSelect')?.value || 'maturityDate-asc';
        const [field, dir] = sortVal.split('-');
        const multiplier = dir === 'desc' ? -1 : 1;
        allDeposits.sort((a, b) => {
            let va, vb;
            switch (field) {
                case 'maturityDate':
                    va = a.maturityDate || '9999-12-31';
                    vb = b.maturityDate || '9999-12-31';
                    break;
                case 'amount':
                    va = a.amount;
                    vb = b.amount;
                    break;
                case 'startDate':
                    va = a.startDate || '0000-01-01';
                    vb = b.startDate || '0000-01-01';
                    break;
                case 'rate':
                    va = a.rate ?? -1;
                    vb = b.rate ?? -1;
                    break;
                case 'bank':
                    va = a.bank || '';
                    vb = b.bank || '';
                    return multiplier * va.localeCompare(vb, 'zh-CN');
                default:
                    va = a.maturityDate || '9999-12-31';
                    vb = b.maturityDate || '9999-12-31';
            }
            if (va < vb) return -1 * multiplier;
            if (va > vb) return 1 * multiplier;
            return 0;
        });
    }

    function detectDuplicates() {
        const keyMap = new Map();
        duplicateIds.clear();
        for (let d of allDeposits) {
            const key = `${d.user}|${d.bank}|${d.depositType}|${d.amount}|${d.startDate}|${d.maturityDate}`;
            if (keyMap.has(key)) {
                duplicateIds.add(d.id);
                duplicateIds.add(keyMap.get(key));
            } else {
                keyMap.set(key, d.id);
            }
        }
    }

                    <button class="small danger deleteDepositBtn" data-id="${dep.id}">🗑️</button>
                    ${showUnlock ? `<button class="small warning unlockDepositBtn" data-id="${dep.id}">🔓 解锁</button>` : ''}
                </div></div>`;
        }).join('');
        bindDepositItemEvents();
        bindBatchEvents();
    }

    function bindDepositItemEvents() {
        document.querySelectorAll('.editDepositBtn').forEach(btn => {
            btn.addEventListener('click', () => {
                const id = parseInt(btn.dataset.id);
                const dep = allDeposits.find(d => d.id === id);
                if (dep) showDepositModal(dep);
            });
        });
        document.querySelectorAll('.deleteDepositBtn').forEach(btn => {
            btn.addEventListener('click', async () => {
                const id = parseInt(btn.dataset.id);
                if (confirm('确定删除这笔存款吗？')) {
                    await deleteDeposit(id);
                    await refreshData();
                    showToast('🗑️ 已删除');
                }
            });
        });
        document.querySelectorAll('.unlockDepositBtn').forEach(btn => {
            btn.addEventListener('click', async () => {
                await unlockDeposit(parseInt(btn.dataset.id));
                await refreshData();
                showToast('🔓 已解锁');
            });
        });
    }

    function bindBatchEvents() {
        const selectAll = document.getElementById('selectAllCheckbox');
        if (selectAll) {
            const newEl = selectAll.cloneNode(true);
            selectAll.parentNode.replaceChild(newEl, selectAll);
            newEl.addEventListener('change', e => {
                document.querySelectorAll('.deposit-check').forEach(cb => cb.checked = e.target.checked);
                updateSelectedStats();
            });
        }
        const batchDelete = document.getElementById('batchDeleteBtn');
        if (batchDelete) {
            const newEl = batchDelete.cloneNode(true);
            batchDelete.parentNode.replaceChild(newEl, batchDelete);
            newEl.addEventListener('click', async () => {
                const checked = document.querySelectorAll('.deposit-check:checked');
                if (!checked.length) return alert('请勾选存款记录');
                const ids = Array.from(checked).map(cb => parseInt(cb.value));
                if (confirm(`确定删除选中的 ${ids.length} 条记录吗？`)) {
                    await deleteDeposits(ids);
                    await refreshData();
                    showToast(`🗑️ 已删除 ${ids.length} 条`);
                }
            });
        }
        document.querySelectorAll('.deposit-check').forEach(cb => {
            cb.addEventListener('change', updateSelectedStats);
        });
    }

    function updateSelectedStats() {
        const checked = document.querySelectorAll('.deposit-check:checked');
        const selectedIds = Array.from(checked).map(cb => parseInt(cb.value));
        const selected = allDeposits.filter(d => selectedIds.includes(d.id));
        const totalAmount = selected.reduce((s, d) => s + d.amount, 0);
        const totalCurr = selected.reduce((s, d) => s + (d.currentInterest || 0), 0);
        const span = document.getElementById('selectedStats');
        if (span && selected.length) {
            span.innerHTML = `<span class="status-badge success">✅ 已选 ${selected.length} 条: ¥${totalAmount.toFixed(2)} | 利息 ¥${totalCurr.toFixed(2)}</span>`;
        } else if (span) {
            span.innerHTML = '';
        }
    }

    function updateBatchButtons() {
        const hasAny = allDeposits.length > 0;
        document.getElementById('selectAllCheckbox').disabled = !hasAny;
        document.getElementById('batchDeleteBtn').disabled = !hasAny;
    }

    async function refreshUserSelector() {
        const users = await getUsers();
        const select = document.getElementById('userSelect');
        if (!select) return;
        select.innerHTML = `<option value="__all__" ${currentUser === null ? 'selected' : ''}>📊 所有用户合计</option>` +

    // ========== 模态框：存款编辑（增强存期） ==========
    function parseTermValue(termVal) {
        if (termVal === '0' || termVal === 'custom') return null;
        const match = termVal.match(/^(\d+)([dmy])$/);
        if (!match) return null;
        return { num: parseInt(match[1]), unit: match[2] };
    }

    async function showDepositModal(deposit = null) {
        const users = await getUsers();
        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        modalDiv.innerHTML = `
        <div class="modal-content">
          <h3>${deposit ? '✏️ 编辑存款' : '➕ 新增存款'}</h3>
          <label>👤 持有人</label><select id="modalUser">${users.map(u => `<option value="${escapeHtml(u)}" ${deposit?.user === u ? 'selected' : ''}>${escapeHtml(u)}</option>`).join('')}</select>
          <label>🏦 银行</label><input list="bankList" id="modalBank" value="${escapeHtml(deposit?.bank || '')}" placeholder="选择或输入银行"><datalist id="bankList">${PRESET_BANKS.map(b => `<option value="${escapeHtml(b)}">`).join('')}</datalist>
          <label>📂 存款类型</label><input list="typeList" id="modalType" value="${escapeHtml(deposit?.depositType || '')}" placeholder="选择或输入类型"><datalist id="typeList">${PRESET_DEPOSIT_TYPES.map(t => `<option value="${escapeHtml(t)}">`).join('')}</datalist>

          <div style="display:flex;gap:10px;align-items:flex-end;">
            <div style="flex:1;"><label>📆 存期</label>
              <select id="modalTermYear">
                <option value="0">不自动计算</option>
                <option value="1d">1天</option><option value="7d">7天</option><option value="14d">14天</option>
                <option value="1m">1个月</option><option value="3m">3个月</option><option value="6m">6个月</option>
                <option value="9m">9个月</option><option value="1y">1年</option><option value="2y">2年</option>
                <option value="3y">3年</option><option value="5y">5年</option>
                <option value="custom">自定义期限</option>
              </select>
            </div>
            <div style="flex:2;"><label>📆 到期日期</label><input type="date" id="modalMaturity" value="${deposit?.maturityDate || ''}"></div>
          </div>
          <div id="customTermGroup" style="display:none; margin-top:6px;">
            <div style="display:flex; gap:8px; align-items:center;">
              <input type="number" id="customTermValue" placeholder="数值" min="1" style="width:100px;">
              <select id="customTermUnit"><option value="d">天</option><option value="m">月</option><option value="y">年</option></select>
              <button type="button" id="applyCustomTermBtn" class="small">应用</button>
            </div>
          </div>
          <label>📊 年利率 (%)</label><input id="modalRate" type="number" step="0.01" min="0" value="${deposit?.rate ?? ''}">
          <label>🔄 计息类型</label><select id="modalInterestType"><option value="simple" ${deposit?.interestType === 'simple' ? 'selected' : ''}>单利</option><option value="compound" ${deposit?.interestType === 'compound' ? 'selected' : ''}>复利</option></select>
          <label>📝 备注</label><textarea id="modalNotes" rows="2">${deposit?.notes || ''}</textarea>
          ${deposit ? `<button id="rateHistoryBtn" class="small ghost" style="margin-top:8px;width:100%;">📜 管理利率历史</button>` : ''}

        </div>`;
        document.body.appendChild(modalDiv);
        const closeModal = () => modalDiv.remove();
        if (deposit) {
            modalDiv.querySelector('#rateHistoryBtn').onclick = () => {
                closeModal();
                showRateHistoryModal(deposit.id);
            };
        }

        const startInput = modalDiv.querySelector('#modalStart');
        const termSelect = modalDiv.querySelector('#modalTermYear');
        const maturityInput = modalDiv.querySelector('#modalMaturity');
        const customGroup = modalDiv.querySelector('#customTermGroup');
        const customValue = modalDiv.querySelector('#customTermValue');
        const customUnit = modalDiv.querySelector('#customTermUnit');
        const applyCustomBtn = modalDiv.querySelector('#applyCustomTermBtn');

        function setMaturityFromTerm(termStr) {
            const startVal = startInput.value;
            if (!startVal || termStr === '0') return;
            const startDate = new Date(startVal);
            if (isNaN(startDate.getTime())) return;
            let newDate = new Date(startDate);
            if (termStr === 'custom') return;
            const parsed = parseTermValue(termStr);
            if (!parsed) return;
            const { num, unit } = parsed;
            if (unit === 'd') newDate.setDate(newDate.getDate() + num);
            else if (unit === 'm') newDate.setMonth(newDate.getMonth() + num);
            else if (unit === 'y') newDate.setFullYear(newDate.getFullYear() + num);
            maturityInput.value = formatDate(newDate);
        }

        termSelect.addEventListener('change', () => {
            const val = termSelect.value;
            if (val === 'custom') {
                customGroup.style.display = 'block';
                maturityInput.value = '';
            } else {
                customGroup.style.display = 'none';
                setMaturityFromTerm(val);
            }
        });
        startInput.addEventListener('change', () => {
            if (termSelect.value !== 'custom') setMaturityFromTerm(termSelect.value);
        });
        applyCustomBtn.addEventListener('click', () => {
            const valNum = parseInt(customValue.value);
            if (!valNum || valNum < 1) {
                alert('请输入有效数值');
                return;
            }
            const unit = customUnit.value;
            const termCode = `${valNum}${unit}`;
            setMaturityFromTerm(termCode);
        });

        if (deposit) {
            if (deposit.startDate && deposit.maturityDate) {
                const start = new Date(deposit.startDate);
                const end = new Date(deposit.maturityDate);
                if (!isNaN(start.getTime()) && !isNaN(end.getTime())) {
                    const diffDays = Math.round((end - start) / (1000 * 3600 * 24));
                    const presets = [{ v: '1d', d: 1 }, { v: '7d', d: 7 }, { v: '14d', d: 14 }, { v: '1m', d: 30 }, { v: '3m', d: 91 }, { v: '6m', d: 182 }, { v: '9m', d: 273 }, { v: '1y', d: 365 }, { v: '2y', d: 730 }, { v: '3y', d: 1095 }, { v: '5y', d: 1825 }];
                    let matched = false;
                    for (let p of presets) {
                        if (Math.abs(diffDays - p.d) <= 3) {
                            termSelect.value = p.v;
                            matched = true;
                            break;
                        }
                    }
                    if (!matched) termSelect.value = 'custom';
                }
            }
            if (termSelect.value === 'custom') customGroup.style.display = 'block';
        }

        let saving = false;
        modalDiv.querySelector('#modalSave').onclick = async () => {
            if (saving) return;
            saving = true;
            const saveBtn = modalDiv.querySelector('#modalSave');
            saveBtn.disabled = true;
            saveBtn.textContent = '保存中...';
            try {
                const newDeposit = {
                    user: modalDiv.querySelector('#modalUser').value,
                    bank: modalDiv.querySelector('#modalBank').value.trim(),
                    depositType: modalDiv.querySelector('#modalType').value.trim(),
                    amount: parseFloat(modalDiv.querySelector('#modalAmount').value),
                    startDate: modalDiv.querySelector('#modalStart').value.trim() || null,
                    maturityDate: modalDiv.querySelector('#modalMaturity').value.trim() || null,
                    rate: modalDiv.querySelector('#modalRate').value ? parseFloat(modalDiv.querySelector('#modalRate').value) : null,
                    interestType: modalDiv.querySelector('#modalInterestType').value,
                    notes: modalDiv.querySelector('#modalNotes').value.trim(),
                    is_unlocked: deposit?.is_unlocked || 0
                };
                if (!newDeposit.bank || !newDeposit.depositType || isNaN(newDeposit.amount) || newDeposit.amount <= 0) {
                    throw new Error('请填写银行、类型、有效金额');
                }
                if (deposit) {
                    newDeposit.id = deposit.id;
                    await saveDeposit(newDeposit);
                    showToast('✅ 存款已更新');
                } else {
                    await saveDeposit(newDeposit);
                    showToast('✅ 存款已添加');
                }
                closeModal();
                await refreshData();
            } catch (err) {
                alert('保存失败：' + err.message);
            } finally {
                saving = false;
            }
        };
        modalDiv.querySelector('#modalCancel').onclick = closeModal;
        modalDiv.addEventListener('click', e => {
            if (e.target === modalDiv) closeModal();
        });
    }

    // ---------- 生成报表HTML（用于PDF导出，含图表容器） ----------
    function generateReportHTML(data) {
        const totalAmount = data.reduce((s, d) => s + d.amount, 0);
        const totalCurr = data.reduce((s, d) => s + (d.currentInterest || 0), 0);
        const totalMat = data.reduce((s, d) => s + (d.totalInterest || 0), 0);

        const byBank = {};
        const byType = {};
        const byHolder = {};
        const monthMap = new Map();
        data.forEach(d => {
            byBank[d.bank] = (byBank[d.bank] || 0) + d.amount;
            byType[d.depositType] = (byType[d.depositType] || 0) + d.amount;
            byHolder[d.user] = (byHolder[d.user] || 0) + d.amount;
            if (d.startDate) {
                const ym = d.startDate.slice(0,7);
                const cur = monthMap.get(ym) || { deposit:0, maturity:0 };
                cur.deposit += d.amount;
                monthMap.set(ym, cur);
            }
            if (d.maturityDate) {
                const ym = d.maturityDate.slice(0,7);
                const cur = monthMap.get(ym) || { deposit:0, maturity:0 };
                cur.maturity += d.amount;
                monthMap.set(ym, cur);
            }
        });

        const months = [...monthMap.keys()].sort();
        const depositData = months.map(m => monthMap.get(m).deposit);
        const maturityData = months.map(m => monthMap.get(m).maturity);

        // 构造图表数据JSON，用于在HTML中通过JS渲染
        const chartData = {
            byBank: Object.entries(byBank).map(([name, value]) => ({ name, value: Math.round(value*100)/100 })),
            byType: Object.entries(byType).map(([name, value]) => ({ name, value: Math.round(value*100)/100 })),
            byHolder: Object.entries(byHolder).map(([name, value]) => ({ name, value: Math.round(value*100)/100 })),
            months,
            depositData,
            maturityData
        };

        return `
        <div style="font-family:'PingFang SC','Microsoft YaHei',sans-serif;color:#1a202c;padding:20px;background:white;">
            <h2 style="text-align:center;color:#4f6ef7;">💰 存款报表</h2>
            <p style="text-align:center;color:#5a6c7d;">${currentUser === null ? '所有用户合计' : currentUser} | ${new Date().toLocaleString()}</p>
            <div style="display:flex;justify-content:space-around;margin:15px 0;background:#f0f4f8;border-radius:12px;padding:12px;">
                <div><b>本金总额</b><br>¥${totalAmount.toFixed(2)}</div>
                <div><b>当前利息</b><br>¥${totalCurr.toFixed(2)}</div>
                <div><b>到期利息</b><br>¥${totalMat.toFixed(2)}</div>
                <div><b>存款笔数</b><br>${data.length}</div>
            </div>
            <table style="width:100%;border-collapse:collapse;font-size:11px;margin-bottom:20px;">
                <thead><tr style="background:#4f6ef7;color:white;">
                    <th>银行</th><th>类型</th><th>持有人</th><th>金额</th><th>起始日</th><th>到期日</th><th>利率%</th><th>计息</th><th>当前利息</th><th>到期利息</th>
                </tr></thead>
                <tbody>
                ${data.map((d, i) => `<tr style="background:${i%2===0?'#f8fafc':'white'};">
                    <td>${escapeHtml(d.bank)}</td>
                    <td>${escapeHtml(d.depositType)}</td>
                    <td>${escapeHtml(d.user)}</td>
                    <td style="text-align:right;">¥${d.amount.toFixed(2)}</td>
                    <td>${d.startDate || '-'}</td>
                    <td>${d.maturityDate || '-'}</td>
                    <td style="text-align:right;">${d.rate != null ? d.rate.toFixed(2) : '-'}</td>
                    <td>${d.interestType === 'compound' ? '复利' : '单利'}</td>
                    <td style="text-align:right;">¥${d.currentInterest.toFixed(2)}</td>
                    <td style="text-align:right;">¥${d.totalInterest.toFixed(2)}</td>
                </tr>`).join('')}
                </tbody>
            </table>
            <!-- 图表容器 -->
            <div style="display:flex;flex-wrap:wrap;gap:20px;justify-content:center;">
                <div style="width:45%;min-width:300px;height:250px;" id="pdfBankChart"></div>
                <div style="width:45%;min-width:300px;height:250px;" id="pdfTypeChart"></div>
                <div style="width:45%;min-width:300px;height:250px;" id="pdfHolderChart"></div>
                ${months.length ? `<div style="width:90%;min-width:400px;height:300px;" id="pdfTrendChart"></div>` : ''}
            </div>
            <script>
                // 内联图表渲染脚本，将在截图前执行
                (function() {
                    const chartData = ${JSON.stringify(chartData)};
                    if (typeof echarts !== 'undefined') {

    // ========== 改进的 PDF 导出（支持图表，无截断） ==========
    async function exportPDF() {
        if (typeof html2canvas === 'undefined' || typeof echarts === 'undefined') {
            alert('请确保 html2canvas 和 ECharts 已加载');
            return;
        }

        const data = currentFilteredDeposits.length > 0 ? currentFilteredDeposits : allDeposits;
        if (!data.length) {
            showToast('⚠️ 无数据可导出');
            return;
        }

        const reportHTML = generateReportHTML(data);
        const container = document.createElement('div');
        container.style.cssText = 'position:absolute; left:-9999px; width:1100px; background:white; padding:20px;';
        container.innerHTML = reportHTML;
        document.body.appendChild(container);

        // 等待图表渲染
        await new Promise(resolve => setTimeout(resolve, 600));

        try {
            const canvas = await html2canvas(container, {
                scale: 2,
                useCORS: true,
                logging: false,
                backgroundColor: '#ffffff'
            });

            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('landscape', 'mm', 'a4');
            const pageWidth = pdf.internal.pageSize.getWidth();
            const pageHeight = pdf.internal.pageSize.getHeight();
            const margin = 10;
            const contentWidth = pageWidth - margin * 2;
            const scale = contentWidth / canvas.width;
            const contentHeight = canvas.height * scale;
            const pageContentHeight = pageHeight - margin * 2;

            let remainingHeight = contentHeight;
            let yOffset = 0;
            while (remainingHeight > 0) {
                const currentPageHeight = Math.min(remainingHeight, pageContentHeight);
                const srcY = (yOffset / scale);
                const srcHeight = (currentPageHeight / scale);

                const pageCanvas = document.createElement('canvas');
                pageCanvas.width = canvas.width;
                pageCanvas.height = srcHeight;
                const ctx = pageCanvas.getContext('2d');
                ctx.drawImage(canvas, 0, srcY, canvas.width, srcHeight, 0, 0, canvas.width, srcHeight);
                const imgData = pageCanvas.toDataURL('image/png');

                if (yOffset === 0) {
                    pdf.addImage(imgData, 'PNG', margin, margin, contentWidth, currentPageHeight);
                } else {
                    pdf.addPage();
                    pdf.addImage(imgData, 'PNG', margin, margin, contentWidth, currentPageHeight);
                }

                yOffset += currentPageHeight;
                remainingHeight -= currentPageHeight;
            }

            const label = currentUser === null ? '合计' : currentUser;
            const filename = `存款报表_${label}_${new Date().toISOString().slice(0,10)}.pdf`;
            const pdfBlob = pdf.output('blob');

            if (window.cordova?.file && cordovaReady) {
                await exportWithCordova(pdfBlob, filename, 'application/pdf');
                showToast('✅ PDF已保存到 Download/存款管家备份');
            } else {
                pdf.save(filename);
                showToast('📄 PDF已下载');
            }
        } catch (e) {
            console.error(e);
            showToast('❌ PDF生成失败');
        } finally {
            document.body.removeChild(container);
        }
    }

    // ========== 统计模态框（增加导出PDF按钮） ==========
    async function showStatsModal() {
        const data = currentFilteredDeposits;
        if (!data.length) {
            alert('当前筛选条件下无存款数据');
            return;
        }
        const totalAmount = data.reduce((s, d) => s + d.amount, 0);
        const totalCurr = data.reduce((s, d) => s + (d.currentInterest || 0), 0);
        const totalMat = data.reduce((s, d) => s + (d.totalInterest || 0), 0);
        const byHolder = {}, byType = {}, byBank = {};
        data.forEach(d => {
            byHolder[d.user] = (byHolder[d.user] || 0) + d.amount;
            byType[d.depositType] = (byType[d.depositType] || 0) + d.amount;
            byBank[d.bank] = (byBank[d.bank] || 0) + d.amount;
        });
        const monthMap = new Map();
        data.forEach(d => {
            if (d.startDate) {
                let ym = d.startDate.slice(0, 7);
                let cur = monthMap.get(ym) || { deposit: 0, maturity: 0 };
                cur.deposit += d.amount;
                monthMap.set(ym, cur);
            }
            if (d.maturityDate) {
                let ym = d.maturityDate.slice(0, 7);
                let cur = monthMap.get(ym) || { deposit: 0, maturity: 0 };
                cur.maturity += d.amount;
                monthMap.set(ym, cur);
            }
        });
        const months = [...monthMap.keys()].sort();
        const depositData = months.map(m => monthMap.get(m).deposit);
        const maturityData = months.map(m => monthMap.get(m).maturity);

        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        modalDiv.innerHTML = `<div class="modal-content" style="max-width:95%;width:700px;">
            <h3>📊 统计图表</h3><p style="text-align:center;">💰 ¥${totalAmount.toFixed(2)} | 💹 ¥${totalCurr.toFixed(2)} | 📅 ¥${totalMat.toFixed(2)}</p>
            <div class="chart-card"><div id="holderChart" style="height:220px;"></div><div style="font-size:10px;text-align:center;color:#9ca3af;">✨ 双击放大</div></div>
            <div class="chart-card"><div id="typeChart" style="height:220px;"></div><div style="font-size:10px;text-align:center;color:#9ca3af;">✨ 双击放大</div></div>
            <div class="chart-card"><div id="bankChart" style="height:220px;"></div><div style="font-size:10px;text-align:center;color:#9ca3af;">✨ 双击放大</div></div>
            <div class="chart-card"><div id="trendChart" style="height:280px;"></div><div style="font-size:10px;text-align:center;color:#9ca3af;">📆 月度存入 vs 到期金额</div></div>
            <button id="exportStatsPDFBtn" class="success small" style="margin-top:8px;width:100%;">📄 导出报表PDF</button>
            <button id="closeStatsBtn" class="secondary small" style="margin-top:4px;width:100%;">关闭</button>
        </div>`;
        document.body.appendChild(modalDiv);

        const drawPie = (id, title, dataObj) => {
            const chartDom = modalDiv.querySelector(`#${id}`);
            if (!chartDom) return;
            const chart = echarts.init(chartDom);
            chart.setOption({
                title: { text: title, left: 'center', textStyle: { fontSize: 13 } },
                tooltip: { trigger: 'item', formatter: '{b}: ¥{c} ({d}%)' },
                series: [{
                    type: 'pie',
                    radius: ['40%', '65%'],
                    data: Object.entries(dataObj).map(([n, v]) => ({ name: n, value: Math.round(v * 100) / 100 })),
                    label: { show: true, formatter: '{b}', fontSize: 10 }
                }]
            });
            enableDoubleClickZoom(chart);
        };
        drawPie('holderChart', '持有人分布', byHolder);
        drawPie('typeChart', '存款类型分布', byType);
        drawPie('bankChart', '银行分布', byBank);
        if (months.length) {
            const trendChart = echarts.init(modalDiv.querySelector('#trendChart'));
            trendChart.setOption({
                tooltip: { trigger: 'axis' },
                legend: { data: ['存入金额', '到期金额'] },
                xAxis: { type: 'category', data: months, axisLabel: { rotate: 30 } },
                yAxis: { type: 'value', name: '金额(元)' },
                series: [
                    { name: '存入金额', type: 'bar', barWidth: '35%', data: depositData, itemStyle: { color: '#4f6ef7', borderRadius: [4, 4, 0, 0] } },
                    { name: '到期金额', type: 'bar', barWidth: '35%', data: maturityData, itemStyle: { color: '#f59e0b', borderRadius: [4, 4, 0, 0] } }
                ]
            });
            enableDoubleClickZoom(trendChart);
        }

        modalDiv.querySelector('#closeStatsBtn').onclick = () => modalDiv.remove();
        modalDiv.querySelector('#exportStatsPDFBtn').onclick = () => {
            modalDiv.remove();
            exportPDF();
        };
        modalDiv.addEventListener('click', e => {
            if (e.target === modalDiv) modalDiv.remove();
        });
    }

    // ========== 到期提醒 ==========
    async function checkReminders(manual = false) {
        const upcoming = await getUpcomingMaturities(currentUser);
        if (upcoming.length) {
            let msg = '📢 <b>未来7天到期存款：</b>\n\n';
            for (let d of upcoming) {
                const days = Math.ceil((new Date(d.maturityDate) - new Date()) / (1000 * 3600 * 24));
                msg += `• ${d.bank} ${d.depositType} — ¥${d.amount.toFixed(2)} — <b>${days}天</b>后到期 (${d.maturityDate})\n`;
            }
            const modalDiv = document.createElement('div');
            modalDiv.className = 'modal';
            modalDiv.innerHTML = `<div class="modal-content" style="max-width:450px;"><h3>⏰ 到期提醒</h3><div style="white-space:pre-line;font-size:0.9rem;line-height:1.7;">${msg}</div><button id="closeRemindModal" class="secondary small" style="margin-top:12px;width:100%;">关闭</button></div>`;
            document.body.appendChild(modalDiv);
            modalDiv.querySelector('#closeRemindModal').onclick = () => modalDiv.remove();
            modalDiv.addEventListener('click', e => {
                if (e.target === modalDiv) modalDiv.remove();
            });
        } else if (manual) {
            alert('✅ 未来7天内没有即将到期的存款');
        }
    }

    async function getUpcomingMaturities(user, days = 7) {
        const deposits = await getDeposits(user);
        const today = todayStart();
        const future = new Date(today);
        future.setDate(today.getDate() + days);
        return deposits.filter(d => {
            if (!d.maturityDate) return false;
            const mat = parseDate(d.maturityDate);
            if (!mat) return false;
            return mat >= today && mat <= future;
        });
    }

    // ========== 到期预测 ==========
    async function getMonthlyMaturityForecast(user) {
        const deposits = await getDeposits(user);
        const today = todayStart();
        const endDate = new Date(today);
        endDate.setDate(today.getDate() + 365);
        const monthly = {};
        for (let d of deposits) {
            if (!d.maturityDate) continue;
            const mat = parseDate(d.maturityDate);
            if (!mat || mat < today || mat > endDate) continue;
            const total = d.amount + await calculateTotalInterest(d);
            const key = `${mat.getFullYear()}-${String(mat.getMonth() + 1).padStart(2, '0')}`;
            monthly[key] = (monthly[key] || 0) + total;
        }
        return monthly;
    }

    async function showForecast() {
        const monthly = await getMonthlyMaturityForecast(currentUser);
        const months = Object.keys(monthly).sort();
        if (!months.length) {
            alert('未来12个月无到期存款');
            return;
        }
        const amounts = months.map(m => monthly[m]);
        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        modalDiv.style.zIndex = '2000';
        modalDiv.innerHTML = `<div class="modal-content" style="max-width:95%;width:500px;"><h3 style="text-align:center;">📈 未来12个月到期资金预测</h3><div id="forecastChart" style="height:300px;"></div><button id="closeForecastBtn" class="secondary small" style="margin-top:12px;width:100%;">关闭</button></div>`;
        document.body.appendChild(modalDiv);
        const chart = echarts.init(modalDiv.querySelector('#forecastChart'));
        chart.setOption({
            tooltip: { trigger: 'axis', formatter: p => `${p[0].axisValue}<br/>到期: <b>¥${p[0].value.toFixed(2)}</b>` },
            xAxis: { type: 'category', data: months, axisLabel: { rotate: 30 } },
            yAxis: { type: 'value', name: '金额(元)' },
            series: [{
                type: 'bar',
                data: amounts,
                itemStyle: { color: '#10b981', borderRadius: [6, 6, 0, 0] },
                label: { show: true, position: 'top', formatter: p => (p.value / 10000).toFixed(1) + '万' }
            }]
        });
        enableDoubleClickZoom(chart);
        modalDiv.querySelector('#closeForecastBtn').onclick = () => modalDiv.remove();
        modalDiv.addEventListener('click', e => {
            if (e.target === modalDiv) modalDiv.remove();
        });
    }

    function escapeHtml(str) {
        if (!str) return '';
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
        return str.replace(/[&<>"']/g, m => map[m]);
    }

    function populateYearSelectors() {
        const cy = new Date().getFullYear();
        const years = [];
        for (let y = cy - 5; y <= cy + 5; y++) years.push(y);
        const update = id => {
            const s = document.getElementById(id);
            if (s) s.innerHTML = '<option value="">全部</option>' + years.map(y => `<option value="${y}">${y}年</option>`).join('');
        };
        update('startYearQuick');
        update('maturityYearQuick');
    }

    // ========== 事件绑定 ==========
    function bindEvents() {
        document.getElementById('userSelect').addEventListener('change', async e => {
            currentUser = e.target.value === '__all__' ? null : e.target.value;
            await refreshData();
        });
        document.getElementById('addUserBtn').addEventListener('click', async () => {
            const name = prompt('新用户名');
            if (name && await addUser(name)) {
                await refreshUserSelector();
                await refreshData();
                showToast('✅ 用户已添加');
            } else if (name) {
                alert('添加失败或已存在');
            }
        });
        document.getElementById('manageUserBtn').addEventListener('click', showManageUsersModal);
        document.getElementById('statsBtn').addEventListener('click', showStatsModal);
        document.getElementById('remindBtn').addEventListener('click', () => checkReminders(true));
        document.getElementById('forecastBtn').addEventListener('click', showForecast);
        document.getElementById('fixDataBtn').addEventListener('click', fixDuplicateRecords);
        document.getElementById('searchInput').addEventListener('input', () => updateList());
        document.getElementById('addDepositBtn').addEventListener('click', () => showDepositModal());
        document.getElementById('backupCsvBtn').addEventListener('click', async () => {
            const csv = generateCSVBlob(currentUser, await getDeposits(currentUser));
            const ts = new Date().toISOString().slice(0, 19).replace(/:/g, '-');
            const fn = `存款备份_${currentUser === null ? '合计' : currentUser}_${ts}.csv`;
            if (window.cordova?.file && cordovaReady) {
                await exportWithCordova(csv, fn, 'text/csv');
            } else {
                fallbackDownload(csv, fn, 'text/csv');
            }
        });
        document.getElementById('backupJsonBtn').addEventListener('click', backupJSON);
        document.getElementById('openBackupFolderBtn').addEventListener('click', openBackupFolder);
        document.getElementById('pdfBtn').addEventListener('click', exportPDF);
        document.getElementById('sortSelect').addEventListener('change', async () => {
            applySort();
            await updateList();
        });

        const fileInput = document.getElementById('restoreFileInput');
        fileInput.addEventListener('change', async e => {
            if (!e.target.files.length) return;
            try {
                const result = await importFromCSV(e.target.files[0]);
                alert(`✅ 导入完成：新增 ${result.added} 条记录。\n涉及用户：${result.users.join(', ')}`);
                await refreshUserSelector();
                await refreshData();
            } catch (err) {
                alert('恢复失败：' + err.message);
            }
            fileInput.value = '';
        });

        const jsonInput = document.getElementById('restoreJsonInput');
        jsonInput.addEventListener('change', async e => {
            if (!e.target.files.length) return;
            try {
                await restoreJSON(e.target.files[0]);
            } catch (err) {
                alert('JSON恢复失败：' + err.message);
            }
            jsonInput.value = '';
        });

        document.getElementById('startYearQuick').addEventListener('change', function () {
            const y = this.value;
            document.getElementById('startDateFrom').value = y ? `${y}-01-01` : '';
            document.getElementById('startDateTo').value = y ? `${y}-12-31` : '';
            updateList();
        });
        document.getElementById('maturityYearQuick').addEventListener('change', function () {
            const y = this.value;
            document.getElementById('maturityDateFrom').value = y ? `${y}-01-01` : '';
            document.getElementById('maturityDateTo').value = y ? `${y}-12-31` : '';
            updateList();
        });

        ['filterBank', 'filterType', 'filterHolder', 'minAmount', 'maxAmount', 'startDateFrom', 'startDateTo', 'maturityDateFrom', 'maturityDateTo'].forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                const eventType = (id === 'minAmount' || id === 'maxAmount') ? 'input' : 'change';
                el.addEventListener(eventType, () => updateList());
            }
        });
        document.getElementById('clearFiltersBtn').addEventListener('click', () => {
            ['filterBank', 'filterType', 'filterHolder', 'minAmount', 'maxAmount', 'searchInput', 'startDateFrom', 'startDateTo', 'maturityDateFrom', 'maturityDateTo'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.value = '';
            });
            document.getElementById('startYearQuick').value = '';
            document.getElementById('maturityYearQuick').value = '';
            updateList();
            showToast('✅ 筛选条件已清除');
        });

        const toggleBtn = document.getElementById('filterToggleBtn');
        const panel = document.getElementById('filterPanel');
        if (toggleBtn && panel) {
            toggleBtn.addEventListener('click', () => {
                const collapsed = panel.classList.toggle('collapsed');
                toggleBtn.textContent = collapsed ? '🔍 展开筛选条件' : '🔍 收起筛选条件';
            });
            if (window.innerWidth <= 640) {
                panel.classList.add('collapsed');
                toggleBtn.style.display = 'block';
            } else {
                panel.classList.remove('collapsed');
                toggleBtn.style.display = 'none';
            }
            window.addEventListener('resize', () => {
                if (window.innerWidth <= 640) {
                    toggleBtn.style.display = 'block';
                } else {
                    toggleBtn.style.display = 'none';
                    panel.classList.remove('collapsed');
                }
            });
        }
    }

    (async function init() {
        await openDB();
        let users = await getUsers();
        if (!users.length) await addUser('我的存款');
        currentUser = null;
        await refreshUserSelector();
        await refreshData();
        bindEvents();
        populateYearSelectors();
        document.getElementById('startDateFrom').value = '';
        document.getElementById('startDateTo').value = '';
        document.getElementById('maturityDateFrom').value = '';
        document.getElementById('maturityDateTo').value = '';
        document.addEventListener('deviceready', () => {
            cordovaReady = true;
            showToast('📱 存款管家旗舰版已就绪', 3000);
        }, false);
        checkReminders(false);
        setInterval(() => checkReminders(false), 24 * 3600 * 1000);
    })();
})();
